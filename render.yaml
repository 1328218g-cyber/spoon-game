services:
  - type: web
    name: spoon-game-server
    runtime: docker
    rootDir: server
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: standard
    healthCheckPath: /
    disk:
      name: edibot-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /data
      - key: NODE_ENV
        value: production
      - key: GOOGLE_TTS_API_KEY
        sync: false
      - key: SHARED_TOKEN_CAPACITY
        sync: false
      - key: SHARED_TOKEN_POOL
        sync: false
      - key: YOUTUBE_API_KEYS
        sync: false
      - key: BASE44_BACKUP_URL
        sync: false
      - key: BASE44_BACKUP_KEY
        sync: false
      - key: BASE44_LIST_URL
        sync: false
      - key: BASE44_LIST_KEY
        sync: false
      - key: BASE44_RESTORE_URL
        sync: false
      - key: BASE44_RESTORE_KEY
        sync: false
