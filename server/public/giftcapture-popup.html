<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>선물 애니메이션 재생</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html,body{margin:0;padding:0;background:#0a0a0a;overflow:hidden;height:100%}
  #stage{position:relative;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;background-size:cover;background-position:center}
  #animBox{width:min(80vw,80vh);height:min(80vw,80vh);display:flex;align-items:center;justify-content:center}
  #animBox img,#lottieBox{width:100%;height:100%;object-fit:contain}
  #lottieBox{width:100%;height:100%}
  #replayBtn{position:fixed;bottom:16px;right:16px;padding:10px 18px;border-radius:999px;border:none;
    background:#8b5cf6;color:#fff;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.4);
    display:none;z-index:10}
  #senderTag{position:fixed;top:16px;left:16px;color:#fff;font:600 14px -apple-system,sans-serif;
    background:rgba(0,0,0,.5);padding:6px 14px;border-radius:999px;display:none}
  #emptyMsg{color:rgba(255,255,255,.6);font:14px -apple-system,sans-serif;text-align:center}
</style>
</head>
<body>
  <div id="stage">
    <div id="emptyMsg">불러오는 중...</div>
  </div>
  <div id="senderTag"></div>
  <button id="replayBtn" onclick="playAnim()">🔁 다시 재생</button>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie.min.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const djId = params.get('djId') || '';
    const itemId = params.get('itemId') || '';
    let animInstance = null;
    let popupData = null;

    async function init(){
      const stage = document.getElementById('stage');
      try{
        const res = await fetch('/giftcapture/popup-data?djId='+encodeURIComponent(djId)+'&itemId='+encodeURIComponent(itemId));
        const d = await res.json();
        if(!d.success){
          stage.innerHTML = '<div id="emptyMsg">'+(d.error||'불러오지 못했어요')+'</div>';
          return;
        }
        popupData = d;
        if(d.bgImageUrl){ stage.style.backgroundImage = "url('"+d.bgImageUrl+"')"; }
        const tag = document.getElementById('senderTag');
        const combo = d.item.comboCount>1 ? ` x${d.item.comboCount}` : '';
        tag.textContent = (d.item.author||'')+' · '+(d.item.sticker||'')+combo;
        tag.style.display = 'block';
        stage.innerHTML = '<div id="animBox"></div>';
        playAnim();
      }catch(e){
        stage.innerHTML = '<div id="emptyMsg">오류: '+e.message+'</div>';
      }
    }

    async function playAnim(){
      if(!popupData || !popupData.item) return;
      const box = document.getElementById('animBox');
      const replayBtn = document.getElementById('replayBtn');
      if(!box) return;
      box.innerHTML = '';
      if(animInstance){ try{ animInstance.destroy(); }catch(e){} animInstance = null; }

      const item = popupData.item;
      if(item.lottieUrl){
        const lottieBox = document.createElement('div');
        lottieBox.id = 'lottieBox';
        box.appendChild(lottieBox);
        try{
          const proxied = '/giftcapture/lottie-proxy?url='+encodeURIComponent(item.lottieUrl);
          const res = await fetch(proxied);
          const json = await res.json();
          animInstance = lottie.loadAnimation({
            container: lottieBox,
            renderer: 'svg',
            loop: false,
            autoplay: true,
            animationData: json
          });
          replayBtn.style.display = 'block';
          return;
        }catch(e){
          // lottie 로드 실패하면 정지 이미지로 대체
        }
      }
      if(item.stickerImage){
        const img = document.createElement('img');
        img.src = item.stickerImage;
        box.appendChild(img);
      } else {
        box.innerHTML = '<div id="emptyMsg">이 선물은 이미지를 찾지 못했어요</div>';
      }
      replayBtn.style.display = 'block';
    }

    init();
  </script>
</body>
</html>
