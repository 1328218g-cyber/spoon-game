<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>선물 애니메이션 다시보기</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html,body{margin:0;padding:0;background:#0a0a0a;overflow:hidden;height:100%;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
  #outer{width:100vw;height:calc(100vh - 140px);display:flex;align-items:center;justify-content:center}
  #canvas{position:relative;overflow:hidden}
  #bgImgEl{position:absolute;left:0;top:0;width:100%;height:100%;display:block;z-index:1}
  #fgWrap{position:absolute;left:0;top:0;width:100%;height:100%;z-index:2;pointer-events:none}
  #animBox{position:absolute}
  #animBox img{display:block;width:100%;height:100%}
  #lottieBox{position:absolute;width:100%;height:100%}
  #senderTag{position:fixed;top:14px;left:14px;color:#fff;font:600 13px sans-serif;
    background:rgba(0,0,0,.55);padding:6px 14px;border-radius:999px;display:none;z-index:20}
  #emptyMsg{color:rgba(255,255,255,.6);font-size:14px;text-align:center;padding:0 24px;line-height:1.6}
  #noAnimNotice{position:fixed;top:14px;right:14px;color:rgba(255,220,120,.95);font-size:12px;
    background:rgba(0,0,0,.55);padding:6px 14px;border-radius:999px;display:none;z-index:20;max-width:280px;text-align:right}

  /* 🎯 애니메이션 크기/위치를 배경 대비 %로 직접 조절하는 컨트롤 — 스푼 실제 화면 비율에 눈으로 맞추기 위함 */
  #adjustBar{position:fixed;left:0;top:0;width:100%;background:#141018;display:none;
    flex-wrap:wrap;align-items:center;gap:14px;padding:8px 16px;box-sizing:border-box;z-index:15;font-size:12px;color:#fff}
  #adjustBar label{display:flex;align-items:center;gap:6px;white-space:nowrap}
  #adjustBar input[type=range]{accent-color:#8b5cf6;width:110px}
  #adjustBar .val{min-width:34px;text-align:right;font-variant-numeric:tabular-nums;color:rgba(255,255,255,.7)}

  /* 🎬 다시보기 컨트롤바 */
  #controls{position:fixed;left:0;bottom:0;width:100%;height:84px;background:#141018;
    display:none;flex-direction:column;justify-content:center;gap:8px;padding:8px 16px;box-sizing:border-box;z-index:10}
  #seekRow{display:flex;align-items:center;gap:10px}
  #seekSlider{flex:1;accent-color:#8b5cf6;height:6px;cursor:pointer}
  #frameLabel{color:rgba(255,255,255,.75);font-size:11px;min-width:70px;text-align:right;font-variant-numeric:tabular-nums}
  #btnRow{display:flex;align-items:center;justify-content:center;gap:10px}
  .ctrlBtn{background:#2a2438;color:#fff;border:none;border-radius:8px;padding:8px 14px;
    font-size:13px;font-weight:600;cursor:pointer}
  .ctrlBtn:hover{background:#38304c}
  #playBtn{background:#8b5cf6;min-width:64px}
  #playBtn:hover{background:#7a4bdb}
  .speedBtn.active{background:#8b5cf6}
</style>
</head>
<body>
  <div id="adjustBar">
    <label>크기 <input type="range" id="sizeSlider" min="5" max="200" value="55"><span class="val" id="sizeVal">55%</span></label>
    <label>가로위치 <input type="range" id="xSlider" min="0" max="100" value="50"><span class="val" id="xVal">50%</span></label>
    <label>세로위치 <input type="range" id="ySlider" min="0" max="100" value="35"><span class="val" id="yVal">35%</span></label>
  </div>
  <div id="outer">
    <div id="emptyMsg">불러오는 중...</div>
  </div>
  <div id="senderTag"></div>
  <div id="noAnimNotice">⚠️ 이 선물은 애니메이션이 없어요 (정지 이미지만 제공돼요)</div>

  <div id="controls">
    <div id="seekRow">
      <input type="range" id="seekSlider" min="0" max="100" value="0" step="1">
      <span id="frameLabel">0 / 0</span>
    </div>
    <div id="btnRow">
      <button class="ctrlBtn" onclick="stepFrame(-1)">◀ 프레임</button>
      <button class="ctrlBtn" id="playBtn" onclick="togglePlay()">▶ 재생</button>
      <button class="ctrlBtn" onclick="stepFrame(1)">프레임 ▶</button>
      <button class="ctrlBtn" onclick="restartAnim()">⏮ 처음부터</button>
      <span style="width:1px;height:20px;background:rgba(255,255,255,.15);margin:0 4px"></span>
      <button class="ctrlBtn speedBtn" data-speed="0.25" onclick="setSpeedBtn(this)">0.25x</button>
      <button class="ctrlBtn speedBtn" data-speed="0.5" onclick="setSpeedBtn(this)">0.5x</button>
      <button class="ctrlBtn speedBtn active" data-speed="1" onclick="setSpeedBtn(this)">1x</button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie.min.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const djId = params.get('djId') || '';
    const itemId = params.get('itemId') || '';
    let anim = null;
    let popupData = null;
    let isPlaying = false;
    let userSeeking = false;
    let mediaAspect = 1; // 애니메이션/이미지 가로:세로 비율 — 크기 슬라이더 계산에 사용
    let mediaNaturalW = 300; // 애니메이션/이미지 원본 가로 픽셀 — 배경과 비교해서 기본 크기(%)를 자동 계산하는 데 사용

    function availableArea(){
      return { w: window.innerWidth * 0.94, h: (window.innerHeight - 140) * 0.94 };
    }
    function probeImageSize(url){
      return new Promise((resolve)=>{
        const img = new Image();
        img.onload = ()=> resolve({ w: img.naturalWidth, h: img.naturalHeight });
        img.onerror = ()=> resolve(null);
        img.src = url;
      });
    }

    let canvasElW = 0, canvasElH = 0; // 실제 화면에 그려진 캔버스(배경) 픽셀 크기

    async function init(){
      try{
        const res = await fetch('/giftcapture/popup-data?djId='+encodeURIComponent(djId)+'&itemId='+encodeURIComponent(itemId));
        const d = await res.json();
        if(!d.success){
          document.getElementById('outer').innerHTML = '<div id="emptyMsg">'+(d.error||'불러오지 못했어요')+'</div>';
          return;
        }
        popupData = d;
        const tag = document.getElementById('senderTag');
        const combo = d.item.comboCount>1 ? ` x${d.item.comboCount}` : '';
        tag.textContent = (d.item.author||'')+' · '+(d.item.sticker||'')+combo;
        tag.style.display = 'block';

        let mediaKind=null, lottieJson=null;
        if(d.item.lottieUrl){
          try{
            const proxied = '/giftcapture/lottie-proxy?url='+encodeURIComponent(d.item.lottieUrl);
            const jres = await fetch(proxied);
            lottieJson = await jres.json();
            mediaAspect = (Number(lottieJson.w)||300) / (Number(lottieJson.h)||300);
            mediaNaturalW = Number(lottieJson.w)||300;
            mediaKind = 'lottie';
          }catch(e){ mediaKind = null; }
        }
        if(!mediaKind && d.item.stickerImage){
          const sz = await probeImageSize(d.item.stickerImage);
          if(sz){ mediaAspect = sz.w/sz.h; mediaNaturalW = sz.w; mediaKind = 'image'; }
        }
        if(!mediaKind){
          document.getElementById('outer').innerHTML = '<div id="emptyMsg">이 선물은 이미지를 찾지 못했어요<br>(스푼 스티커 목록에서 이름이 정확히 매칭 안 됐을 수 있어요)</div>';
          return;
        }

        // 캔버스(=배경) 크기 결정 — 배경 이미지가 있으면 그 원본 크기, 없으면 세로가 긴 임의 기본값(폰 화면 비슷하게)
        let canvasW = 720, canvasH = 1280, hasBg = false;
        if(d.bgImageUrl){
          const bgSize = await probeImageSize(d.bgImageUrl);
          if(bgSize){ canvasW = bgSize.w; canvasH = bgSize.h; hasBg = true; }
        }
        const area = availableArea();
        const scale = Math.min(1, area.w/canvasW, area.h/canvasH);
        canvasElW = Math.round(canvasW*scale);
        canvasElH = Math.round(canvasH*scale);

        // 🎯 자동 기본 크기 — 애니메이션 원본 픽셀 크기와 배경 원본 픽셀 크기를 비교해서,
        // "배경 대비 실제 비율 그대로"를 크기 슬라이더 기본값으로 잡는다. (너무 작거나 크게 나오지 않게 20~90% 사이로 제한)
        // 🎯 자동 기본 크기 — "업로드한 배경 사진의 해상도"랑 비교하면 안 된다 (배경마다 해상도가
        // 제각각이라 기준이 될 수 없음). 대신 스푼이 실제로 쓰는 표준 세로영상 가로폭(추정치 720px)을
        // 기준 삼아서, 그 표준 화면 대비 스티커 원본 크기 비율을 그대로 쓴다 — 그러면 배경 해상도가
        // 얼마든 스티커가 항상 "실제 방송에서 보이는 것과 같은 비율"로 나온다.
        // (720이 실제 스푼 표준값과 다르면 계속 크거나 작게 보일 텐데, 그럴 땐 이 숫자만 조정하면 됨)
        const REFERENCE_CANVAS_WIDTH = 720
        const autoSizePct = Math.round(Math.min(200, Math.max(5, (mediaNaturalW/REFERENCE_CANVAS_WIDTH)*100)));
        const sizeSliderEl = document.getElementById('sizeSlider');
        sizeSliderEl.value = autoSizePct;
        document.getElementById('sizeVal').textContent = autoSizePct+'%';

        const outer = document.getElementById('outer');
        outer.innerHTML = '<div id="canvas" style="width:'+canvasElW+'px;height:'+canvasElH+'px">'
          + (hasBg ? '<img id="bgImgEl" src="'+d.bgImageUrl+'">' : '')
          + '<div id="fgWrap"></div></div>';

        if(mediaKind==='lottie'){
          document.getElementById('fgWrap').innerHTML = '<div id="animBox"><div id="lottieBox"></div></div>';
          startLottie(lottieJson, document.getElementById('lottieBox'));
        } else {
          document.getElementById('fgWrap').innerHTML = '<div id="animBox"><img src="'+d.item.stickerImage+'"></div>';
          document.getElementById('noAnimNotice').style.display = 'block';
        }

        document.getElementById('adjustBar').style.display = 'flex';
        applyAdjust();
      }catch(e){
        document.getElementById('outer').innerHTML = '<div id="emptyMsg">오류: '+e.message+'</div>';
      }
    }

    // 🎯 크기/가로위치/세로위치 슬라이더 값을 실제 화면에 반영한다.
    // 크기(%) = 캔버스(배경) 너비 대비 애니메이션 너비 비율. 위치(%) = 캔버스 안에서 중심점 좌표.
    function applyAdjust(){
      const box = document.getElementById('animBox');
      if(!box || !canvasElW) return;
      const sizePct = Number(document.getElementById('sizeSlider').value);
      const xPct = Number(document.getElementById('xSlider').value);
      const yPct = Number(document.getElementById('ySlider').value);
      const w = canvasElW * (sizePct/100);
      const h = w / mediaAspect;
      box.style.width = w+'px';
      box.style.height = h+'px';
      // 🔒 캔버스 밖으로 잘려서 안 보이는 일 없게, 위치를 캔버스 안쪽으로 고정(clamp)한다.
      // (크기가 캔버스보다 크면 가운데 정렬로 대체)
      let left = canvasElW*(xPct/100) - w/2;
      let top = canvasElH*(yPct/100) - h/2;
      left = w >= canvasElW ? (canvasElW-w)/2 : Math.max(0, Math.min(canvasElW-w, left));
      top = h >= canvasElH ? (canvasElH-h)/2 : Math.max(0, Math.min(canvasElH-h, top));
      box.style.left = left+'px';
      box.style.top = top+'px';
      document.getElementById('sizeVal').textContent = sizePct+'%';
      document.getElementById('xVal').textContent = xPct+'%';
      document.getElementById('yVal').textContent = yPct+'%';
    }
    ['sizeSlider','xSlider','ySlider'].forEach(id=>{
      document.getElementById(id).addEventListener('input', applyAdjust);
    });

    function startLottie(json, container){
      try{
        anim = lottie.loadAnimation({
          container: container,
          renderer: 'svg',
          loop: true,
          autoplay: false,
          animationData: json
        });
        anim.addEventListener('DOMLoaded', ()=>{
          const total = anim.totalFrames;
          const slider = document.getElementById('seekSlider');
          slider.max = Math.max(0, Math.floor(total)-1);
          slider.value = 0;
          updateFrameLabel(0, total);
          document.getElementById('controls').style.display = 'flex';
          play();
        });
        anim.addEventListener('enterFrame', ()=>{
          if(userSeeking) return;
          const slider = document.getElementById('seekSlider');
          slider.value = Math.floor(anim.currentFrame);
          updateFrameLabel(anim.currentFrame, anim.totalFrames);
        });
        anim.addEventListener('data_failed', ()=>{
          document.getElementById('outer').innerHTML = '<div id="emptyMsg">애니메이션 데이터가 손상되어 있어요</div>';
        });
      }catch(e){
        document.getElementById('outer').innerHTML = '<div id="emptyMsg">애니메이션을 불러오지 못했어요</div>';
      }
    }

    function updateFrameLabel(cur, total){
      document.getElementById('frameLabel').textContent = Math.floor(cur)+' / '+Math.floor(total);
    }
    function play(){
      if(!anim) return;
      anim.play();
      isPlaying = true;
      document.getElementById('playBtn').textContent = '⏸ 일시정지';
    }
    function pause(){
      if(!anim) return;
      anim.pause();
      isPlaying = false;
      document.getElementById('playBtn').textContent = '▶ 재생';
    }
    function togglePlay(){
      if(!anim) return;
      isPlaying ? pause() : play();
    }
    function restartAnim(){
      if(!anim) return;
      anim.goToAndPlay(0, true);
      isPlaying = true;
      document.getElementById('playBtn').textContent = '⏸ 일시정지';
    }
    function stepFrame(delta){
      if(!anim) return;
      pause();
      const next = Math.min(anim.totalFrames-1, Math.max(0, Math.floor(anim.currentFrame)+delta));
      anim.goToAndStop(next, true);
      document.getElementById('seekSlider').value = next;
      updateFrameLabel(next, anim.totalFrames);
    }
    function setSpeedBtn(btn){
      document.querySelectorAll('.speedBtn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      if(anim) anim.setSpeed(Number(btn.dataset.speed));
    }

    const slider = document.getElementById('seekSlider');
    slider.addEventListener('mousedown', ()=>{ userSeeking = true; pause(); });
    slider.addEventListener('touchstart', ()=>{ userSeeking = true; pause(); });
    slider.addEventListener('input', ()=>{
      if(!anim) return;
      const f = Number(slider.value);
      anim.goToAndStop(f, true);
      updateFrameLabel(f, anim.totalFrames);
    });
    slider.addEventListener('mouseup', ()=>{ userSeeking = false; });
    slider.addEventListener('touchend', ()=>{ userSeeking = false; });

    document.addEventListener('keydown', (e)=>{
      if(e.code==='Space'){ e.preventDefault(); togglePlay(); }
      else if(e.code==='ArrowLeft'){ e.preventDefault(); stepFrame(-1); }
      else if(e.code==='ArrowRight'){ e.preventDefault(); stepFrame(1); }
    });

    init();
  </script>
</body>
</html>
