<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>선물 애니메이션 다시보기</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html,body{margin:0;padding:0;background:#0a0a0a;overflow:hidden;height:100%;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
  #outer{width:100vw;min-height:150px;display:flex;align-items:center;justify-content:center;box-sizing:border-box}
  #canvas{position:relative;overflow:hidden;background:#000}
  #bgImgEl{position:absolute;left:0;top:0;width:100%;height:100%;display:block;z-index:1;object-fit:contain}
  #fgWrap{position:absolute;left:0;top:0;width:100%;height:100%;z-index:2;pointer-events:none}
  #animBox{position:absolute}
  #animBox img{display:block;width:100%;height:100%}
  #lottieBox{position:absolute;width:100%;height:100%}
  #senderTag{position:fixed;top:14px;left:14px;color:#fff;font:600 13px sans-serif;
    background:rgba(0,0,0,.55);padding:6px 14px;border-radius:999px;display:none;z-index:20}
  #emptyMsg{color:rgba(255,255,255,.6);font-size:14px;text-align:center;padding:0 24px;line-height:1.6}
  #noAnimNotice{position:fixed;top:14px;right:14px;color:rgba(255,220,120,.95);font-size:12px;
    background:rgba(0,0,0,.55);padding:6px 14px;border-radius:999px;display:none;z-index:20;max-width:280px;text-align:right}

  /* 🎬 하단 컨트롤 — 구간 탐색 슬라이더 + 일시정지/재생, 캡처(저장) */
  #controls{position:fixed;left:0;bottom:0;width:100%;background:#141018;
    display:none;flex-direction:column;justify-content:center;gap:8px;padding:10px 16px;box-sizing:border-box;z-index:10}
  #seekRow{display:flex;align-items:center;gap:10px}
  #seekSlider{flex:1;accent-color:#8b5cf6;height:6px;cursor:pointer}
  #frameLabel{color:rgba(255,255,255,.75);font-size:11px;min-width:70px;text-align:right;font-variant-numeric:tabular-nums}
  #btnRow{display:flex;align-items:center;justify-content:center;gap:12px}
  .ctrlBtn{background:#2a2438;color:#fff;border:none;border-radius:10px;padding:12px 22px;
    font-size:15px;font-weight:700;cursor:pointer}
  .ctrlBtn:hover{background:#38304c}
  #playBtn{background:#8b5cf6;min-width:110px}
  #playBtn:hover{background:#7a4bdb}
  #captureBtn{background:#e0952f;min-width:110px}
  #captureBtn:hover{background:#c77f20}
  #recordBtn{background:#16a34a;min-width:110px}
  #recordBtn:hover{background:#128a3e}
  #recordBtn:disabled,#captureBtn:disabled,#playBtn:disabled{opacity:.55;cursor:default}
</style>
</head>
<body>
  <div id="outer">
    <div id="emptyMsg">불러오는 중...</div>
  </div>
  <div id="senderTag"></div>
  <div id="noAnimNotice">⚠️ 이 선물은 애니메이션이 없어요 (정지 이미지만 제공돼요)</div>

  <div id="controls">
    <div id="seekRow">
      <input type="range" id="seekSlider" min="0" max="100" value="0" step="1">
      <span id="frameLabel">0 / 0</span>
    </div>
    <div id="btnRow">
      <button class="ctrlBtn" id="playBtn" onclick="togglePlay()">▶ 재생</button>
      <button class="ctrlBtn" id="captureBtn" onclick="captureFrame()">📸 캡처</button>
      <button class="ctrlBtn" id="recordBtn" onclick="recordVideo()">🎥 영상 저장</button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie.min.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const djId = params.get('djId') || '';
    const itemId = params.get('itemId') || '';
    let anim = null;
    let popupData = null;
    let isPlaying = false;
    let userSeeking = false;
    let mediaAspect = 1;
    let mediaNaturalW = 300;
    let gcLottieJson = null; // 🎥 영상 저장(recordVideo)에서 캔버스 렌더러로 다시 로드할 때 재사용

    // 크기/위치는 더 이상 슬라이더로 조절하지 않고 고정값 사용 (배경 대비 스푼 표준 화면 비율로 자동 계산된 크기 + 얼굴 근처 기본 위치)
    const FIXED_X_PCT = 50; // 가로 가운데
    const FIXED_Y_PCT = 35; // 세로 위쪽(얼굴 근처)

    // 🎬 배경 비율("9:16" 등) 문자열을 캔버스 픽셀 크기로 변환한다. 긴 변을 1280으로 고정해두고
    // 짧은 변을 비율에 맞게 계산한다 — 배경 이미지의 실제 픽셀 크기와는 무관하게, 항상 설정한
    // 비율대로 캔버스가 잡힌다 (이미지는 안 잘리고 통째로 들어가며, 남는 공간은 검게 채워진다 — object-fit:contain).
    function ratioToCanvasSize(ratioStr){
      const parts = String(ratioStr||'9:16').split(':').map(Number);
      const rw = parts[0], rh = parts[1];
      if(!rw || !rh) return { w:720, h:1280 };
      const REF = 1280; // 긴 변 기준 픽셀 수
      if(rh >= rw) return { w: Math.round(REF*rw/rh), h: REF }; // 세로형/정사각형
      return { w: REF, h: Math.round(REF*rh/rw) }; // 가로형
    }

    function availableArea(){
      const controls = document.getElementById('controls');
      const bottomH = controls ? controls.offsetHeight : 70;
      return { w: window.innerWidth * 0.94, h: Math.max(150, (window.innerHeight - bottomH) * 0.94) };
    }
    function probeImageSize(url){
      return new Promise((resolve)=>{
        const img = new Image();
        img.onload = ()=> resolve({ w: img.naturalWidth, h: img.naturalHeight });
        img.onerror = ()=> resolve(null);
        img.src = url;
      });
    }
    // 스푼 CDN 이미지는 CORS가 안 걸려있는 경우가 있어서, 우리 서버 프록시를 거치게 해야
    // 나중에 "캡처" 버튼으로 캔버스에 그려서 저장할 때 브라우저 보안 정책에 안 걸린다.
    function proxied(url){ return '/trophy-editor/image-proxy?url='+encodeURIComponent(url); }

    let canvasElW = 0, canvasElH = 0;
    let canvasNaturalW = 720, canvasNaturalH = 1280;

    function relayout(){
      const canvas = document.getElementById('canvas');
      const outer = document.getElementById('outer');
      const controls = document.getElementById('controls');
      const bottomH = controls ? controls.offsetHeight : 70;
      if(outer){ outer.style.height = Math.max(150, window.innerHeight - bottomH)+'px'; }
      if(!canvas) return;
      const area = availableArea();
      const scale = Math.min(1, area.w/canvasNaturalW, area.h/canvasNaturalH);
      canvasElW = Math.round(canvasNaturalW*scale);
      canvasElH = Math.round(canvasNaturalH*scale);
      canvas.style.width = canvasElW+'px';
      canvas.style.height = canvasElH+'px';
      applyLayout();
    }
    let relayoutDebounce=null;
    window.addEventListener('resize', ()=>{
      clearTimeout(relayoutDebounce);
      relayoutDebounce = setTimeout(relayout, 80);
    });

    async function init(){
      try{
        const res = await fetch('/giftcapture/popup-data?djId='+encodeURIComponent(djId)+'&itemId='+encodeURIComponent(itemId));
        const d = await res.json();
        if(!d.success){
          document.getElementById('outer').innerHTML = '<div id="emptyMsg">'+(d.error||'불러오지 못했어요')+'</div>';
          return;
        }
        popupData = d;
        const tag = document.getElementById('senderTag');
        const combo = d.item.comboCount>1 ? ` x${d.item.comboCount}` : '';
        tag.textContent = (d.item.author||'')+' · '+(d.item.sticker||'')+combo;
        tag.style.display = 'block';

        let mediaKind=null, lottieJson=null;
        if(d.item.lottieUrl){
          try{
            const jres = await fetch('/giftcapture/lottie-proxy?url='+encodeURIComponent(d.item.lottieUrl));
            lottieJson = await jres.json();
            mediaAspect = (Number(lottieJson.w)||300) / (Number(lottieJson.h)||300);
            mediaNaturalW = Number(lottieJson.w)||300;
            mediaKind = 'lottie';
            gcLottieJson = lottieJson;
          }catch(e){ mediaKind = null; }
        }
        if(!mediaKind && d.item.stickerImage){
          const sz = await probeImageSize(d.item.stickerImage);
          if(sz){ mediaAspect = sz.w/sz.h; mediaNaturalW = sz.w; mediaKind = 'image'; }
        }
        if(!mediaKind){
          document.getElementById('outer').innerHTML = '<div id="emptyMsg">이 선물은 이미지를 찾지 못했어요<br>(스푼 스티커 목록에서 이름이 정확히 매칭 안 됐을 수 있어요)</div>';
          return;
        }

        // 🎬 캔버스 크기는 이제 배경 이미지의 실제 픽셀 크기가 아니라, 설정해둔 비율로 정해진다.
        const size = ratioToCanvasSize(d.aspectRatio);
        canvasNaturalW = size.w; canvasNaturalH = size.h;
        const hasBg = !!d.bgImageUrl;

        // 🎯 스푼 표준 세로영상 가로폭(추정치 720px) 대비 스티커 원본 크기 비율로 자동 계산.
        const REFERENCE_CANVAS_WIDTH = 720;
        window.__gcSizePct = Math.min(200, Math.max(5, (mediaNaturalW/REFERENCE_CANVAS_WIDTH)*100));

        const outer = document.getElementById('outer');
        outer.innerHTML = '<div id="canvas">'
          + (hasBg ? '<img id="bgImgEl" src="'+d.bgImageUrl+'">' : '')
          + '<div id="fgWrap"></div></div>';

        if(mediaKind==='lottie'){
          document.getElementById('fgWrap').innerHTML = '<div id="animBox"><div id="lottieBox"></div></div>';
          startLottie(lottieJson, document.getElementById('lottieBox'));
        } else {
          document.getElementById('fgWrap').innerHTML = '<div id="animBox"><img id="stickerImgEl" src="'+proxied(d.item.stickerImage)+'"></div>';
          document.getElementById('noAnimNotice').style.display = 'block';
          document.getElementById('seekRow').style.display = 'none'; // 애니메이션이 없으면 구간 탐색이 의미 없음
          const rb = document.getElementById('recordBtn');
          if(rb) rb.style.display = 'none'; // 정지 이미지는 영상으로 저장할 게 없음
        }

        document.getElementById('controls').style.display = 'flex';
        relayout();
        setTimeout(relayout, 150);
        setTimeout(relayout, 500);
      }catch(e){
        document.getElementById('outer').innerHTML = '<div id="emptyMsg">오류: '+e.message+'</div>';
      }
    }

    // 고정 크기/위치값을 실제 화면에 반영 (캔버스 밖으로 안 나가게 clamp)
    function applyLayout(){
      const box = document.getElementById('animBox');
      if(!box || !canvasElW) return;
      const sizePct = window.__gcSizePct || 55;
      const w = canvasElW * (sizePct/100);
      const h = w / mediaAspect;
      box.style.width = w+'px';
      box.style.height = h+'px';
      let left = canvasElW*(FIXED_X_PCT/100) - w/2;
      let top = canvasElH*(FIXED_Y_PCT/100) - h/2;
      left = w >= canvasElW ? (canvasElW-w)/2 : Math.max(0, Math.min(canvasElW-w, left));
      top = h >= canvasElH ? (canvasElH-h)/2 : Math.max(0, Math.min(canvasElH-h, top));
      box.style.left = left+'px';
      box.style.top = top+'px';
    }

    function startLottie(json, container){
      try{
        anim = lottie.loadAnimation({
          container: container,
          renderer: 'svg',
          loop: true,
          autoplay: false,
          animationData: json
        });
        anim.addEventListener('DOMLoaded', ()=>{
          const total = anim.totalFrames;
          const slider = document.getElementById('seekSlider');
          slider.max = Math.max(0, Math.floor(total)-1);
          slider.value = 0;
          updateFrameLabel(0, total);
          play();
        });
        anim.addEventListener('enterFrame', ()=>{
          if(userSeeking) return;
          const slider = document.getElementById('seekSlider');
          slider.value = Math.floor(anim.currentFrame);
          updateFrameLabel(anim.currentFrame, anim.totalFrames);
        });
        anim.addEventListener('data_failed', ()=>{
          document.getElementById('outer').innerHTML = '<div id="emptyMsg">애니메이션 데이터가 손상되어 있어요</div>';
        });
      }catch(e){
        document.getElementById('outer').innerHTML = '<div id="emptyMsg">애니메이션을 불러오지 못했어요</div>';
      }
    }

    function updateFrameLabel(cur, total){
      document.getElementById('frameLabel').textContent = Math.floor(cur)+' / '+Math.floor(total);
    }
    function play(){
      if(!anim) return;
      anim.play();
      isPlaying = true;
      document.getElementById('playBtn').textContent = '⏸ 일시정지';
    }
    function pause(){
      if(!anim) return;
      anim.pause();
      isPlaying = false;
      document.getElementById('playBtn').textContent = '▶ 재생';
    }
    function togglePlay(){
      if(!anim) return;
      isPlaying ? pause() : play();
    }

    // 배경 이미지의 원본(iw,ih)이 목표 캔버스(outW,outH) 안에 안 잘리고 통째로 들어가도록
    // (=object-fit:contain, 실제 스푼 화면이 하는 것과 동일하게) 그릴 크기/위치를 계산한다.
    // 남는 공간은 화면에서 검은 배경이 그대로 보이는 것처럼, 캡처본에도 검게 채운다.
    function containDrawRect(iw, ih, outW, outH){
      const scale = Math.min(outW/iw, outH/ih);
      const dw = iw*scale, dh = ih*scale;
      return { dw, dh, dx:(outW-dw)/2, dy:(outH-dh)/2 };
    }

    // 📸 캡처 — 지금 보이는 화면(배경 + 지금 프레임의 애니메이션)을 그대로 이미지 파일로 저장한다.
    async function captureFrame(){
      pause(); // 캡처하는 동안 움직이지 않게 먼저 멈춤
      try{
        // 🖼️ 화면엔 창 크기에 맞춰 축소해서 보여주고 있지만, 저장은 설정된 비율의 원본 해상도
        // (canvasNaturalW x canvasNaturalH) 그대로 한다. 화면 좌표(px)는 그 축소 비율 그대로
        // 배율만 키워서 원본 좌표로 환산한다.
        const scale = canvasElW > 0 ? (canvasNaturalW / canvasElW) : 1;
        const outW = canvasNaturalW, outH = canvasNaturalH;
        const outCanvas = document.createElement('canvas');
        outCanvas.width = outW; outCanvas.height = outH;
        const ctx = outCanvas.getContext('2d');
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high'; // 축소/변환 시 최대한 부드럽고 또렷하게

        const bgEl = document.getElementById('bgImgEl');
        if(bgEl){
          if(!bgEl.complete) await new Promise(r=>{ bgEl.onload=r; bgEl.onerror=r; });
          ctx.fillStyle = '#000';
          ctx.fillRect(0, 0, outW, outH);
          // 화면에서 object-fit:contain으로 안 잘리고 레터박스 처리되는 것과 동일하게 그린다.
          const rect = containDrawRect(bgEl.naturalWidth, bgEl.naturalHeight, outW, outH);
          ctx.drawImage(bgEl, 0, 0, bgEl.naturalWidth, bgEl.naturalHeight, rect.dx, rect.dy, rect.dw, rect.dh);
        }

        const animBox = document.getElementById('animBox');
        if(animBox){
          const bx = (parseFloat(animBox.style.left)||0) * scale;
          const by = (parseFloat(animBox.style.top)||0) * scale;
          const bw = (parseFloat(animBox.style.width)||0) * scale;
          const bh = (parseFloat(animBox.style.height)||0) * scale;
          const lottieBox = document.getElementById('lottieBox');
          if(lottieBox){
            const svgEl = lottieBox.querySelector('svg');
            if(svgEl){
              // SVG는 벡터라 화질 손실이 없지만, 목표 크기 그대로 한 번에 rasterize하면 브라우저에
              // 따라 가장자리가 살짝 무뎌 보일 수 있다. 2배 크기로 미리 그린 뒤 축소해서 그리면
              // (슈퍼샘플링) 훨씬 또렷하게 나온다.
              const SUPERSAMPLE = 2;
              const clone = svgEl.cloneNode(true);
              clone.setAttribute('width', String(Math.round(bw * SUPERSAMPLE)));
              clone.setAttribute('height', String(Math.round(bh * SUPERSAMPLE)));
              const svgData = new XMLSerializer().serializeToString(clone);
              const svgBlob = new Blob([svgData], {type:'image/svg+xml;charset=utf-8'});
              const url = URL.createObjectURL(svgBlob);
              const img = new Image();
              await new Promise((resolve,reject)=>{ img.onload=resolve; img.onerror=reject; img.src=url; });
              ctx.drawImage(img, bx, by, bw, bh);
              URL.revokeObjectURL(url);
            }
          } else {
            const imgEl = document.getElementById('stickerImgEl');
            if(imgEl){
              if(!imgEl.complete) await new Promise(r=>{ imgEl.onload=r; imgEl.onerror=r; });
              ctx.drawImage(imgEl, bx, by, bw, bh);
            }
          }
        }

        outCanvas.toBlob((blob)=>{
          if(!blob){ captureFailed(); return; }
          const link = document.createElement('a');
          link.href = URL.createObjectURL(blob);
          link.download = 'gift-capture-'+Date.now()+'.png';
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
        }, 'image/png');
      }catch(e){
        captureFailed();
      }
    }
    function captureFailed(){
      alert('자동 저장에 실패했어요 (브라우저 보안 정책 때문일 수 있어요). 대신 이 화면을 캡처 프로그램으로 직접 잡아주세요.');
    }

    // 🎥 영상 저장 — "캡처"가 지금 프레임 하나만 이미지로 저장하는 것과 달리, 애니메이션을 처음부터
    // 끝까지 한 바퀴 실제로 재생하면서 캔버스에 매 프레임을 그려서 webm 영상으로 녹화한다.
    // SVG 렌더러(화면에 보이는 것)는 매 프레임 래스터화하는 비용이 커서 실시간 녹화엔 못 쓰고,
    // 녹화 전용으로 lottie 캔버스 렌더러 인스턴스를 하나 더 만들어(같은 원본 데이터) 그걸 그린다.
    let isRecording = false;
    async function recordVideo(){
      if(isRecording) return;
      if(!gcLottieJson){ alert('정지 이미지는 영상으로 저장할 수 없어요. (움직이는 선물만 가능해요)'); return; }
      if(!window.MediaRecorder || !HTMLCanvasElement.prototype.captureStream){
        alert('이 브라우저에서는 영상 저장을 지원하지 않아요. 최신 크롬(PC) 브라우저에서 이용해주세요.');
        return;
      }
      pause(); // 화면에 보이는 재생은 멈추고, 녹화는 별도 인스턴스로 처음부터 새로 돈다

      isRecording = true;
      const recBtn = document.getElementById('recordBtn');
      const playBtn = document.getElementById('playBtn');
      const capBtn = document.getElementById('captureBtn');
      const oldRecTxt = recBtn.textContent;
      recBtn.disabled = true; recBtn.textContent = '⏳ 준비중';
      if(playBtn) playBtn.disabled = true;
      if(capBtn) capBtn.disabled = true;

      let recAnim = null;
      let finalCanvasEl = null;
      try{
        const outW = canvasNaturalW, outH = canvasNaturalH;
        const bgEl = document.getElementById('bgImgEl');
        if(bgEl && !bgEl.complete) await new Promise(r=>{ bgEl.onload=r; bgEl.onerror=r; });

        // 애니메이션 크기/위치는 화면에 보이는 것과 같은 비율로, 저장 원본 해상도 기준으로 환산한다.
        const scale = canvasElW > 0 ? (outW / canvasElW) : 1;
        const animBox = document.getElementById('animBox');
        const bx = (parseFloat(animBox.style.left)||0) * scale;
        const by = (parseFloat(animBox.style.top)||0) * scale;
        const bw = (parseFloat(animBox.style.width)||0) * scale;
        const bh = (parseFloat(animBox.style.height)||0) * scale;

        // 녹화 전용 캔버스 렌더러 애니메이션 — 살짝 크게 그려서(슈퍼샘플링) 축소하면 더 또렷하다.
        const SS = 2;
        const recAnimCanvas = document.createElement('canvas');
        recAnimCanvas.width = Math.max(1, Math.round(bw*SS));
        recAnimCanvas.height = Math.max(1, Math.round(bh*SS));
        const recAnimCtx = recAnimCanvas.getContext('2d');
        recAnim = lottie.loadAnimation({
          container: document.createElement('div'),
          renderer: 'canvas',
          loop: false,
          autoplay: false,
          animationData: gcLottieJson,
          rendererSettings: { context: recAnimCtx, clearCanvas: true, preserveAspectRatio: 'xMidYMid meet' }
        });
        await new Promise(resolve=>{ recAnim.addEventListener('DOMLoaded', resolve); });

        const finalCanvas = document.createElement('canvas');
        finalCanvas.width = outW; finalCanvas.height = outH;
        // 🎥 captureStream()이 매 프레임 변화를 제대로 잡으려면 캔버스가 실제로 DOM에 붙어서
        // 브라우저 렌더링 파이프라인을 타야 한다 — 메모리에만 떠있는(붙이지 않은) 캔버스는
        // 브라우저에 따라 첫 프레임만 고정으로 캡처해버리는 경우가 있다. 화면 밖으로 빼서
        // 안 보이게만 하고, 녹화가 끝나면 제거한다.
        finalCanvas.style.cssText = 'position:fixed;left:-99999px;top:0;pointer-events:none';
        document.body.appendChild(finalCanvas);
        finalCanvasEl = finalCanvas;
        const ctx = finalCanvas.getContext('2d');
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';

        function drawFinalFrame(){
          ctx.fillStyle = '#000';
          ctx.fillRect(0, 0, outW, outH);
          if(bgEl){
            const rect = containDrawRect(bgEl.naturalWidth, bgEl.naturalHeight, outW, outH);
            ctx.drawImage(bgEl, 0, 0, bgEl.naturalWidth, bgEl.naturalHeight, rect.dx, rect.dy, rect.dw, rect.dh);
          }
          recAnimCtx.clearRect(0, 0, recAnimCanvas.width, recAnimCanvas.height);
          ctx.drawImage(recAnimCanvas, bx, by, bw, bh);
        }

        const totalFrames = Math.max(1, Math.floor(recAnim.totalFrames));
        const frameRate = recAnim.frameRate || 30;

        const stream = finalCanvas.captureStream();
        const mimeCandidates = ['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'];
        const mimeType = mimeCandidates.find(m => MediaRecorder.isTypeSupported(m)) || '';
        const recorder = mimeType ? new MediaRecorder(stream, {mimeType}) : new MediaRecorder(stream);
        const chunks = [];
        recorder.ondataavailable = (e)=>{ if(e.data && e.data.size) chunks.push(e.data); };
        const recordingStopped = new Promise(resolve=>{ recorder.onstop = resolve; });
        recorder.start();

        const durationMs = (totalFrames / frameRate) * 1000;
        const startTs = performance.now();
        await new Promise(resolve=>{
          function tick(now){
            const elapsed = now - startTs;
            const frame = Math.min(totalFrames - 1, Math.floor(elapsed/1000*frameRate));
            recAnim.goToAndStop(frame, true); // 캔버스 렌더러라 이 호출 안에서 recAnimCanvas에 바로 그려짐
            drawFinalFrame();
            recBtn.textContent = '⏺ 녹화 중 '+Math.min(100, Math.round(elapsed/durationMs*100))+'%';
            if(elapsed < durationMs) requestAnimationFrame(tick);
            else resolve();
          }
          requestAnimationFrame(tick);
        });

        recorder.stop();
        await recordingStopped;

        const blob = new Blob(chunks, {type: (mimeType.split(';')[0]) || 'video/webm'});
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = 'gift-capture-'+Date.now()+'.webm';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      }catch(e){
        alert('영상 저장에 실패했어요: '+e.message);
      }finally{
        if(recAnim) recAnim.destroy();
        if(finalCanvasEl && finalCanvasEl.parentNode) finalCanvasEl.parentNode.removeChild(finalCanvasEl);
        isRecording = false;
        recBtn.disabled = false; recBtn.textContent = oldRecTxt;
        if(playBtn) playBtn.disabled = false;
        if(capBtn) capBtn.disabled = false;
      }
    }

    document.addEventListener('keydown', (e)=>{
      if(e.code==='Space'){ e.preventDefault(); togglePlay(); }
    });

    const seekSlider = document.getElementById('seekSlider');
    seekSlider.addEventListener('mousedown', ()=>{ userSeeking = true; pause(); });
    seekSlider.addEventListener('touchstart', ()=>{ userSeeking = true; pause(); });
    seekSlider.addEventListener('input', ()=>{
      if(!anim) return;
      const f = Number(seekSlider.value);
      anim.goToAndStop(f, true);
      updateFrameLabel(f, anim.totalFrames);
    });
    seekSlider.addEventListener('mouseup', ()=>{ userSeeking = false; });
    seekSlider.addEventListener('touchend', ()=>{ userSeeking = false; });

    init();
  </script>
</body>
</html>
