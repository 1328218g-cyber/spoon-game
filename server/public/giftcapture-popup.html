<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>선물 애니메이션 재생</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html,body{margin:0;padding:0;background:#0a0a0a;overflow:hidden;height:100%}
  #stage{position:relative;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center}
  #bgImg{max-width:100%;max-height:100%;display:block}
  #bgWrap{position:relative;display:inline-block;line-height:0}
  #animSpot{position:absolute;pointer-events:none}
  #animSpot img,#animSpot #lottieBox{width:100%;height:100%;object-fit:contain}
  #lottieBox{width:100%;height:100%}
  #replayBtn{position:fixed;bottom:16px;right:16px;padding:10px 18px;border-radius:999px;border:none;
    background:#8b5cf6;color:#fff;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.4);
    display:none;z-index:10}
  #hint{position:fixed;top:12px;left:12px;color:rgba(255,255,255,.55);font:12px -apple-system,sans-serif;z-index:10}
  #emptyMsg{color:rgba(255,255,255,.6);font:14px -apple-system,sans-serif;text-align:center}
</style>
</head>
<body>
  <div id="stage">
    <div id="emptyMsg">불러오는 중...</div>
  </div>
  <button id="replayBtn" onclick="playAnim()">🔁 다시 재생</button>
  <div id="hint">이 창은 필요할 때 다시 클릭해서 재생하고, 캡처 프로그램으로 화면을 잡으면 돼요</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie.min.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const djId = params.get('djId') || '';
    const slotId = params.get('slotId') || '';
    let animInstance = null;
    let popupData = null;

    async function init(){
      const stage = document.getElementById('stage');
      try{
        const res = await fetch('/giftcapture/popup-data?djId='+encodeURIComponent(djId)+'&slotId='+encodeURIComponent(slotId));
        const d = await res.json();
        if(!d.success){
          stage.innerHTML = '<div id="emptyMsg">'+(d.error||'불러오지 못했어요')+'</div>';
          return;
        }
        popupData = d;
        if(!d.lastEvent){
          stage.innerHTML = '<div id="emptyMsg">아직 이 칸으로 받은 선물이 없어요.<br>선물이 들어오면 여기서 다시 열어 재생할 수 있어요.</div>';
          return;
        }
        buildStage(d);
        playAnim();
      }catch(e){
        stage.innerHTML = '<div id="emptyMsg">오류: '+e.message+'</div>';
      }
    }

    function buildStage(d){
      const stage = document.getElementById('stage');
      stage.innerHTML = '';
      const wrap = document.createElement('div');
      wrap.id = 'bgWrap';

      const img = document.createElement('img');
      img.id = 'bgImg';
      img.src = d.bgImageUrl || '';
      wrap.appendChild(img);

      const spot = document.createElement('div');
      spot.id = 'animSpot';
      wrap.appendChild(spot);
      stage.appendChild(wrap);

      function positionSpot(){
        // 관리자 화면 미리보기(tbPreviewGrid)와 완전히 동일한 계산식 — 같은 자리에 나오게 하기 위함
        const columns = Math.max(1, Number(d.columns)||4);
        const rows = Math.max(1, Number(d.rows)||4);
        const cellSize = Math.max(2, Number(d.cellSize)||12);
        const gridLeft = Math.max(0, Number(d.gridLeft)||0);
        const gridTop = Math.max(0, Number(d.gridTop)||0);

        const naturalW = img.naturalWidth || 1;
        const naturalH = img.naturalHeight || 1;
        const aspect = naturalW / naturalH;

        // 이 칸(row/col)의 위치 계산 — row/col이 비어있으면(자동배치) slots 배열 순서로 계산
        let row = d.slot.row, col = d.slot.col;
        if(!row || !col){
          let autoIndex = 0;
          for(const s of d.slots){
            if(s.row && s.col) continue;
            if(s.id === d.slot.id){ row = Math.floor(autoIndex/columns)+1; col = (autoIndex%columns)+1; break; }
            autoIndex++;
          }
          row = row || 1; col = col || 1;
        }

        const gridWpct = columns*cellSize;
        const gridHpct = rows*cellSize*aspect;
        const cellWpct = gridWpct/columns;
        const cellHpct = gridHpct/rows;
        const cellLeftPct = gridLeft + (col-1)*cellWpct;
        const cellTopPct = gridTop + (row-1)*cellHpct;

        spot.style.left = cellLeftPct+'%';
        spot.style.top = cellTopPct+'%';
        spot.style.width = cellWpct+'%';
        spot.style.height = cellHpct+'%';
      }

      if(img.complete && img.naturalWidth){ positionSpot(); }
      else img.onload = positionSpot;
      window.addEventListener('resize', ()=>{ if(img.naturalWidth) positionSpot(); });
    }

    async function playAnim(){
      if(!popupData || !popupData.lastEvent) return;
      const spot = document.getElementById('animSpot');
      const replayBtn = document.getElementById('replayBtn');
      spot.innerHTML = '';
      if(animInstance){ try{ animInstance.destroy(); }catch(e){} animInstance = null; }

      const ev = popupData.lastEvent;
      if(ev.lottieUrl){
        const box = document.createElement('div');
        box.id = 'lottieBox';
        spot.appendChild(box);
        try{
          const proxied = '/giftcapture/lottie-proxy?url='+encodeURIComponent(ev.lottieUrl);
          const res = await fetch(proxied);
          const json = await res.json();
          animInstance = lottie.loadAnimation({
            container: box,
            renderer: 'svg',
            loop: false,
            autoplay: true,
            animationData: json
          });
          replayBtn.style.display = 'block';
          return;
        }catch(e){
          // lottie 로드 실패하면 정지 이미지로 대체
        }
      }
      // 애니메이션이 없거나 로드 실패 — 정지 이미지로 대체 (2.5초 표시)
      if(ev.stickerImage){
        const img2 = document.createElement('img');
        img2.src = ev.stickerImage;
        spot.appendChild(img2);
      }
      replayBtn.style.display = 'block';
    }

    init();
  </script>
</body>
</html>
