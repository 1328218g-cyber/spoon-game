<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>월간 DJ 랭킹</title>
<style>
  :root{
    --bg:#0e0b16; --card:#181423; --card2:#1f1a2e; --border:#2c2740;
    --text:#f2eefc; --text-dim:#9a92b5; --accent:#f9a825; --green:#3ddc84; --red:#ff5c72;
    --me-border:#e0517a;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;background:var(--bg);color:var(--text);padding-bottom:50px}
  .wrap{max-width:720px;margin:0 auto;padding:18px}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px}
  .title-row{display:flex;align-items:center;gap:10px}
  .title-row .badge{width:38px;height:38px;border-radius:10px;background:linear-gradient(160deg,#ff8a3d,#f9a825);display:flex;align-items:center;justify-content:center;font-size:20px}
  .title-row h1{font-size:18px;margin:0}
  .title-row .sub{font-size:11.5px;color:var(--text-dim);margin-top:2px}
  .type-select{background:var(--card2);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:8px 12px;font-size:13px}
  .refresh-btn{background:var(--card2);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:9px 14px;font-size:12.5px;cursor:pointer;display:flex;align-items:center;gap:6px}
  .refresh-btn:disabled{opacity:.5;cursor:not-allowed}
  h2.section{font-size:13px;color:var(--text-dim);margin:22px 0 10px;display:flex;align-items:center;justify-content:space-between}
  .cut-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
  .cut-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px}
  .cut-card .rank-label{font-size:11.5px;color:var(--text-dim)}
  .cut-card .cut-num{font-size:22px;font-weight:800;margin:4px 0}
  .cut-card .cut-num .unit{font-size:11px;color:var(--text-dim);font-weight:500;margin-left:4px}
  .cut-card .who{font-size:11px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .me-card{background:linear-gradient(135deg,rgba(224,81,122,.12),rgba(224,81,122,.03));border:1.5px solid var(--me-border);border-radius:16px;padding:18px;display:flex;align-items:center;gap:14px}
  .me-card .avatar{width:52px;height:52px;border-radius:50%;background:var(--card2);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:22px}
  .me-card .info{flex:1;min-width:0}
  .me-card .nick{font-size:16px;font-weight:700}
  .me-card .tag{font-size:11.5px;color:var(--text-dim);margin-top:2px}
  .me-card .cut-row{display:flex;align-items:center;gap:8px;margin-top:8px}
  .me-card .cut-row .cut{font-size:15px;font-weight:700}
  .me-card .bracket{font-size:10.5px;background:var(--card2);padding:3px 9px;border-radius:999px;color:var(--text-dim)}
  .me-card .rank-num{font-size:30px;font-weight:800;color:var(--me-border);text-align:right}
  .me-card .rank-num .lbl{font-size:10.5px;color:var(--text-dim);font-weight:500;display:block;text-align:right;margin-top:2px}
  .compare-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
  .compare-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;display:flex;justify-content:space-between;align-items:center}
  .compare-card .label{font-size:11.5px;color:var(--text-dim)}
  .compare-card .sub{font-size:10.5px;color:var(--text-dim);margin-top:2px}
  .compare-card .diff{font-size:17px;font-weight:800}
  .diff.pos{color:var(--green)}
  .diff.neg{color:var(--red)}
  table.nearby{width:100%;border-collapse:collapse;background:var(--card);border-radius:14px;overflow:hidden;border:1px solid var(--border)}
  table.nearby th{text-align:left;font-size:11px;color:var(--text-dim);font-weight:500;padding:10px 12px;border-bottom:1px solid var(--border)}
  table.nearby td{padding:12px;border-bottom:1px solid var(--border);font-size:13px}
  table.nearby tr:last-child td{border-bottom:none}
  table.nearby tr.me-row{background:rgba(224,81,122,.1)}
  .rank-cell{font-weight:700;width:36px}
  .dj-cell{display:flex;align-items:center;gap:8px}
  .dj-avatar{width:28px;height:28px;border-radius:50%;background:var(--card2);flex-shrink:0}
  .dj-name{font-size:13px}
  .dj-tag{font-size:10.5px;color:var(--text-dim)}
  .change-up{color:var(--green);font-size:11.5px;font-weight:700}
  .change-down{color:var(--red);font-size:11.5px;font-weight:700}
  .change-same{color:var(--text-dim);font-size:11.5px}
  .footer-note{text-align:center;color:var(--text-dim);font-size:11px;margin-top:24px;line-height:1.8}
  .empty,.loading{text-align:center;color:var(--text-dim);font-size:13px;padding:60px 20px;line-height:1.8}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#fff;color:#111;padding:10px 18px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:60;max-width:90%;text-align:center}
  .toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <div class="title-row">
      <div class="badge">🐰</div>
      <div>
        <h1 id="pageTitle">월간 DJ 랭킹</h1>
        <div class="sub" id="pageSub">불러오는 중...</div>
      </div>
    </div>
    <div style="display:flex;gap:8px">
      <select class="type-select" id="typeSelect" onchange="load()">
        <option value="next_choice">✨ 초이스</option>
        <option value="free_like">❤️ 좋아요</option>
        <option value="live_time">⏱️ 방송시간</option>
      </select>
      <button class="refresh-btn" id="refreshBtn" onclick="manualRefresh()">🔄 새로고침</button>
    </div>
  </div>

  <div id="content"><div class="loading">불러오는 중...</div></div>

</div>

<div class="toast" id="toast"></div>

<script>
const DJ_ID = location.pathname.split('/').filter(Boolean)[1] || '';
const SERVER = location.origin;
let lastData = null;

document.getElementById('pageTitle').textContent = DJ_ID + '님의 월간 DJ 랭킹';

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.classList.remove('show'), 2400);
}

function escapeHtml(s){ return (s==null?'':String(s)).replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function fmtNum(n){ return n==null ? '-' : Number(n).toLocaleString('ko-KR'); }
function fmtDiff(n){ return n==null ? '-' : (n>=0?'+':'') + Number(n).toLocaleString('ko-KR'); }

async function load(){
  const type = document.getElementById('typeSelect').value;
  try{
    const res = await fetch(`${SERVER}/rank/${DJ_ID}/data?type=${type}`);
    const d = await res.json();
    if(!d.success){
      document.getElementById('content').innerHTML = `<div class="empty">${escapeHtml(d.error||'불러오지 못했어요')}</div>`;
      document.getElementById('pageSub').textContent = '';
      return;
    }
    lastData = d;
    render(d);
  }catch(e){
    document.getElementById('content').innerHTML = '<div class="empty">불러오지 못했어요. 새로고침해주세요.</div>';
  }
}

function render(d){
  const typeLabel = {next_choice:'초이스', free_like:'좋아요', live_time:'방송시간'}[document.getElementById('typeSelect').value] || '';
  const updated = d.updatedAt ? new Date(d.updatedAt).toLocaleString('ko-KR') : '-';
  document.getElementById('pageSub').textContent = `${typeLabel} · ${d.total}명 랭킹`;

  let html = '';

  html += `<h2 class="section">주요 랭킹 컷</h2><div class="cut-grid">`;
  d.cuts.forEach(c => {
    html += `<div class="cut-card">
      <div class="rank-label">${c.rank}위 컷</div>
      <div class="cut-num">${fmtNum(c.cut)}<span class="unit">CUT</span></div>
      <div class="who">${escapeHtml(c.nickname)} · @${escapeHtml(c.tag)}</div>
    </div>`;
  });
  html += `</div>`;

  if(d.me){
    const m = d.me;
    html += `<h2 class="section">내 순위</h2>
    <div class="me-card">
      <div class="avatar">🎙️</div>
      <div class="info">
        <div class="nick">${escapeHtml(m.nickname)}</div>
        <div class="tag">@${DJ_ID}</div>
        <div class="cut-row">
          <span class="cut">현재 컷 ${fmtNum(m.cut)}</span>
          <span class="bracket">${escapeHtml(m.bracketLabel)}</span>
        </div>
      </div>
      <div class="rank-num">${m.rank}<span class="lbl">현재 순위</span></div>
    </div>`;

    if(m.comparisons && m.comparisons.length){
      html += `<h2 class="section">내 컷 기준</h2><div class="compare-grid">`;
      m.comparisons.forEach(c => {
        const cls = (c.diff==null) ? '' : (c.diff>=0?'pos':'neg');
        html += `<div class="compare-card">
          <div>
            <div class="label">${c.rank}위 컷 대비</div>
            <div class="sub">기준 컷 ${fmtNum(c.cut)}</div>
          </div>
          <div class="diff ${cls}">${fmtDiff(c.diff)}</div>
        </div>`;
      });
      html += `</div>`;
    }

    if(m.nearby && m.nearby.length){
      html += `<h2 class="section">내 주변 순위</h2>
      <table class="nearby"><thead><tr><th>순위</th><th>DJ</th><th style="text-align:right">환산 컷</th><th style="text-align:right">변동</th></tr></thead><tbody>`;
      m.nearby.forEach(n => {
        let changeHtml = '<span class="change-same">-</span>';
        if(n.change != null){
          if(n.change > 0) changeHtml = `<span class="change-up">▲${n.change}</span>`;
          else if(n.change < 0) changeHtml = `<span class="change-down">▼${-n.change}</span>`;
          else changeHtml = '<span class="change-same">-</span>';
        }
        html += `<tr class="${n.isMe?'me-row':''}">
          <td class="rank-cell">${n.rank}</td>
          <td><div class="dj-cell"><div class="dj-avatar"></div><div><div class="dj-name">${escapeHtml(n.nickname)}</div><div class="dj-tag">@${escapeHtml(n.tag)}</div></div></div></td>
          <td style="text-align:right">${fmtNum(n.cut)}<span style="font-size:10px;color:var(--text-dim)"> CUT</span></td>
          <td style="text-align:right">${changeHtml}</td>
        </tr>`;
      });
      html += `</tbody></table>`;
    }
  }

  html += `<div class="footer-note">${d.total}명 갱신 완료<br>마지막 갱신: ${updated}</div>`;

  document.getElementById('content').innerHTML = html;
}

async function manualRefresh(){
  const btn = document.getElementById('refreshBtn');
  btn.disabled = true;
  btn.textContent = '🔄 새로고침 중...';
  try{
    const res = await fetch(`${SERVER}/rank/${DJ_ID}/refresh`, { method:'POST' });
    const d = await res.json();
    if(!d.success){ showToast(d.error || '새로고침 실패'); }
    else { showToast('새로고침 완료!'); }
    await load();
  }catch(e){ showToast('오류: '+e.message); }
  btn.disabled = false;
  btn.textContent = '🔄 새로고침';
}

load();
</script>
</body>
</html>
