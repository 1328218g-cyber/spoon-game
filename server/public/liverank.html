<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>실시간 랭킹</title>
<style>
  :root{
    --bg:#0e0b16; --card:#181423; --border:#2c2740;
    --text:#f2eefc; --text-dim:#9a92b5; --green:#3ddc84; --red:#ff5c72; --me:#e0517a;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;background:var(--bg);color:var(--text);padding-bottom:50px}
  .wrap{max-width:560px;margin:0 auto;padding:18px}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
  .title-row{display:flex;align-items:center;gap:10px}
  .title-row .badge{width:38px;height:38px;border-radius:10px;background:linear-gradient(160deg,#ff5c72,#e0517a);display:flex;align-items:center;justify-content:center;font-size:18px}
  .title-row h1{font-size:17px;margin:0}
  .title-row .sub{font-size:11.5px;color:var(--text-dim);margin-top:2px}
  .refresh-btn{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:9px 14px;font-size:12.5px;cursor:pointer}
  .refresh-btn:disabled{opacity:.5;cursor:not-allowed}
  .me-card{background:linear-gradient(135deg,rgba(224,81,122,.14),rgba(224,81,122,.03));border:1.5px solid var(--me);border-radius:16px;padding:22px;text-align:center}
  .me-card .rank-num{font-size:40px;font-weight:800;color:var(--me)}
  .me-card .rank-lbl{font-size:12px;color:var(--text-dim);margin-top:2px}
  .me-card .nick{font-size:15px;font-weight:700;margin-top:10px}
  .me-card .cut{font-size:13px;color:var(--text-dim);margin-top:4px}
  .neighbor-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
  .neighbor-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;text-align:center}
  .neighbor-card .lbl{font-size:11px;color:var(--text-dim)}
  .neighbor-card .rank{font-size:20px;font-weight:800;margin:6px 0 2px}
  .neighbor-card .nick{font-size:13px}
  .neighbor-card .tag{font-size:10.5px;color:var(--text-dim)}
  .neighbor-card .diff{font-size:15px;font-weight:800;margin-top:8px}
  .diff.pos{color:var(--green)}
  .diff.neg{color:var(--red)}
  h2.section{font-size:13px;color:var(--text-dim);margin:22px 0 10px}
  .history-list{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:6px 14px}
  .history-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);font-size:12.5px}
  .history-row:last-child{border-bottom:none}
  .history-row .time{color:var(--text-dim)}
  .history-row .rank{font-weight:700}
  .history-row .move{font-size:11px}
  .empty,.loading{text-align:center;color:var(--text-dim);font-size:13px;padding:60px 20px;line-height:1.8}
  .footer-note{text-align:center;color:var(--text-dim);font-size:11px;margin-top:24px;line-height:1.8}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#fff;color:#111;padding:10px 18px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:60;max-width:90%;text-align:center}
  .toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <div class="title-row">
      <div class="badge">🔴</div>
      <div>
        <h1 id="pageTitle">실시간 랭킹</h1>
        <div class="sub" id="pageSub">불러오는 중...</div>
      </div>
    </div>
    <button class="refresh-btn" id="refreshBtn" onclick="manualRefresh()">🔄 새로고침</button>
  </div>

  <div id="content"><div class="loading">불러오는 중...</div></div>

</div>

<div class="toast" id="toast"></div>

<script>
const DJ_ID = location.pathname.split('/').filter(Boolean)[1] || '';
const SERVER = location.origin;

document.getElementById('pageTitle').textContent = DJ_ID + '님의 실시간 랭킹';

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.classList.remove('show'), 2400);
}
function escapeHtml(s){ return (s==null?'':String(s)).replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function fmtNum(n){ return n==null ? '-' : Number(n).toLocaleString('ko-KR'); }
function fmtDiff(n){ return n==null ? '-' : (n>=0?'+':'') + Number(n).toLocaleString('ko-KR'); }

async function load(){
  try{
    const res = await fetch(`${SERVER}/liverank/${DJ_ID}/data`);
    const d = await res.json();
    if(!d.success){
      document.getElementById('content').innerHTML = `<div class="empty">${escapeHtml(d.error||'불러오지 못했어요')}</div>`;
      document.getElementById('pageSub').textContent = d.total ? `전체 ${d.total}명 중` : '';
      return;
    }
    render(d);
  }catch(e){
    document.getElementById('content').innerHTML = '<div class="empty">불러오지 못했어요. 새로고침해주세요.</div>';
  }
}

function render(d){
  const updated = d.updatedAt ? new Date(d.updatedAt).toLocaleString('ko-KR') : '-';
  document.getElementById('pageSub').textContent = `스푼 초이스 랭킹 · 전체 ${d.total}명`;

  let html = '';
  html += `<div class="me-card">
    <div class="rank-num">${d.rank}<span style="font-size:16px">위</span></div>
    <div class="rank-lbl">현재 순위</div>
    <div class="nick">${escapeHtml(d.nickname)}</div>
    <div class="cut">현재 컷 ${fmtNum(d.cut)}</div>
  </div>`;

  html += `<div class="neighbor-grid">`;
  if(d.above){
    const cls = d.above.diff==null ? '' : (d.above.diff>=0?'neg':'pos'); // 위 등수는 점수가 높아야 정상이니, 그 차이가 클수록(양수) 따라잡아야 할 격차
    html += `<div class="neighbor-card">
      <div class="lbl">▲ 바로 위</div>
      <div class="rank">${d.above.rank}위</div>
      <div class="nick">${escapeHtml(d.above.nickname)}</div>
      <div class="tag">@${escapeHtml(d.above.tag)}</div>
      <div class="diff ${cls}">${fmtDiff(d.above.diff)}</div>
    </div>`;
  } else {
    html += `<div class="neighbor-card"><div class="lbl">▲ 바로 위</div><div class="rank" style="color:var(--text-dim);font-size:14px;margin-top:14px">1위예요!</div></div>`;
  }
  if(d.below){
    const cls = d.below.diff==null ? '' : (d.below.diff>=0?'pos':'neg'); // 아래 등수와의 여유분 — 양수면 안전권
    html += `<div class="neighbor-card">
      <div class="lbl">▼ 바로 아래</div>
      <div class="rank">${d.below.rank}위</div>
      <div class="nick">${escapeHtml(d.below.nickname)}</div>
      <div class="tag">@${escapeHtml(d.below.tag)}</div>
      <div class="diff ${cls}">${fmtDiff(d.below.diff)}</div>
    </div>`;
  } else {
    html += `<div class="neighbor-card"><div class="lbl">▼ 바로 아래</div><div class="rank" style="color:var(--text-dim);font-size:14px;margin-top:14px">최하위예요</div></div>`;
  }
  html += `</div>`;

  if(d.history && d.history.length){
    html += `<h2 class="section">순위 변화 기록 (최근 ${Math.min(d.history.length,15)}건)</h2><div class="history-list">`;
    const recent = d.history.slice(-15).reverse();
    recent.forEach((h,i) => {
      const prev = recent[i+1];
      let moveHtml = '<span style="color:var(--text-dim)">-</span>';
      if(prev){
        const delta = prev.rank - h.rank; // 양수 = 순위 상승
        if(delta > 0) moveHtml = `<span style="color:var(--green)">▲${delta}</span>`;
        else if(delta < 0) moveHtml = `<span style="color:var(--red)">▼${-delta}</span>`;
      }
      html += `<div class="history-row">
        <span class="time">${new Date(h.ts).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}</span>
        <span class="rank">${h.rank}위</span>
        <span class="move">${moveHtml}</span>
      </div>`;
    });
    html += `</div>`;
  }

  html += `<div class="footer-note">마지막 갱신: ${updated}</div>`;

  document.getElementById('content').innerHTML = html;
}

async function manualRefresh(){
  const btn = document.getElementById('refreshBtn');
  btn.disabled = true;
  btn.textContent = '🔄 새로고침 중...';
  try{
    const res = await fetch(`${SERVER}/liverank/${DJ_ID}/refresh`, { method:'POST' });
    const d = await res.json();
    if(!d.success){ showToast(d.error || '새로고침 실패'); }
    else { showToast('새로고침 완료!'); }
    await load();
  }catch(e){ showToast('오류: '+e.message); }
  btn.disabled = false;
  btn.textContent = '🔄 새로고침';
}

load();
</script>
</body>
</html>
