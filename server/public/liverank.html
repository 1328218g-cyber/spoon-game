<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>월간 DJ 랭킹</title>
<style>
  :root{
    --bg:#f3f4f8; --card:#ffffff; --border:#e7e9f0;
    --text:#1a1d29; --text-dim:#8b8fa3; --green:#16a34a; --red:#dc2626; --me:#e0517a;
    --accent1:#ff8a3d; --accent2:#ff5c72;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;background:var(--bg);color:var(--text);padding-bottom:50px}
  .wrap{max-width:1100px;margin:0 auto;padding:20px}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px}
  .title-row{display:flex;align-items:center;gap:12px}
  .title-row .badge{width:40px;height:40px;border-radius:10px;background:linear-gradient(160deg,var(--accent1),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:20px}
  .title-row h1{font-size:19px;margin:0}
  .title-row .sub{font-size:12px;color:var(--text-dim);margin-top:3px}
  .refresh-btn{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:10px 16px;font-size:13px;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .refresh-btn:disabled{opacity:.5;cursor:not-allowed}
  h2.section{font-size:13.5px;color:var(--text-dim);margin:24px 0 10px;display:flex;justify-content:space-between;align-items:center;font-weight:600}
  .cut-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
  .cut-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .cut-card .rank-label{font-size:12px;color:var(--text-dim)}
  .cut-card .cut-num{font-size:24px;font-weight:800;margin:6px 0 4px}
  .cut-card .cut-num .unit{font-size:11px;color:var(--text-dim);font-weight:500;margin-left:4px}
  .cut-card .who{font-size:11.5px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .me-card{background:linear-gradient(135deg,rgba(224,81,122,.08),rgba(224,81,122,.02));border:1.5px solid var(--me);border-radius:16px;padding:20px;display:flex;align-items:center;gap:16px}
  .me-card .avatar{width:56px;height:56px;border-radius:50%;background:#eee;flex-shrink:0;object-fit:cover}
  .me-card .info{flex:1;min-width:0}
  .me-card .nick{font-size:17px;font-weight:800}
  .me-card .tag{font-size:12px;color:var(--text-dim);margin-top:2px}
  .me-card .cut-row{display:flex;align-items:center;gap:10px;margin-top:10px}
  .me-card .cut-row .cut{font-size:15px;color:var(--text-dim)}
  .me-card .cut-row .cut b{color:var(--text);font-size:17px}
  .me-card .bracket{font-size:11px;background:#f1f0fa;padding:4px 10px;border-radius:999px;color:#6b21d6;font-weight:600}
  .me-card .rank-num{font-size:34px;font-weight:800;color:var(--me);text-align:right;flex-shrink:0}
  .me-card .rank-num .lbl{font-size:11px;color:var(--text-dim);font-weight:500;display:block;text-align:right;margin-top:2px}
  .compare-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
  .compare-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .compare-card .label{font-size:12px;color:var(--text-dim)}
  .compare-card .sub{font-size:11px;color:var(--text-dim);margin-top:3px}
  .compare-card .diff{font-size:18px;font-weight:800}
  .diff.pos{color:var(--green)}
  .diff.neg{color:var(--red)}
  .table-wrap{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  table.nearby{width:100%;border-collapse:collapse}
  table.nearby th{text-align:left;font-size:11.5px;color:var(--text-dim);font-weight:600;padding:12px 16px;border-bottom:1px solid var(--border)}
  table.nearby td{padding:14px 16px;border-bottom:1px solid var(--border);font-size:13.5px}
  table.nearby tr:last-child td{border-bottom:none}
  table.nearby tr.me-row{background:rgba(224,81,122,.06)}
  .rank-cell{font-weight:800;width:40px}
  .dj-cell{display:flex;align-items:center;gap:10px}
  .dj-avatar{width:32px;height:32px;border-radius:50%;background:#eee;flex-shrink:0;object-fit:cover}
  .dj-name{font-size:13.5px;font-weight:600}
  .dj-tag{font-size:11px;color:var(--text-dim)}
  .change-pill{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;display:inline-block}
  .avatar-fallback{background:linear-gradient(160deg,#ddd,#ccc);display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff}
  .dj-avatar-fallback{background:linear-gradient(160deg,#ddd,#ccc);display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff}
  .footer-note{display:flex;justify-content:space-between;color:var(--text-dim);font-size:11.5px;margin-top:18px;flex-wrap:wrap;gap:6px}
  .empty,.loading{text-align:center;color:var(--text-dim);font-size:13px;padding:60px 20px;line-height:1.8}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1a1d29;color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:60;max-width:90%;text-align:center}
  .toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <div class="title-row">
      <div class="badge">🐰</div>
      <div>
        <h1 id="pageTitle">월간 DJ 랭킹</h1>
        <div class="sub" id="pageSub">불러오는 중...</div>
      </div>
    </div>
    <button class="refresh-btn" id="refreshBtn" onclick="manualRefresh()">🔄 새로고침</button>
  </div>

  <div id="content"><div class="loading">불러오는 중...</div></div>

</div>

<div class="toast" id="toast"></div>

<script>
const DJ_ID = location.pathname.split('/').filter(Boolean)[1] || '';
const SERVER = location.origin;

document.getElementById('pageTitle').textContent = DJ_ID + '님의 월간 DJ 랭킹';

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.classList.remove('show'), 2400);
}
function escapeHtml(s){ return (s==null?'':String(s)).replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function fmtNum(n){ return n==null ? '-' : Number(n).toLocaleString('ko-KR'); }
function fmtDiff(n){ return n==null ? '-' : (n>=0?'+':'') + Number(n).toLocaleString('ko-KR'); }
function avatarHtml(url, size, emoji){
  emoji = emoji || '🎙️';
  const safeUrl = url ? escapeHtml(url) : '';
  return `<span style="position:relative;width:${size}px;height:${size}px;flex-shrink:0;display:inline-block">
    ${safeUrl?`<img src="${safeUrl}" style="width:${size}px;height:${size}px;border-radius:50%;object-fit:cover;display:block" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`:''}
    <div style="width:${size}px;height:${size}px;border-radius:50%;background:linear-gradient(160deg,#ddd,#ccc);display:${safeUrl?'none':'flex'};align-items:center;justify-content:center;font-size:${Math.round(size*0.4)}px;position:absolute;top:0;left:0">${emoji}</div>
  </span>`;
}

async function load(){
  try{
    const res = await fetch(`${SERVER}/liverank/${DJ_ID}/data`);
    const d = await res.json();
    if(!d.success){
      document.getElementById('content').innerHTML = `<div class="empty">${escapeHtml(d.error||'불러오지 못했어요')}</div>`;
      document.getElementById('pageSub').textContent = d.total ? `전체 ${d.total}명 중` : '';
      return;
    }
    render(d);
  }catch(e){
    document.getElementById('content').innerHTML = '<div class="empty">불러오지 못했어요. 새로고침해주세요.</div>';
  }
}

function render(d){
  const updated = d.updatedAt ? new Date(d.updatedAt).toLocaleString('ko-KR') : '-';
  document.getElementById('pageSub').textContent = `스푼 초이스 랭킹 · ${d.total}명 · 전체 순위판 기준`;

  let html = '';

  if(d.cuts && d.cuts.length){
    html += `<h2 class="section">주요 랭킹 컷</h2><div class="cut-grid">`;
    d.cuts.forEach(c => {
      html += `<div class="cut-card">
        <div class="rank-label">${c.rank}위 컷</div>
        <div class="cut-num">${fmtNum(c.cut)}<span class="unit">CUT</span></div>
        <div class="who">${escapeHtml(c.nickname)} · @${escapeHtml(c.tag)}</div>
      </div>`;
    });
    html += `</div>`;
  }

  html += `<h2 class="section">내 순위</h2>
  <div class="me-card">
    ${avatarHtml(d.photo, 56)}
    <div class="info">
      <div class="nick">${escapeHtml(d.nickname)}</div>
      <div class="tag">@${escapeHtml(d.tag||DJ_ID)}</div>
      <div class="cut-row">
        <span class="cut">현재 컷 <b>${fmtNum(d.cut)}</b></span>
        <span class="bracket">${escapeHtml(d.bracketLabel||'')}</span>
      </div>
    </div>
    <div class="rank-num">${d.rank}<span class="lbl">현재 순위</span></div>
  </div>`;

  if(d.comparisons && d.comparisons.length){
    html += `<h2 class="section">컷 차이<span style="font-weight:400">내 현재 컷 기준</span></h2><div class="compare-grid">`;
    d.comparisons.forEach(c => {
      const cls = (c.diff==null) ? '' : (c.diff>=0?'pos':'neg');
      html += `<div class="compare-card">
        <div>
          <div class="label">${c.rank}위 컷 대비</div>
          <div class="sub">기준 컷 ${fmtNum(c.cut)}</div>
        </div>
        <div class="diff ${cls}">${fmtDiff(c.diff)}<div class="sub" style="text-align:right">${c.diff!=null&&c.diff>=0?'컷보다 여유':''}</div></div>
      </div>`;
    });
    html += `</div>`;
  }

  if(d.nearby && d.nearby.length){
    html += `<h2 class="section">내 주변 순위<span>위 10명 · 나 · 아래 10명</span></h2>
    <div class="table-wrap"><table class="nearby"><thead><tr><th>순위</th><th>DJ</th><th style="text-align:right">환산 컷</th><th style="text-align:right">비고</th></tr></thead><tbody>`;
    d.nearby.forEach(n => {
      const badge = n.isMe ? '<span class="change-pill" style="color:#be1858;background:#fbe3ea">나</span>' : '';
      html += `<tr class="${n.isMe?'me-row':''}">
        <td class="rank-cell">${n.rank}</td>
        <td><div class="dj-cell">${avatarHtml(n.photo, 32)}<div><div class="dj-name">${escapeHtml(n.nickname)}</div><div class="dj-tag">@${escapeHtml(n.tag)}</div></div></div></td>
        <td style="text-align:right">${fmtNum(n.cut)}<span style="font-size:10.5px;color:var(--text-dim)"> CUT</span></td>
        <td style="text-align:right">${badge}</td>
      </tr>`;
    });
    html += `</tbody></table></div>`;
  }

  html += `<div class="footer-note"><span>${d.total}명 갱신 완료</span><span>마지막 갱신: ${updated}</span></div>`;

  document.getElementById('content').innerHTML = html;
}

async function manualRefresh(){
  const btn = document.getElementById('refreshBtn');
  btn.disabled = true;
  btn.textContent = '🔄 새로고침 중...';
  try{
    const res = await fetch(`${SERVER}/liverank/${DJ_ID}/refresh`, { method:'POST' });
    const d = await res.json();
    if(!d.success){ showToast(d.error || '새로고침 실패'); }
    else { showToast('새로고침 완료!'); }
    await load();
  }catch(e){ showToast('오류: '+e.message); }
  btn.disabled = false;
  btn.textContent = '🔄 새로고침';
}

load();
</script>
</body>
</html>
