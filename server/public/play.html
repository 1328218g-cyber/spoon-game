<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>시청자 허브</title>
<style>
  :root{
    --purple:#6b21d6; --purple2:#8b3cf0; --bg:#f4f1fb; --card:#ffffff;
    --text:#1f1236; --text-dim:#7a6f92; --border:#e6def7;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;background:var(--bg);color:var(--text);padding-bottom:40px}
  header{background:linear-gradient(135deg,var(--purple),var(--purple2));color:#fff;padding:26px 18px 30px;text-align:center;border-radius:0 0 22px 22px}
  header h1{margin:0;font-size:20px}
  header p{margin:6px 0 0;font-size:12.5px;opacity:.85}
  .wrap{max-width:520px;margin:0 auto;padding:16px}
  .item{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;margin-top:14px;text-decoration:none;color:var(--text);box-shadow:0 2px 10px rgba(107,33,214,.05);transition:transform .1s}
  .item:active{transform:scale(.98)}
  .item .icon{font-size:30px;flex-shrink:0;width:48px;height:48px;border-radius:14px;background:#f7f2ff;display:flex;align-items:center;justify-content:center}
  .item .info{flex:1;min-width:0}
  .item .title{font-size:15px;font-weight:700;margin:0 0 4px}
  .item .desc{font-size:12.5px;color:var(--text-dim);margin:0;line-height:1.5}
  .item .arrow{font-size:18px;color:var(--purple2);flex-shrink:0}
  .item.disabled{opacity:.55;cursor:default;pointer-events:none}
  .item.disabled .desc{color:#c0392b}
  .empty{text-align:center;color:var(--text-dim);font-size:13.5px;padding:60px 20px;line-height:1.7}
  .loading{text-align:center;color:var(--text-dim);font-size:13px;padding:40px 20px}
</style>
</head>
<body>
<header>
  <h1 id="djTitle">🎮 시청자 허브</h1>
  <p>지금 이용 가능한 웹 기능을 한 곳에서 골라 들어갈 수 있어요</p>
</header>

<div class="wrap">
  <div id="list"><div class="loading">불러오는 중...</div></div>
</div>

<script>
const DJ_ID = location.pathname.split('/').filter(Boolean)[1] || '';
const SERVER = location.origin;

document.getElementById('djTitle').textContent = '🎮 ' + DJ_ID + '님의 시청자 허브';

function escapeHtml(s){ return (s||'').replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

async function loadList(){
  try{
    const res = await fetch(`${SERVER}/play/${DJ_ID}/list`);
    const d = await res.json();
    const wrap = document.getElementById('list');
    if(!d.success || !d.items.length){
      wrap.innerHTML = '<div class="empty">지금은 이용 가능한 웹 기능이 없어요.<br>방송 중 다시 확인해주세요.</div>';
      return;
    }
    wrap.innerHTML = d.items.map(item => `
      <a class="item ${item.enabled ? '' : 'disabled'}" href="${item.enabled ? item.url : '#'}">
        <div class="icon">${item.icon}</div>
        <div class="info">
          <p class="title">${escapeHtml(item.title)}</p>
          <p class="desc">${item.enabled ? escapeHtml(item.desc) : '⏸️ 현재 진행중이 아닙니다'}</p>
        </div>
        <div class="arrow">${item.enabled ? '›' : ''}</div>
      </a>
    `).join('');
  }catch(e){
    document.getElementById('list').innerHTML = '<div class="empty">불러오지 못했어요. 새로고침해주세요.</div>';
  }
}

loadList();
</script>
</body>
</html>
