<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>박제판</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
    background: radial-gradient(circle at 50% 0%, #241a4a 0%, #0d0a20 60%, #05040f 100%);
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 16px 56px;
  }
  #title {
    font-size: 26px;
    font-weight: 800;
    text-align: center;
    margin: 8px 0 24px;
    text-shadow: 0 0 18px rgba(255,255,255,.55), 0 2px 6px rgba(0,0,0,.5);
    letter-spacing: .5px;
  }
  #frame {
    position: relative;
    width: 100%;
    max-width: 900px;
    background-size: 100% 100%;
    background-position: center;
    background-repeat: no-repeat;
    border-radius: 16px;
    overflow: hidden;
  }
  #frameSpacer {
    width: 100%;
    padding-top: 75%;
  }
  #frame.no-bg #frameSpacer {
    padding-top: 0;
  }
  #grid {
    display: grid;
    gap: 1.5%;
    position: absolute;
  }
  #frame.no-bg #grid {
    position: static;
    width: 100%;
    max-width: 760px;
    margin: 0 auto;
    gap: 14px;
  }
  .slot {
    width: 100%;
    height: 100%;
    background: transparent;
    border: 1px solid rgba(255,255,255,0.45);
    border-radius: 12px;
    padding: 2%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12);
  }
  .slot img {
    width: 92%;
    height: 92%;
    object-fit: contain;
    filter: drop-shadow(0 0 8px rgba(255,255,255,.4));
    margin-bottom: 2%;
  }
  .slot .holder {
    width: 100%;
    text-align: center;
    font-size: 10px;
    font-weight: 700;
    padding: 2px 4px;
    border-radius: 999px;
    background: rgba(255,255,255,0.28);
    border: 1px solid rgba(255,255,255,0.55);
    min-height: 12px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: #1a1a2e;
  }
  .slot .holder.filled {
    background: linear-gradient(90deg, rgba(255,214,240,.75), rgba(214,224,255,.75));
    border-color: rgba(255,255,255,.85);
    color: #2a2450;
    text-shadow: none;
  }
  .slot .holder.empty {
    color: rgba(255,255,255,.55);
    background: rgba(255,255,255,0.14);
    font-weight: 500;
  }
  #footer {
    margin-top: 32px;
    font-size: 12px;
    color: rgba(255,255,255,.4);
    text-align: center;
  }
  #stateMsg {
    margin-top: 80px;
    font-size: 15px;
    color: rgba(255,255,255,.7);
    text-align: center;
  }
</style>
</head>
<body>
  <div id="title" style="display:none"></div>
  <div id="frame" class="no-bg" style="display:none">
    <div id="frameSpacer"></div>
    <div id="grid"></div>
  </div>
  <div id="stateMsg">불러오는 중...</div>
  <div id="footer">에디봇 박제판</div>

<script>
(function(){
  const parts = window.location.pathname.split('/').filter(Boolean);
  const djId = parts[parts.length - 1];
  const titleEl = document.getElementById('title');
  const frameEl = document.getElementById('frame');
  const frameSpacerEl = document.getElementById('frameSpacer');
  const gridEl = document.getElementById('grid');
  const stateEl = document.getElementById('stateMsg');
  let lastBgUrl = null;
  let bgAspect = 1; // naturalWidth/naturalHeight — 칸을 정사각형으로 유지하기 위해 필요

  function escapeHtml(s){ return (s||'').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

  // 배경 이미지를 원본 비율 그대로(잘림 없이) 담기 위해, 실제 이미지를 먼저 로드해서
  // naturalWidth/naturalHeight 비율만큼 프레임의 높이를 만든다.
  // CSS aspect-ratio 대신 옛날부터 쓰던 "padding-top 퍼센트" 트릭을 쓴다 — 카카오톡 인앱브라우저나
  // 구형 안드로이드 웹뷰처럼 aspect-ratio 지원이 불안정한 곳에서도 100% 동일하게 동작한다.
  function applyBackground(url, cb){
    if (!url) {
      frameEl.classList.add('no-bg');
      frameSpacerEl.style.paddingTop = '0';
      frameEl.style.backgroundImage = 'none';
      lastBgUrl = null;
      cb();
      return;
    }
    if (url === lastBgUrl) { cb(); return; }
    const img = new Image();
    img.onload = () => {
      frameEl.classList.remove('no-bg');
      bgAspect = img.naturalWidth / img.naturalHeight;
      frameSpacerEl.style.paddingTop = (img.naturalHeight / img.naturalWidth * 100) + '%';
      frameEl.style.backgroundImage = `url('${url}')`;
      lastBgUrl = url;
      cb();
    };
    img.onerror = () => { cb(); };
    img.src = url;
  }

  function renderGrid(data){
    frameEl.style.display = 'block';
    stateEl.style.display = 'none';

    const columns = Math.max(1, parseInt(data.columns, 10) || 4);
    const rows = Math.max(1, parseInt(data.rows, 10) || 4);
    const hasBg = !frameEl.classList.contains('no-bg');

    if (hasBg) {
      const cellSize = Math.max(2, Number(data.cellSize) || 12); // 프레임 가로폭 대비 %
      const gridLeft = Math.max(0, Number(data.gridLeft) || 0);
      const gridTop = Math.max(0, Number(data.gridTop) || 0);
      gridEl.style.left = gridLeft + '%';
      gridEl.style.top = gridTop + '%';
      gridEl.style.width = (columns * cellSize) + '%';
      // 세로 %는 프레임의 "높이" 기준이라, 가로 %(프레임 "너비" 기준)와 그대로 같은 값을 쓰면
      // 이미지가 세로로 길어질수록 칸도 같이 길쭉해지는 버그가 생긴다. 이미지 가로세로 비율(bgAspect)을
      // 곱해서 보정해야, 배경이 아무리 길어져도 칸이 항상 정사각형으로 유지된다.
      gridEl.style.height = (rows * cellSize * bgAspect) + '%';
    } else {
      gridEl.style.left = '';
      gridEl.style.top = '';
      gridEl.style.width = '';
      gridEl.style.height = '';
    }
    gridEl.style.gridTemplateColumns = `repeat(${columns}, minmax(0,1fr))`;
    gridEl.style.gridTemplateRows = `repeat(${rows}, minmax(0,1fr))`;

    const slots = Array.isArray(data.slots) ? data.slots : [];
    if (!slots.length) {
      gridEl.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:rgba(255,255,255,.5);padding:40px 0">아직 등록된 칸이 없어요.</div>';
      return;
    }
    let autoIndex = 0;
    gridEl.innerHTML = slots.map(s => {
      let placeStyle = '';
      if (s.row && s.col) {
        placeStyle = `grid-row:${s.row};grid-column:${s.col};`;
      } else {
        const r = Math.floor(autoIndex / columns) + 1;
        const c = (autoIndex % columns) + 1;
        placeStyle = `grid-row:${r};grid-column:${c};`;
        autoIndex++;
      }
      return `
      <div class="slot" style="${placeStyle}">
        ${s.giftImage ? `<img src="${escapeHtml(s.giftImage)}" onerror="this.style.visibility='hidden'">` : ''}
        <div class="holder ${s.holderNickname ? 'filled' : 'empty'}">${s.holderNickname ? escapeHtml(s.holderNickname) : '\u00A0'}</div>
      </div>
    `}).join('');
  }

  function render(data){
    titleEl.textContent = data.title || '박제판';
    titleEl.style.display = 'block';
    applyBackground(data.bgImageUrl, () => renderGrid(data));
  }

  async function load(){
    try {
      const res = await fetch('/board-data/' + encodeURIComponent(djId));
      const d = await res.json();
      if (!d.success) {
        stateEl.textContent = d.error || '박제판을 찾을 수 없어요.';
        return;
      }
      render(d);
    } catch(e) {
      stateEl.textContent = '불러오는 중 오류가 발생했어요.';
    }
  }

  function connectSSE(){
    try {
      const es = new EventSource('/events');
      es.onmessage = (ev) => {
        try {
          const msg = JSON.parse(ev.data);
          if (msg.type === 'trophyboard' && msg.djId === djId) {
            render(msg);
          }
        } catch(e){}
      };
      es.onerror = () => { /* 브라우저가 알아서 재연결 시도함 */ };
    } catch(e){}
  }

  load();
  connectSSE();
})();
</script>
</body>
</html>
