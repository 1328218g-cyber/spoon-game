<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>⚔️ 방치 RPG</title>
<style>
:root{--bg:#0f1020;--panel:#1a1b33;--panel2:#23254a;--line:#33366a;--text:#eef0ff;--dim:#9aa0c8;--gold:#ffd34d;--gem:#6ee7ff;--soul:#c48bff;--red:#ff5d73;--green:#5ee38a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#07070f;color:var(--text);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Segoe UI",sans-serif}
body{display:flex;justify-content:center}
.app{width:100%;max-width:430px;height:100vh;height:100dvh;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden}
.top{display:flex;align-items:center;gap:8px;padding:10px 12px 6px;background:linear-gradient(#1d1f40,#14152c);border-bottom:1px solid var(--line)}
.lv{width:42px;height:42px;border-radius:12px;background:radial-gradient(circle at 30% 30%,#ffb35c,#e0673b);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;font-size:15px;line-height:1;box-shadow:0 0 0 2px #000,0 0 0 4px #ffcf7a55}
.lv small{font-size:9px;opacity:.85}
.who{flex:1;min-width:0}
.who b{font-size:13px}
.bar{height:7px;border-radius:9px;background:#0b0c1a;overflow:hidden;margin-top:4px;border:1px solid #000}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#7c5cff,#c48bff);width:0}
.cur{display:flex;gap:6px}
.coin{display:inline-block;width:1.05em;height:1.05em;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6b0,#ffd34d 45%,#c88a10);box-shadow:inset 0 0 0 1.5px #8a5a00,inset 0 0 0 3px #ffe58a;vertical-align:-.18em;flex:none}
.ic .coin{width:26px;height:26px}
.chip{display:flex;align-items:center;gap:4px;padding:4px 8px;border-radius:999px;background:#0b0c1a;border:1px solid var(--line);font-size:12px;font-weight:800;white-space:nowrap}
.stage{display:flex;align-items:center;justify-content:space-between;padding:6px 12px;font-size:12px;color:var(--dim);background:#121329}
.stage b{color:var(--text);font-size:13px}
.prog{display:flex;gap:3px}
.prog span{width:14px;height:6px;border-radius:3px;background:#2a2c55}
.prog span.on{background:var(--gold)}
.prog span.boss{background:#5a2033}.prog span.boss.on{background:var(--red)}
.scene{position:relative;background:#000}
canvas{display:block;width:100%;}
.buffs{position:absolute;left:8px;top:8px;display:flex;gap:4px;flex-wrap:wrap;max-width:70%}
.buff{font-size:10.5px;font-weight:800;padding:3px 7px;border-radius:8px;background:#000a;border:1px solid #fff3}
.bosstimer{position:absolute;right:8px;top:8px;font-size:12px;font-weight:900;color:#fff;background:#b0233b;padding:4px 8px;border-radius:8px;display:none;box-shadow:0 0 12px #ff5d73aa}
.skills{display:flex;gap:8px;justify-content:center;padding:8px 12px;background:linear-gradient(#14152c,#101124);border-bottom:1px solid var(--line);align-items:center}
.sk{position:relative;width:54px;height:54px;border-radius:14px;border:2px solid #000;background:#2a2c55;font-size:24px;display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;box-shadow:inset 0 -3px 0 #0006}
.sk .cd{position:absolute;left:0;right:0;bottom:0;background:#000b;height:0}
.sk .t{position:absolute;bottom:2px;right:4px;font-size:10px;font-weight:900;text-shadow:0 1px 2px #000}
.sk.lock{filter:grayscale(1) brightness(.5)}
.auto{margin-left:6px;padding:8px 10px;border-radius:12px;border:2px solid #000;background:#2a2c55;color:var(--dim);font-weight:900;font-size:12px;cursor:pointer}
.auto.on{background:linear-gradient(#ffcf5a,#f0a020);color:#3a2300}
.tabs{display:flex;background:#121329;border-bottom:1px solid var(--line)}
.tab{flex:1;padding:10px 0 9px;text-align:center;font-size:12px;font-weight:800;color:var(--dim);cursor:pointer;border-bottom:3px solid transparent}
.tab.on{color:var(--text);border-color:var(--gold);background:#1a1b38}
.panel{flex:1;overflow:auto;padding:10px 12px 90px}
.row{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;background:var(--panel);border:1px solid var(--line);margin-bottom:8px}
.ic{width:42px;height:42px;border-radius:12px;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-size:22px;flex:none;border:1px solid #000}
.info{flex:1;min-width:0}
.info b{font-size:13.5px}
.info .s{font-size:11.5px;color:var(--dim);margin-top:2px}
.btn{border:2px solid #000;border-radius:12px;padding:8px 10px;font-weight:900;font-size:12px;cursor:pointer;background:linear-gradient(#ffcf5a,#f0a020);color:#3a2300;min-width:78px;box-shadow:inset 0 -3px 0 #0003}
.btn.blue{background:linear-gradient(#7fe8ff,#2bb5e6);color:#05334a}
.btn.purple{background:linear-gradient(#d8a8ff,#9a5cf0);color:#26064d}
.btn.gray{background:#2a2c55;color:var(--dim)}
.btn:disabled{filter:grayscale(1) brightness(.6);cursor:default}
.h{font-size:12px;color:var(--dim);margin:12px 2px 8px;font-weight:800}
.gear{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:6px}
.slot{border-radius:14px;background:var(--panel);border:2px solid var(--line);padding:8px 6px;text-align:center;font-size:11px;min-height:86px}
.slot .e{font-size:26px}
.inv{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.it{aspect-ratio:1;border-radius:8px;border-width:0!important;background:none!important;box-shadow:none!important;background:var(--panel);border:2px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:20px;cursor:pointer;position:relative}
.it small{font-size:9px;font-weight:800}
.it img,.slot img{width:100%;height:100%;object-fit:contain;border-radius:9px;display:block}
.it{padding:0;overflow:hidden}.it small{font-size:8px!important;position:absolute;bottom:1px;left:0;right:0;text-align:center;text-shadow:0 1px 2px #000;background:linear-gradient(transparent,#000a)}
.slot .pic{width:40px;height:40px;margin:3px auto}
.cat{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}.cat div{text-align:center;font-size:8.5px;color:var(--dim);line-height:1.2;word-break:keep-all}.cat img{width:100%;border-radius:10px}
.r0{border-color:#b8bdd6}.r1{border-color:#5ee38a}.r2{border-color:#4aa8ff}.r3{border-color:#c48bff;box-shadow:0 0 8px #c48bff66}.r4{border-color:#ffb020;box-shadow:0 0 12px #ffb020aa}
.c0{color:#c9cde6}.c1{color:#5ee38a}.c2{color:#4aa8ff}.c3{color:#c48bff}.c4{color:#ffb020}
.rank{display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:1px solid var(--line);font-size:13px}
.rank .n{width:22px;font-weight:900;color:var(--gold);text-align:center}
.rank.me{background:#2a2c55;border-radius:10px}
.modal{position:absolute;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:20;padding:20px}
.modal .box{width:100%;max-width:340px;background:linear-gradient(#262855,#1a1b38);border:2px solid #000;border-radius:18px;padding:18px;text-align:center;box-shadow:0 0 0 2px #ffcf7a55,0 20px 50px #000}
.modal h3{margin:0 0 6px;font-size:18px}
.toast{position:absolute;left:50%;top:150px;transform:translateX(-50%);background:#000d;border:1px solid #fff3;padding:8px 14px;border-radius:12px;font-size:12.5px;font-weight:800;z-index:30;pointer-events:none;opacity:0;transition:opacity .2s;white-space:nowrap}
.toast.on{opacity:1}
.gacha{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin:12px 0}
.gacha .it{animation:pop .35s ease backwards}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.note{font-size:11px;color:var(--dim);line-height:1.6;background:#121329;border-radius:12px;padding:10px;border:1px dashed var(--line)}
</style></head><body>
<div class="app" id="app">
  <div class="top">
    <div class="lv"><small>LV</small><span id="lv">1</span></div>
    <div class="who"><b id="pname">🐱 손님</b> <span style="font-size:11px;color:var(--dim)">전투력 <b id="power" style="color:var(--gold)">0</b></span><div class="bar"><i id="expbar"></i></div></div>
    <div class="cur"><div class="chip"><i class="coin"></i> <span id="gold">0</span></div><div class="chip" style="color:var(--gem)">💎 <span id="gem">0</span></div></div>
  </div>
  <div class="stage"><span><b id="stname">초록 숲 1-1</b> <span id="stsub"></span></span><div class="prog" id="prog"></div></div>
  <div class="scene"><div id="scene3d" style="position:relative;transition:background .6s"><canvas id="cv" width="360" height="180" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none"></canvas></div><div class="buffs" id="buffs"></div><div class="bosstimer" id="bt"></div></div>
  <div class="skills" id="skills"></div>
  <div class="tabs" id="tabs"></div>
  <div class="panel" id="panel"></div>
  <div class="modal" id="modal"><div class="box" id="mbox"></div></div>
  <div class="toast" id="toast"></div>
</div>
<script src="/lib/three.min.js"></script>
<script>
const ZONES=[
 {name:'초록 숲',sky:['#7ec8ff','#c6ecff'],hill:'#4f9b62',hill2:'#3c7c4e',ground:'#6a4a32',grass:'#59c26b',mons:[['slime','#6ee36e','#3a9a46','#c8ffc8','슬라임'],['mush','#ff6a6a','#b53a3a','#ffd0d0','버섯돌이']]},
 {name:'달빛 동굴',sky:['#22204a','#3b2f6b'],hill:'#3a3470',hill2:'#2b2656',ground:'#3b3550',grass:'#6b5ca8',mons:[['bat','#9b6bff','#5a3aa8','#d9c8ff','동굴박쥐'],['slime','#56b8ff','#2a6fb0','#d0eeff','물방울']]},
 {name:'불꽃 화산',sky:['#4a1414','#a1371f'],hill:'#5a2020','hill2':'#3d1515',ground:'#2b1a1a',grass:'#ff7a2a',mons:[['slime','#ff6a2a','#a83a12','#ffd2a0','용암슬라임'],['bat','#ff4a5a','#8a1a2a','#ffc0c8','불박쥐']]},
];

// ───────── 숫자 (만·억·조) ─────────
function fmt(n){n=Math.floor(n);if(n<1e4)return n.toLocaleString();const u=[['경',1e16],['조',1e12],['억',1e8],['만',1e4]];for(const [k,v] of u)if(n>=v){const a=n/v;return (a>=100?Math.floor(a):a.toFixed(1).replace(/\.0$/,''))+k}return ''+n}

// ───────── 저장 (이 브라우저에만 · 실제 버전은 서버에 저장) ─────────
// ───────── 서버 저장 (고유닉 로그인) ─────────
const DJ_ID=decodeURIComponent((location.pathname.split('/')[2]||'').trim());
const API=location.origin+'/idle/'+encodeURIComponent(DJ_ID);
const WKEY='idle_webUserId_'+DJ_ID;
let webUserId='';try{webUserId=localStorage.getItem(WKEY)||''}catch(_){}
const DEF={nick:'',tag:'',lv:1,exp:0,gold:0,gem:30,soul:0,z:1,s:1,kills:0,best:0,upg:{atk:0,hp:0,crit:0,spd:0,gold:0},eq:{weapon:null,armor:null,ring:null},inv:[],autoSkill:true,autoBoss:true,last:Date.now(),reb:0};
let S=JSON.parse(JSON.stringify(DEF)),ready=false,saving=false;
function save(){if(!ready)return;S.last=Date.now();if(saving)return;saving=true;
  fetch(API+'/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({webUserId,state:S,summary:{lv:S.lv,power:Math.floor(power()),z:S.z,s:S.s}})})
  .then(r=>r.json()).then(d=>{if(d&&d.success&&d.gemGrant){S.gem=Math.max(0,S.gem+d.gemGrant);toast(`💎 DJ가 보석 ${d.gemGrant>0?'+':''}${d.gemGrant}개를 ${d.gemGrant>0?'줬어요!':'뺐어요'}`);if(curTab==='gacha')renderTab()}}).catch(()=>{}).finally(()=>{saving=false})}

// ───────── 능력치 ─────────
const buffs={};
const bon=(k)=>buffs[k]&&buffs[k].until>Date.now()?buffs[k].v:1;
// ───────── 아이템 (모두 🎁 뽑기 상자에서 · 같은 장비도 등급이 달라요) ─────────
const RAR=[{n:'일반',w:55,m:1,c:'#b8bdd6'},{n:'고급',w:27,m:1.8,c:'#5ee38a'},{n:'레어',w:12,m:3.2,c:'#4aa8ff'},{n:'영웅',w:5,m:6,c:'#c48bff'},{n:'전설',w:1,m:12,c:'#ffb020'}];
const SLOT={weapon:{n:'무기',stat:'공격력'},armor:{n:'갑옷',stat:'체력'},ring:{n:'반지',stat:'치명타'}};
const ITEMS={
 weapon:[{k:'w1',n:'나무 검',kind:'sword',t:1,col:'#c08a52'},{k:'w2',n:'강철 검',kind:'sword',t:2,col:'#e3ecf8'},{k:'w3',n:'전투 도끼',kind:'axe',t:2,col:'#c9d2e0'},{k:'w4',n:'기사의 창',kind:'spear',t:3,col:'#e8eef8'},{k:'w5',n:'별빛 지팡이',kind:'wand',t:3,col:'#7fd6ff'},{k:'w6',n:'용살검',kind:'sword',t:4,col:'#ff5a4a'},{k:'w7',n:'냥냥 발톱',kind:'claw',t:4,col:'#ffd0e0'},{k:'w8',n:'고양이 단검',kind:'dagger',t:1,col:'#dfe9f7'},{k:'w9',n:'깃털 낚싯대',kind:'feather',t:1,col:'#ff8fb2'},{k:'w10',n:'참치 대검',kind:'fish',t:2,col:'#5aa8e6'},{k:'w11',n:'전쟁 망치',kind:'hammer',t:2,col:'#b8c2d4'},{k:'w12',n:'엘프의 활',kind:'bow',t:3,col:'#7fdc8a'},{k:'w13',n:'고대 마법서',kind:'book',t:3,col:'#8a5cff'},{k:'w14',n:'벚꽃 카타나',kind:'katana',t:3,col:'#ffc2d8'},{k:'w15',n:'바다 삼지창',kind:'trident',t:4,col:'#5fe0ff'},{k:'w16',n:'그림자 낫',kind:'scythe',t:4,col:'#b48cff'}],
 armor:[{k:'a1',n:'가죽 갑옷',kind:'leather',t:1,col:'#a8743f'},{k:'a2',n:'사슬 갑옷',kind:'chain',t:2,col:'#aab4c4'},{k:'a3',n:'마법사 로브',kind:'robe',t:2,col:'#7d5cff'},{k:'a4',n:'강철 판금',kind:'plate',t:3,col:'#d7e0f2'},{k:'a5',n:'용비늘 갑옷',kind:'dragon',t:4,col:'#d6455d'},{k:'a6',n:'고양이 후드티',kind:'hoodie',t:1,col:'#ffb35c'},{k:'a7',n:'닌자 복장',kind:'ninja',t:2,col:'#3a3f5c'},{k:'a8',n:'서리 갑옷',kind:'frost',t:3,col:'#9fe7ff'},{k:'a9',n:'그림자 망토',kind:'shadow',t:3,col:'#5b3a8f'},{k:'a10',n:'천사의 갑옷',kind:'angel',t:4,col:'#fff6dc'}],
 ring:[{k:'r1',n:'구리 반지',kind:'ring',t:1,col:'#c87a4a',gem:'#ffffff'},{k:'r2',n:'은 반지',kind:'ring',t:1,col:'#d9e2ee',gem:'#9fe7ff'},{k:'r3',n:'루비 반지',kind:'ring',t:2,col:'#ffd34d',gem:'#ff3d5a'},{k:'r4',n:'사파이어 반지',kind:'ring',t:3,col:'#ffd34d',gem:'#3d7bff'},{k:'r5',n:'에메랄드 반지',kind:'ring',t:3,col:'#ffd34d',gem:'#2fd27a'},{k:'r6',n:'고양이 발바닥 반지',kind:'paw',t:4,col:'#ffd34d',gem:'#ff8fb2'},{k:'r7',n:'자수정 반지',kind:'ring',t:2,col:'#d9e2ee',gem:'#a35cff'},{k:'r8',n:'다이아몬드 반지',kind:'ring',t:4,col:'#eef3ff',gem:'#e6fbff'},{k:'r9',n:'별빛 반지',kind:'star',t:3,col:'#ffd34d',gem:'#fff1a0'},{k:'r10',n:'츄르 반지',kind:'fishring',t:2,col:'#ffb35c',gem:'#5aa8e6'},{k:'r11',n:'해골 반지',kind:'skull',t:3,col:'#8a8f9c',gem:'#f2f2f2'}]};
const TIERW={1:40,2:30,3:20,4:10};
const itemDef=(it)=>{const l=ITEMS[it.s]||[];return l.find(x=>x.k===it.key)||l[0]};
const itemName=(it)=>itemDef(it).n;
const statTxt=(it)=>`${SLOT[it.s].stat} +${it.v}%`;
// 예전 저장(이모지 장비)은 기본 장비로 바꿔요
for(const it of [...(S.inv||[]),...Object.values(S.eq||{})])if(it&&!it.key)it.key=ITEMS[it.s][0].k;
// 🖼️ 아이템 그림 (코드로 그려서 캐시)
// 🖼️ 아이템 그림 — 실제 방치형 게임처럼 부품(칼날·손잡이·장식)을 나눠 그리고, 등급이 오를수록 장식이 붙어요
//   일반: 기본 모양 · 고급: 금테 · 레어: 보석·룬 · 영웅: 날개·가시·오라 · 전설: 빛나는 날·불꽃·후광
const ICON={};
function shade(hex,a){const n=parseInt(hex.slice(1),16);let r=n>>16,g=(n>>8)&255,b=n&255;const f=(v)=>Math.max(0,Math.min(255,Math.round(a>0?v+(255-v)*a:v*(1+a))));return '#'+((1<<24)+(f(r)<<16)+(f(g)<<8)+f(b)).toString(16).slice(1)}
const K0=(d)=>['ring','paw','star','fishring','skull'].includes(d.kind)?'ring':d.kind;
function itemIcon(it){
  const d=itemDef(it),g=it.r,key=d.k+'_'+g;if(ICON[key])return ICON[key];
  const R=RAR[g],RC=R.c;
  const lc=document.createElement('canvas');lc.width=lc.height=192;const x=lc.getContext('2d');const isR=K0(d)==='ring',isA=it.s==='armor';const Z=isR?2.6:isA?2.3:2.3,ox=isR?0:isA?0:10,oy=isR?0:isA?10:10;x.setTransform(Z,0,0,Z,96-48*Z+ox,96-48*Z+oy); // 칸을 꽉 채우게 크게
  const OL='#15132a';x.lineJoin='round';x.lineCap='round';
  const P=(pts)=>{x.beginPath();pts.forEach(([a,b],i)=>i?x.lineTo(a,b):x.moveTo(a,b));x.closePath()};
  // 만화 음영: 본색 → 반쪽 어둡게 → 가장자리 밝은 선 → 외곽선
  const cel=(path,col,o)=>{o=o||{};path();x.fillStyle=col;x.fill();x.save();path();x.clip();x.fillStyle=shade(col,-.32);x.beginPath();if(o.split==='v'){x.rect(o.cx||0,-200,400,400)}else{x.moveTo(-200,200);x.lineTo(200,-200);x.lineTo(400,400);x.closePath()}x.fill();x.strokeStyle=shade(col,.55);x.lineWidth=2.2;path();x.stroke();x.restore();path();x.lineWidth=o.lw||2.4;x.strokeStyle=OL;x.stroke()};
  const GOLD='#ffcf3a',SILV='#dfe6f2';
  const gem=(cx,cy,r,col,cut)=>{x.save();x.translate(cx,cy);const n=cut==='round'?10:8;const pts=[];for(let i=0;i<n;i++){const a=-Math.PI/2+i/n*Math.PI*2;pts.push([Math.cos(a)*r,Math.sin(a)*r])}
    P(pts);x.fillStyle=shade(col,-.25);x.fill();x.save();P(pts);x.clip();x.fillStyle=col;x.beginPath();x.moveTo(-r,-r);x.lineTo(r,-r);x.lineTo(-r,r);x.fill();
    const tb=pts.map(([a,b])=>[a*.5,b*.5]);P(tb);x.fillStyle=shade(col,.35);x.fill();x.strokeStyle=shade(col,.6);x.lineWidth=.8;pts.forEach(([a,b],i)=>{x.beginPath();x.moveTo(a,b);x.lineTo(tb[i][0],tb[i][1]);x.stroke()});x.restore();

    const slot=(k)=>{const it=S.eq[k];return `<div class="slot ${it?'r'+it.r:''}" ${it?`data-eq="${k}"`:''}><div style="color:var(--dim);font-weight:800">${SLOT[k].n}</div>${it?`<img class="pic" src="${itemIcon(it)}"><div class="c${it.r}" style="font-weight:900;font-size:11px">${RAR[it.r].n} ${itemName(it)}</div><div>${statTxt(it)}</div>`:'<div style="font-size:28px;margin:14px 0">➖</div><div style="color:var(--dim)">비어 있음</div>'}</div>`};
    const inv=S.inv.slice().sort((a,b)=>b.r-a.r||b.v-a.v);
    P.innerHTML=`<div class="h">장착 중</div><div class="gear">${slot('weapon')}${slot('armor')}${slot('ring')}</div>`+
    `<div class="h" style="display:flex;justify-content:space-between;align-items:center"><span>가방 (${inv.length})</span><span><button class="btn gray" id="bestEq" style="min-width:0;padding:6px 8px">⚡ 최고 장착</button> <button class="btn gray" id="sellAll" style="min-width:0;padding:6px 8px"><i class="coin"></i> 일반·고급 판매</button></span></div>`+
    (inv.length?`<div class="inv">${inv.map(it=>`<div class="it r${it.r}" data-id="${it.id}"><img src="${itemIcon(it)}"><small class="c${it.r}">+${it.v}%</small></div>`).join('')}</div>`:`<div class="note">가방이 비어 있어요. 🎁 뽑기에서 장비를 뽑아보세요!</div>`)+
    `<div class="note" style="margin-top:10px">아이템을 누르면 자세히 보고 장착·판매할 수 있어요 · 무기 = 공격력, 갑옷 = 체력, 반지 = 치명타</div>`;
    P.querySelectorAll('.it').forEach(el=>el.onclick=()=>{const it=S.inv.find(x=>x.id===el.dataset.id);if(it)itemModal(it)});
    P.querySelectorAll('[data-eq]').forEach(el=>el.onclick=()=>itemModal(S.eq[el.dataset.eq]));
    $('sellAll').onclick=()=>{const sold=S.inv.filter(x=>x.r<=1);const g=sold.reduce((a,x)=>a+sellPrice(x),0);S.inv=S.inv.filter(x=>x.r>1);S.gold+=g;toast(`<i class="coin"></i> ${fmt(g)} 골드에 판매 (${sold.length}개)`);save();renderTab()};
    $('bestEq').onclick=()=>{for(const k of Object.keys(SLOT)){const best=S.inv.filter(x=>x.s===k).sort((a,b)=>b.v-a.v)[0];if(best&&(!S.eq[k]||best.v>S.eq[k].v))equip(best,true)}save();renderTab();toast('⚡ 가장 좋은 장비로 바꿨어요')};
  }else if(curTab==='gacha'){
    P.innerHTML=`<div class="row" style="flex-direction:column;align-items:stretch;text-align:center;padding:16px"><div style="font-size:40px">🎁</div><b style="font-size:16px">장비 뽑기 상자</b><div class="s" style="color:var(--dim);font-size:12px;margin:4px 0 12px">${RAR.map((r,i)=>`<span class="c${i}">${r.n} ${r.w}%</span>`).join(' · ')}<br>무기·갑옷·반지 전부 여기서만 나와요 · 같은 장비도 등급이 높을수록 강해요</div>
    <div style="display:flex;gap:8px"><button class="btn blue" id="g1" style="flex:1">💎 10 · 1회</button><button class="btn purple" id="g10" style="flex:1">💎 90 · 10회</button></div></div><div id="gres"></div>
    <div class="h" style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">📖 장비 도감 (${Object.values(ITEMS).reduce((a,l)=>a+l.length,0)}종 × 5등급) ${RAR.map((r,i)=>`<span class="chip c${i}" data-cg="${i}" style="cursor:pointer;padding:3px 8px;${i===catG?'background:#2a2c55;border-color:'+r.c:''}">${r.n}</span>`).join('')}</div>
    ${Object.keys(ITEMS).map(sk=>`<div class="h" style="margin-top:6px">${SLOT[sk].n}</div><div class="cat">${ITEMS[sk].map(d=>`<div><img src="${itemIcon({s:sk,key:d.k,r:catG})}"><div>${d.n}</div><div>${'★'.repeat(d.t)}</div></div>`).join('')}</div>`).join('')}
    <div class="note" style="margin-top:10px">★ 많을수록 기본이 강한 장비(잘 안 나와요) · 보석은 대장을 잡거나, 방송에서 🥄 스푼 선물을 하면 받아요.</div>`;
    const pull=(n,cost)=>{if(S.gem<cost){toast('💎 보석이 부족해요');return}S.gem-=cost;const got=[];for(let i=0;i<n;i++)got.push(rollItem());S.inv.push(...got);save();
      $('gres').innerHTML=`<div class="gacha">${got.map((it,i)=>`<div class="it r${it.r}" style="animation-delay:${i*.06}s" title="${RAR[it.r].n} ${itemName(it)}"><img src="${itemIcon(it)}"><small class="c${it.r}">${RAR[it.r].n}</small></div>`).join('')}</div>`;
      $('gres').querySelectorAll('.it').forEach((el,i)=>el.onclick=()=>itemModal(got[i]));
      const top=got.reduce((a,b)=>b.r>a.r?b:a);if(top.r>=3)toast(`✨ ${RAR[top.r].n} ${itemName(top)} 등장!`)};
    $('g1').onclick=()=>pull(1,10);$('g10').onclick=()=>pull(10,90);
    P.querySelectorAll('[data-cg]').forEach(c=>c.onclick=()=>{catG=Number(c.dataset.cg);const st=P.scrollTop;renderTab();P.scrollTop=st});
  }else if(curTab==='reb'){
    const souls=Math.floor(Math.pow(Math.max(0,S.best-14)/5,1.4));
    P.innerHTML=`<div class="row" style="flex-direction:column;text-align:center;padding:16px"><div style="font-size:40px">🔮</div><b style="font-size:16px">환생</b>
    <div style="color:var(--dim);font-size:12px;margin:6px 0 10px;line-height:1.6">처음(숲 1-1)부터 다시 시작하는 대신 <b style="color:var(--soul)">영혼석</b>을 받아요.<br>영혼석 1개당 공격력·골드 +15%, 체력 +10% (영원히)<br>레벨·장비·보석은 그대로, 강화와 골드는 처음으로 돌아가요.</div>
    <div style="font-size:13px">지금 영혼석 <b style="color:var(--soul)">${S.soul}</b> · 환생하면 <b style="color:var(--soul)">+${souls}</b></div>
    <button class="btn purple" id="rebBtn" style="margin-top:12px" ${souls<1?'disabled':''}>${souls<1?'불꽃 화산 1-5부터 할 수 있어요':'🔮 환생하기'}</button></div>`;
    $('rebBtn').onclick=()=>{if(souls<1)return;S.soul+=souls;S.reb++;S.z=1;S.s=1;S.kills=0;S.gold=0;S.upg={atk:0,hp:0,crit:0,spd:0,gold:0};mon=null;hero.hp=maxHp();save();toast(`🔮 환생! 영혼석 +${souls}`);renderTab()};
  }else if(curTab==='spoon'){
    P.innerHTML=`<div class="h">🥄 방송 채팅 명령어</div>
    <div class="row"><div class="ic">⚔️</div><div class="info"><b>!내캐릭</b><div class="s">내 레벨·전투력·스테이지·보석을 채팅에 보여줘요</div></div></div>
    <div class="row"><div class="ic">🔗</div><div class="info"><b>!게임</b><div class="s">이 게임 주소를 채팅에 알려줘요</div></div></div>
    <div class="row"><div class="ic">💎</div><div class="info"><b>!보석 [고유닉] [개수]</b><div class="s">DJ·매니저 전용 · 그 시청자에게 보석 지급 (음수면 차감) · 바로 이 화면에 들어와요</div></div></div>
    <div class="note">👤 <b>${escH(S.nick)}</b> (@${escH(S.tag)}) 으로 플레이 중 · 진행은 10초마다 자동 저장돼요</div>`;
  }else if(curTab==='rank'){
    P.innerHTML=`<div class="h">🏆 이 방송 전투력 랭킹</div><div class="row" style="display:block;padding:4px" id="rankBox"><div class="rank">불러오는 중…</div></div>`;
    save();
    fetch(API+'/rank').then(r=>r.json()).then(d=>{const box=$('rankBox');if(!box)return;const l=(d&&d.list)||[];
      box.innerHTML=l.length?l.map((r,i)=>`<div class="rank ${String(r.tag).toLowerCase()===String(S.tag).toLowerCase()?'me':''}"><span class="n">${i<3?['🥇','🥈','🥉'][i]:i+1}</span><span style="flex:1">${escH(r.nick)} <span style="color:var(--dim);font-size:11px">Lv.${r.lv} · ${r.z}-${r.s}</span></span><b style="color:var(--gold)">${fmt(r.power)}</b></div>`).join(''):'<div class="rank">아직 아무도 없어요</div>'}).catch(()=>{});
  }
}
function rollItem(){
  let r=Math.random()*100,ri=0;for(let j=0;j<RAR.length;j++){if(r<RAR[j].w){ri=j;break}r-=RAR[j].w}
  const sk=Object.keys(ITEMS)[Math.floor(Math.random()*3)];const list=ITEMS[sk];let tw=list.reduce((a,d)=>a+TIERW[d.t],0)*Math.random(),d=list[0];for(const x of list){if(tw<TIERW[x.t]){d=x;break}tw-=TIERW[x.t]}
  const v=Math.round((6+d.t*4)*RAR[ri].m*(1+S.z*0.12)*(0.9+Math.random()*0.2));
  return {id:Math.random().toString(36).slice(2),s:sk,key:d.k,r:ri,v};
}
const sellPrice=(it)=>Math.floor(60*(it.r+1)*(itemDef(it).t)*(1+idx()));
function equip(it,quiet){const old=S.eq[it.s];S.eq[it.s]=it;S.inv=S.inv.filter(x=>x.id!==it.id);if(old)S.inv.push(old);applyLook();if(!quiet)toast(`${RAR[it.r].n} ${itemName(it)} 장착!`)}
function itemModal(it){
  const cur=S.eq[it.s],inBag=S.inv.some(x=>x.id===it.id),d=itemDef(it);
  const diff=cur&&cur.id!==it.id?it.v-cur.v:null;
  openModal(`<img src="${itemIcon(it)}" style="width:110px;height:110px;border-radius:16px;display:block;margin:0 auto 8px;box-shadow:0 0 24px ${RAR[it.r].c}66">
   <div class="c${it.r}" style="font-weight:900;font-size:13px">${RAR[it.r].n} · ${'★'.repeat(d.t)}</div><h3>${d.n}</h3>
   <div style="font-size:15px;font-weight:800">${statTxt(it)}</div>
   ${diff!=null?`<div style="font-size:12px;margin-top:4px;color:${diff>=0?'var(--green)':'var(--red)'}">지금 장비보다 ${diff>=0?'+':''}${diff}%</div>`:''}
   <div style="display:flex;gap:8px;margin-top:14px">${inBag?`<button class="btn" style="flex:1" id="mEq">장착</button><button class="btn gray" style="flex:1" id="mSell"><i class="coin"></i> ${fmt(sellPrice(it))} 판매</button>`:''}<button class="btn gray" style="flex:1" onclick="closeModal()">닫기</button></div>`);
  const e=$('mEq');if(e)e.onclick=()=>{equip(it);save();closeModal();renderTab()};
  const sl=$('mSell');if(sl)sl.onclick=()=>{S.inv=S.inv.filter(x=>x.id!==it.id);S.gold+=sellPrice(it);toast(`<i class="coin"></i> ${fmt(sellPrice(it))} 판매`);save();closeModal();renderTab()};
}
function worldDown(){if(!world)return;world=null;const g=monStat(true).gold*3,gem=30;S.gold+=g;S.gem+=gem;openModal(`<div style="font-size:44px">👑</div><h3>월드보스 처치!</h3><div style="color:var(--dim);font-size:12.5px;margin-bottom:12px">시청자 모두 함께 잡았어요</div><div style="font-size:15px;line-height:1.9"><i class="coin"></i> ${fmt(g)}<br>💎 ${gem}</div><button class="btn" style="margin-top:14px;width:100%" onclick="closeModal()">받기</button>`);save()}
function openModal(h){$('mbox').innerHTML=h;$('modal').style.display='flex'}
window.closeModal=()=>{$('modal').style.display='none'};
// 방치 보상 — 꺼둔 동안 잡았을 몬스터 수를 계산 (최대 12시간)
function offline(sec){
  sec=Math.min(sec,12*3600);if(sec<60)return;
  const st=monStat(false);const dps=atk()*aspd()*(1+crit()*1.2);const per=st.hp/dps+1.2;const kills=Math.floor(sec/per*0.8);
  const g=kills*st.gold*goldMul(),e=kills*st.exp;S.gold+=g;gainExp(e);const gem=Math.floor(sec/3600)*2;S.gem+=gem;save();
  const hh=Math.floor(sec/3600),mm=Math.floor(sec%3600/60);
  openModal(`<div style="font-size:44px">💤</div><h3>방치 보상</h3><div style="color:var(--dim);font-size:12.5px;margin-bottom:12px">${hh?hh+'시간 ':''}${mm}분 동안 ${escH(S.nick)} 캐릭터가 혼자 싸웠어요</div><div style="font-size:15px;line-height:1.9">⚔️ 몬스터 ${fmt(kills)}마리<br><i class="coin"></i> ${fmt(g)}<br>✨ 경험치 ${fmt(e)}${gem?'<br>💎 '+gem:''}</div><button class="btn" style="margin-top:14px;width:100%" onclick="closeModal()">받기</button>`);
}
// ───────── 로그인 (웹에서 받은 코드를 방송 채팅에 입력) ─────────
function loginView(code,cmd,expired){
  openModal(`<div style="font-size:40px">⚔️</div><h3>방치 RPG 시작하기</h3>
   <div style="color:var(--dim);font-size:12.5px;line-height:1.7;margin:6px 0 12px">방송 채팅에 아래 코드를 그대로 입력하면<br>내 스푼 닉네임으로 캐릭터가 만들어져요</div>
   ${code?`<div style="font-size:30px;font-weight:900;letter-spacing:6px;background:#0b0c1a;border:2px dashed var(--gold);border-radius:14px;padding:12px;color:var(--gold)">${code}</div><div style="font-size:11.5px;color:var(--dim);margin-top:6px">또는 <b>${escH(cmd||'!게임인증')} ${code}</b> · 10분 안에 입력해주세요</div><div style="margin-top:12px;font-size:12px;color:var(--dim)">⏳ 채팅 입력을 기다리는 중…</div>`:`<button class="btn" id="getCode" style="width:100%">${expired?'코드 다시 받기':'인증 코드 받기'}</button>`}`);
  const b=$('getCode');if(b)b.onclick=register;
}
async function register(){try{const d=await (await fetch(API+'/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({webUserId})})).json();if(!d.success){loginView();toast(escH(d.error||'실패'));return}webUserId=d.webUserId;try{localStorage.setItem(WKEY,webUserId)}catch(_){}if(d.linked)return checkMe();loginView(d.code,d.cmd)}catch(_){toast('서버에 연결하지 못했어요')}}
let pollT=null;
async function checkMe(){
  try{const d=await (await fetch(API+'/me?webUserId='+encodeURIComponent(webUserId))).json();
    if(!d.success){openModal(`<div style="font-size:40px">🙀</div><h3>게임을 열 수 없어요</h3><div style="color:var(--dim);font-size:12.5px">${escH(d.error||'')}</div>`);return}
    if(!d.linked){loginView(d.code,d.cmd,d.expired);clearTimeout(pollT);if(d.code)pollT=setTimeout(checkMe,3000);return}
    clearTimeout(pollT);closeModal();
    S=Object.assign(JSON.parse(JSON.stringify(DEF)),d.state||{});S.nick=d.nick||d.tag;S.tag=d.tag;
    for(const it of [...(S.inv||[]),...Object.values(S.eq||{})])if(it&&!it.key)it.key=ITEMS[it.s][0].k;
    ready=true;hero.hp=maxHp();applyLook();renderTab();
    const away=(Date.now()-(S.last||Date.now()))/1000;if(d.state&&away>60)offline(away);else save();
  }catch(_){toast('서버에 연결하지 못했어요');setTimeout(checkMe,5000)}
}
renderTab();if(webUserId)checkMe();else loginView();
setInterval(save,10000);
document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
// DJ가 !보석 으로 지급하면 바로 받아오기
try{const es=new EventSource(location.origin+'/events');es.onmessage=(e)=>{try{const m=JSON.parse(e.data);if(m.type==='idlerpg-grant'&&m.djId===DJ_ID&&String(m.tag).toLowerCase()===String(S.tag).toLowerCase())save()}catch(_){}}}catch(_){}
requestAnimationFrame(step);
</script>
