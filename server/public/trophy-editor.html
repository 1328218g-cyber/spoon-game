<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>박제 하기</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #8b5cf6;
    --primary-fg: #fff;
    --bg: #f5f5fa;
    --card: #fff;
    --border: #e8e8ee;
    --muted: #94949e;
    --accent: #ec4899;
    --destructive: #ef4444;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Noto Sans KR', sans-serif; background: var(--bg); color: #1a1a2e; overflow: hidden; height: 100vh; }
  button { cursor: pointer; font-family: inherit; border: none; background: none; }
  input, textarea { font-family: inherit; }

  .app { display: flex; height: 100vh; }
  .panel-left { width: 360px; flex-shrink: 0; border-right: 1px solid var(--border); background: var(--card); display: flex; flex-direction: column; overflow: hidden; }
  .panel-used { width: 144px; flex-shrink: 0; border-right: 1px solid var(--border); background: var(--card); display: flex; flex-direction: column; overflow: hidden; }
  .panel-center { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .panel-right { width: 280px; flex-shrink: 0; border-left: 1px solid var(--border); background: var(--card); overflow-y: auto; padding: 16px; }

  .tabs { display: flex; border-bottom: 1px solid var(--border); }
  .tab { flex: 1; padding: 10px; font-size: 12px; font-weight: 700; color: var(--muted); border-bottom: 2px solid transparent; transition: all .15s; }
  .tab.active { color: var(--primary); border-bottom-color: var(--primary); }
  .tab:hover { color: #333; }

  .scroll { flex: 1; overflow-y: auto; }
  .section-label { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 8px; }

  .cat-item { display: flex; align-items: center; justify-content: space-between; padding: 12px; border-bottom: 1px solid #f0f0f4; transition: background .15s; width: 100%; text-align: left; }
  .cat-item:hover { background: #f5f5fa; }
  .cat-item .name { font-size: 14px; font-weight: 500; }
  .cat-item .count { font-size: 12px; color: var(--muted); }

  .pb-sticker-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 12px; }
  .sticker-thumb { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; padding: 4px; border-radius: 8px; transition: background .15s; position: relative; }
  .sticker-thumb:hover { background: #f5f5fa; }
  .sticker-thumb img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .badge { position: absolute; bottom: 4px; right: 4px; font-size: 9px; font-weight: 700; padding: 2px 5px; border-radius: 3px; color: #fff; }
  .badge.gif { background: var(--primary); }
  .badge.anim { background: var(--accent); }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: 600; transition: all .15s; }
  .btn-primary { background: var(--primary); color: var(--primary-fg); }
  .btn-primary:hover { opacity: .9; }
  .btn-outline { border: 1px solid var(--border); background: transparent; }
  .btn-outline:hover { background: #f5f5fa; }
  .btn-accent { background: var(--accent); color: #fff; }
  .btn-sm { padding: 6px 10px; font-size: 12px; }
  .btn-icon { width: 36px; height: 36px; padding: 0; }

  .canvas-wrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: 16px; background: #eeeef5; overflow: hidden; }
  .canvas { position: relative; width: 100%; border-radius: 16px; overflow: hidden; box-shadow: 0 8px 30px rgba(0,0,0,.12); user-select: none; }
  .canvas.checker { background: repeating-conic-gradient(#d0d0d0 0% 25%, #fff 0% 50%) 50% / 20px 20px; }
  .sticker { position: absolute; cursor: grab; }
  .sticker.selected { outline: 2px solid var(--primary); outline-offset: 1px; }
  .sticker img { width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
  .sticker .del-btn { position: absolute; top: -10px; right: -10px; width: 20px; height: 20px; background: var(--destructive); color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; z-index: 20; }
  .sticker .resize-handle { position: absolute; bottom: -8px; right: -8px; width: 20px; height: 20px; background: var(--primary); border-radius: 50%; cursor: se-resize; z-index: 20; display: flex; align-items: center; justify-content: center; }
  .sticker .resize-handle svg { width: 8px; height: 8px; fill: #fff; }

  .empty-canvas { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: rgba(0,0,0,.2); pointer-events: none; }

  .toolbar-section { margin-bottom: 20px; }
  .toolbar-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
  .slider-row { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .slider-row label { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; min-width: 50px; }
  .slider-row .val { font-size: 11px; color: var(--muted); font-family: monospace; min-width: 35px; text-align: right; }
  input[type=range] { flex: 1; accent-color: var(--primary); }

  .color-swatches { display: flex; flex-wrap: wrap; gap: 8px; }
  .color-swatch { width: 28px; height: 28px; border-radius: 8px; border: 2px solid #ddd; cursor: pointer; transition: transform .1s; }
  .color-swatch:hover { transform: scale(1.1); }
  .color-swatch.active { border-color: #000; }

  .topbar { padding: 8px 16px; border-bottom: 1px solid var(--border); background: rgba(255,255,255,.8); backdrop-filter: blur(10px); display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  .topbar h1 { font-size: 14px; font-weight: 700; }
  .topbar .spacer { flex: 1; }
  .topbar .info { font-size: 12px; color: var(--muted); }

  .used-item { padding: 8px; border-bottom: 1px solid #f0f0f4; display: flex; justify-content: center; transition: background .15s; }
  .used-item:hover { background: #f5f5fa; }
  .used-item.active { background: rgba(139,92,246,.1); border-left: 2px solid var(--primary); }
  .used-item img { width: 80px; height: 80px; object-fit: contain; border-radius: 8px; background: #f5f5fa; }

  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.7); display: flex; align-items: center; justify-content: center; z-index: 9999; padding: 16px; }
  .modal { background: #fff; border-radius: 16px; max-width: 700px; width: 100%; max-height: 90vh; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
  .modal-header { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .modal-header h2 { font-size: 14px; font-weight: 700; }
  .modal-body { flex: 1; overflow: hidden; display: flex; }
  .modal-canvas-area { flex: 1; overflow: auto; padding: 16px; background: repeating-conic-gradient(#d0d0d0 0% 25%, #fff 0% 50%) 50% / 16px 16px; display: flex; align-items: center; justify-content: center; }
  .modal-canvas-area canvas { max-width: 100%; max-height: 100%; cursor: crosshair; }
  .modal-controls { width: 200px; flex-shrink: 0; border-left: 1px solid var(--border); padding: 16px; display: flex; flex-direction: column; gap: 16px; }

  .popup-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: flex; align-items: center; justify-content: center; z-index: 9999; }
  .popup { background: #fff; border-radius: 16px; padding: 24px; max-width: 360px; text-align: center; }
  .popup h3 { font-size: 16px; font-weight: 700; margin-bottom: 12px; }
  .popup p { font-size: 13px; color: var(--muted); margin-bottom: 20px; }
  .popup .btns { display: flex; flex-direction: column; gap: 8px; }
  .choice-opt { display: flex; align-items: center; gap: 12px; padding: 12px; border: 1px solid var(--border); border-radius: 10px; text-align: left; transition: background .15s, border-color .15s; }
  .choice-opt:hover { background: #f5f5fa; border-color: var(--primary); }
  .choice-opt .co-icon { width: 36px; height: 36px; border-radius: 8px; background: #f0f0f7; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
  .choice-opt .co-title { font-size: 13px; font-weight: 700; }
  .choice-opt .co-desc { font-size: 11px; color: var(--muted); }

  .anim-capture-modal { background: #fff; border-radius: 16px; max-width: 560px; width: 100%; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
  .anim-capture-header { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .anim-capture-header h2 { font-size: 14px; font-weight: 700; }
  .anim-capture-stage { padding: 20px; background: repeating-conic-gradient(#d0d0d0 0% 25%, #fff 0% 50%) 50% / 16px 16px; display: flex; align-items: center; justify-content: center; min-height: 260px; }
  .anim-capture-stage img, .anim-capture-stage canvas { max-width: 100%; max-height: 320px; }
  .anim-capture-controls { padding: 16px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 12px; }

  .loading-spin { width: 16px; height: 16px; border: 2px solid #ddd; border-top-color: var(--primary); border-radius: 50%; animation: spin .6s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .sep { height: 1px; background: var(--border); margin: 16px 0; }

  .top-nav { padding: 6px 16px; background: #1a1a2e; display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .top-nav a { color: #ddd; font-size: 12px; text-decoration: none; }
  .top-nav a:hover { color: #fff; }

  .mobile-only { display: none; }
  @media (max-width: 768px) {
    .desktop-only { display: none !important; }
    .mobile-only { display: flex !important; }
    .app { flex-direction: column; }
    .panel-left { width: 100%; height: 45vh; border-right: none; border-top: 1px solid var(--border); }
    .panel-used, .panel-right { display: none; }
    .panel-center { flex: 1; }

    /* 모바일에서 팝업/모달이 화면 밖으로 벗어나거나 좌우로 잘리던 문제 보정 */
    .popup-overlay, .modal-overlay { padding: 12px; }
    .popup { max-width: 100%; padding: 20px; }
    .anim-capture-modal { max-width: 100%; max-height: 90vh; overflow-y: auto; }
    .anim-capture-stage { padding: 12px; min-height: 200px; }
    #lottieStage { width: 100% !important; max-width: 240px; height: auto !important; aspect-ratio: 1; }
    .anim-capture-stage img { max-height: 220px; }

    /* 이미지 편집 모달(지우개/투명도)이 데스크톱용 좌우 배치라 모바일에서 캔버스가 너무 좁아지던
       문제 — 세로로 쌓이게 바꾸고, 캔버스 영역에 화면 높이 비중을 더 준다 */
    .modal { max-width: 100%; max-height: 92vh; }
    .modal-body { flex-direction: column; overflow-y: auto; }
    .modal-canvas-area { min-height: 45vh; padding: 8px; }
    .modal-controls { width: 100%; border-left: none; border-top: 1px solid var(--border); }
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
</head>
<body>
<div class="top-nav"><a href="javascript:history.back()">← 에디봇으로 돌아가기</a></div>
<div class="app" id="app">
  <div class="panel-left desktop-only">
    <div class="tabs">
      <button class="tab active" data-tab="sticker" onclick="switchTab('sticker')">스티커</button>
      <button class="tab" data-tab="image" onclick="switchTab('image')">내 이미지</button>
      <button class="tab" data-tab="text" onclick="switchTab('text')">텍스트</button>
    </div>
    <div id="tab-sticker" class="scroll"></div>
    <div id="tab-image" class="scroll" style="display:none; padding: 16px;">
      <button class="btn btn-accent" style="width:100%; margin-bottom:12px;" onclick="document.getElementById('localImgInput').click()">📁 내 이미지 추가</button>
      <input type="file" id="localImgInput" accept="image/*" multiple style="display:none" onchange="handleLocalUpload(event)">
      <p style="font-size:12px; color:var(--muted); text-align:center; margin-top:20px;">이미지를 선택하면 캔버스에 추가됩니다.</p>
    </div>
    <div id="tab-text" class="scroll" style="display:none; padding: 16px;">
      <div style="margin-bottom:16px;">
        <div class="section-label">텍스트 입력</div>
        <div style="display:flex; gap:8px;">
          <input type="text" id="textInput" placeholder="글자를 입력하세요..." style="flex:1; padding:8px; border:1px solid var(--border); border-radius:8px; font-size:14px;" onkeydown="if(event.key==='Enter')addText()">
          <button class="btn btn-primary btn-sm" onclick="addText()">T</button>
        </div>
      </div>
      <div style="margin-bottom:16px;">
        <div class="section-label">글자 색상</div>
        <div class="color-swatches" id="textColors"></div>
      </div>
      <div style="margin-bottom:16px;">
        <div class="section-label">글자 크기</div>
        <div style="display:flex; gap:6px; flex-wrap:wrap;" id="textSizes"></div>
      </div>
      <div style="margin-bottom:16px;">
        <button class="btn btn-outline btn-sm" id="boldBtn" onclick="toggleBold()">굵게 B</button>
      </div>
      <div style="margin-bottom:16px;">
        <div class="section-label">이모지</div>
        <div style="display:grid; grid-template-columns:repeat(6,1fr); gap:4px;" id="emojiGrid"></div>
      </div>
    </div>
  </div>

  <div class="panel-used desktop-only">
    <div style="padding:10px 12px; border-bottom:1px solid var(--border); font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase;">사용 중 (<span id="usedCount">0</span>)</div>
    <div class="scroll" id="usedList"></div>
  </div>

  <div class="panel-center">
    <div class="topbar">
      <h1>박제 하기</h1>
      <button class="btn btn-outline btn-sm" onclick="selectAll()" id="selectAllBtn" style="display:none;">전체 선택</button>
      <button class="btn btn-outline btn-sm" onclick="deleteAll()" id="deleteAllBtn" style="display:none; color:var(--destructive); border-color:var(--destructive);">전체 삭제</button>
      <div class="spacer"></div>
      <span class="info" id="statusInfo">스티커를 클릭해 선택하세요</span>
    </div>
    <div class="canvas-wrap">
      <div id="canvasContainer" style="width:100%; max-height:100%;">
        <div class="canvas checker" id="canvas" style="aspect-ratio:1;"></div>
      </div>
    </div>
  </div>

  <div class="panel-right desktop-only" id="rightToolbar"></div>
</div>

<div class="app mobile-only" style="display:none; flex-direction:column; height:100vh;">
  <div class="topbar">
    <h1>박제 하기</h1>
    <div class="spacer"></div>
    <button class="btn btn-primary btn-sm" onclick="downloadCanvas()">저장</button>
  </div>
  <div style="flex:1; display:flex; align-items:center; justify-content:center; padding:8px; background:#eeeef5; overflow:hidden; min-height:0;">
    <div id="mobileCanvasContainer" style="width:100%;">
      <div class="canvas checker" id="canvasMobile" style="aspect-ratio:1;"></div>
    </div>
  </div>
  <div style="height:45vh; border-top:1px solid var(--border); background:#fff; display:flex; flex-direction:column;">
    <div class="tabs">
      <button class="tab active" data-mtab="sticker" onclick="switchMobileTab('sticker')">스티커</button>
      <button class="tab" data-mtab="image" onclick="switchMobileTab('image')">내 이미지</button>
      <button class="tab" data-mtab="text" onclick="switchMobileTab('text')">텍스트</button>
      <button class="tab" data-mtab="edit" onclick="switchMobileTab('edit')">편집</button>
    </div>
    <div class="scroll" id="mobileTabContent"></div>
  </div>
</div>

<div id="editModal" style="display:none;"></div>
<div id="choicePopup" style="display:none;"></div>

<script>
// ════════════════════════════════════════════════
// STATE
// ════════════════════════════════════════════════
const STATE = {
  stickers: [],
  selectedId: null,
  multiSelectedIds: [],
  background: null,
  canvasRatio: 1,
  nextId: 1,
  categories: [],
  selectedCategory: null,
  currentTab: 'sticker',
  mobileTab: 'sticker',
  showGrid: false,
  gridSize: 10,
  textColor: '#ffffff',
  textSize: 48,
  textBold: false,
  editHistory: [],
  editEraserSize: 20,
  editOpacity: 100,
  editBaseData: null,
};

const DEFAULT_T = { flipX:false, flipY:false, rotation:0, size:20, brightness:100, contrast:100, saturate:100, borderColor:null, borderWidth:0 };

// ════════════════════════════════════════════════
// STICKER FETCH
// ════════════════════════════════════════════════
function encodeUrl(url) {
  if (!url) return url;
  try {
    return url.split("/").map((seg, i) => {
      if (i < 3) return seg;
      try { return encodeURIComponent(decodeURIComponent(seg)); }
      catch { return encodeURIComponent(seg); }
    }).join("/");
  } catch { return url; }
}

function proxyImg(url){
  return url ? '/trophy-editor/image-proxy?url=' + encodeURIComponent(url) : '';
}
async function fetchStickers() {
  try {
    // 🌐 [수정] 브라우저에서 스푼 CDN으로 직접 fetch하면 CORS로 막혀서 항상 실패했다.
    // 우리 서버의 프록시(/trophy-editor/stickers)를 거치도록 바꾼다.
    const res = await fetch("/trophy-editor/stickers");
    if (!res.ok) throw new Error("fetch failed");
    const data = await res.json();
    const result = [];
    for (const cat of data.categories) {
      // ⚠️ [수정] cat.is_used는 스푼 API에서 실제 노출 여부와 무관하게 거의 항상 false로 내려온다.
      // 이 값으로 카테고리 전체를 거르면 목록이 통째로 비어버린다 — 개별 스티커의 is_used만 본다.
      // 서버(/trophy-editor/stickers)에서 이미 판매기간/사용여부로 걸러서 내려주므로 여기선 그대로 사용
      const stickers = cat.stickers || [];
      if (stickers.length > 0) {
        result.push({
          id: cat.id, name: cat.name, title: cat.title,
          stickers: stickers.map(s => ({
            ...s,
            // 🌐 이미지 URL도 전부 우리 프록시를 거치게 감싼다 (CORS + urlToDataUrl 모두 해결).
            image_url_web: proxyImg(encodeUrl(s.image_url_web)),
            image_thumbnail: proxyImg(encodeUrl(s.image_thumbnail)),
            image_thumbnail_web: proxyImg(encodeUrl(s.image_thumbnail_web)),
          }))
        });
      }
    }
    STATE.categories = result;
    renderStickerPanel();
    renderMobileStickerPanel();
  } catch (e) {
    document.getElementById('tab-sticker').innerHTML = '<p style="padding:20px; text-align:center; color:var(--muted); font-size:13px;">스티커를 불러올 수 없습니다.<br>인터넷 연결을 확인하세요.</p>';
  }
}

// ════════════════════════════════════════════════
// IMAGE PROXY (client-side fetch → blob → dataURL)
// ════════════════════════════════════════════════
async function urlToDataUrl(url) {
  try {
    const res = await fetch(url, { mode: 'cors' });
    const blob = await res.blob();
    return await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(blob);
    });
  } catch (e) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        const ctx = canvas.getContext('2d');
        try {
          ctx.drawImage(img, 0, 0);
          resolve(canvas.toDataURL('image/png'));
        } catch (e) {
          reject(e);
        }
      };
      img.onerror = reject;
      img.src = url;
    });
  }
}

// ════════════════════════════════════════════════
// STICKER MANAGEMENT
// ════════════════════════════════════════════════
function addSticker(dataUrl, replaceId) {
  if (replaceId) {
    STATE.stickers = STATE.stickers.map(s => s.id === replaceId ? { ...s, dataUrl } : s);
    renderAll();
    return replaceId;
  }
  const id = STATE.nextId++;
  STATE.stickers.push({ id, dataUrl, x: 50, y: 50, ...DEFAULT_T });
  STATE.selectedId = id;
  STATE.multiSelectedIds = [];
  renderAll();
  return id;
}

function deleteSticker(id) {
  STATE.stickers = STATE.stickers.filter(s => s.id !== id);
  if (STATE.selectedId === id) STATE.selectedId = null;
  STATE.multiSelectedIds = STATE.multiSelectedIds.filter(x => x !== id);
  renderAll();
}

function deleteAll() {
  if (STATE.stickers.length === 0) return;
  if (!confirm('모든 스티커를 삭제하시겠습니까?')) return;
  STATE.stickers = [];
  STATE.selectedId = null;
  STATE.multiSelectedIds = [];
  renderAll();
}

function selectSticker(id) {
  STATE.selectedId = id;
  STATE.multiSelectedIds = [];
  renderAll();
}

function selectAll() {
  if (STATE.stickers.length === 0) return;
  STATE.selectedId = STATE.stickers[STATE.stickers.length - 1].id;
  STATE.multiSelectedIds = STATE.stickers.map(s => s.id);
  renderAll();
}

function toggleMultiSelect(id) {
  if (STATE.multiSelectedIds.includes(id)) {
    STATE.multiSelectedIds = STATE.multiSelectedIds.filter(x => x !== id);
  } else {
    STATE.multiSelectedIds.push(id);
  }
  if (!STATE.selectedId) STATE.selectedId = id;
  renderAll();
}

const allSelectedIds = () => STATE.selectedId
  ? [...new Set([STATE.selectedId, ...STATE.multiSelectedIds])]
  : STATE.multiSelectedIds;

function updateSticker(id, props) {
  STATE.stickers = STATE.stickers.map(s => s.id === id ? { ...s, ...props } : s);
  renderAll();
}

function renderStickerPanel() {
  const container = document.getElementById('tab-sticker');
  if (STATE.categories.length === 0) {
    container.innerHTML = '<div style="padding:20px; text-align:center;"><div class="loading-spin" style="margin:0 auto;"></div></div>';

  }

  let html = `

      <input type="file" id="stickerLocalInput" accept="image/*" multiple style="display:none" onchange="handleLocalUpload(event)">
    </div>
  `;

  if (STATE.selectedCategory) {
    const cat = STATE.categories.find(c => c.id === STATE.selectedCategory);
    html += `
      <div style="display:flex; align-items:center; justify-content:space-between; padding:10px 12px; border-bottom:1px solid var(--border); gap:8px;">
        <button class="btn btn-outline btn-sm" onclick="STATE.selectedCategory=null; renderStickerPanel(); renderMobileStickerPanel();">← ${cat?.title || cat?.name}</button>
        <button class="btn btn-primary btn-sm" onclick="autoLayoutCategory()">자동 박제판</button>
      </div>

        ${cat?.stickers.map((s, i) => {
          const imgUrl = s.image_thumbnail_web || s.image_thumbnail || s.image_url_web || '';
          const isLottie = !!s.lottie_url;
          const isGif = (s.image_url_web || '').toLowerCase().includes('.gif');
          return `<div class="sticker-thumb" onclick="onStickerClick(${i})">
            <img src="${imgUrl}" loading="lazy">
            ${isLottie ? '<span class="badge anim">ANIM</span>' : ''}
            ${isGif ? '<span class="badge gif">GIF</span>' : ''}
          </div>`;
        }).join('') || ''}
      </div>
    `;
  } else {
    html += `
      <div style="padding:10px 12px; border-bottom:1px solid var(--border);"><span class="section-label">카테고리</span></div>
      <div>
        ${STATE.categories.map(cat => `
          <button class="cat-item" onclick="STATE.selectedCategory=${cat.id}; renderStickerPanel(); renderMobileStickerPanel();">
            <span class="name">${cat.title || cat.name}</span>
            <span class="count">${cat.stickers.length}개</span>
          </button>
        `).join('')}
      </div>
    `;
  }
  container.innerHTML = html;
}

async function onStickerClick(idx) {
  const cat = STATE.categories.find(c => c.id === STATE.selectedCategory);
  if (!cat) return;
  const s = cat.stickers[idx];
  const imgUrl = s.image_thumbnail_web || s.image_thumbnail || s.image_url_web || '';
  const fullUrl = s.image_url_web || s.image_url || imgUrl;

  if (s.lottie_url) {
    showChoicePopup(s, 'lottie');
    return;
  }
  if (fullUrl.toLowerCase().includes('.gif')) {
    showChoicePopup(s, 'gif', fullUrl);
    return;
  }

  const tempId = addSticker(imgUrl);
  try {
    const dataUrl = await urlToDataUrl(fullUrl);
    addSticker(dataUrl, tempId);
  } catch (e) {
    console.warn('고화질 로드 실패, 썸네일 사용:', e);
  }
}

async function autoLayoutCategory() {
  const cat = STATE.categories.find(c => c.id === STATE.selectedCategory);
  if (!cat) return;
  const dataUrls = [];
  for (const s of cat.stickers) {
    const thumbUrl = s.image_thumbnail_web || s.image_thumbnail || s.image_url_web || '';
    const fullUrl = s.image_url_web || s.image_url || thumbUrl;
    const isLottie = !!s.lottie_url;
    const isGif = fullUrl.toLowerCase().includes('.gif');
    const useUrl = (isLottie || isGif) ? thumbUrl : fullUrl;
    if (!useUrl) continue;
    try {
      const dataUrl = await urlToDataUrl(useUrl);
      dataUrls.push(dataUrl);
    } catch (e) { /* skip */ }
  }
  handleAutoLayout(dataUrls);
}

function handleAutoLayout(dataUrls) {
  if (!dataUrls || dataUrls.length === 0) return;
  const cols = Math.ceil(Math.sqrt(dataUrls.length));
  const rows = Math.ceil(dataUrls.length / cols);
  const colStep = 80 / cols;
  const rowStep = 80 / rows;
  dataUrls.forEach((dataUrl, i) => {
    const col = i % cols;
    const row = Math.floor(i / cols);
    const x = 10 + col * colStep + colStep / 2;
    const y = 10 + row * rowStep + rowStep / 2;
    const size = Math.min(colStep, rowStep) * 0.85;
    const id = STATE.nextId++;
    STATE.stickers.push({ id, dataUrl, x, y, ...DEFAULT_T, size });
  });
  if (STATE.stickers.length > 0) STATE.selectedId = STATE.stickers[STATE.stickers.length - 1].id;
  renderAll();
}

// ════════════════════════════════════════════════
// LOCAL IMAGE UPLOAD
// ════════════════════════════════════════════════
function handleLocalUpload(e) {
  const files = Array.from(e.target.files);
  files.forEach(file => {
    const reader = new FileReader();
    reader.onload = ev => addSticker(ev.target.result);
    reader.readAsDataURL(file);
  });
  e.target.value = '';
}

function addText() {
  const text = document.getElementById('textInput').value.trim();
  if (!text) return;
  addTextSticker({ text, color: STATE.textColor, fontSize: STATE.textSize, bold: STATE.textBold });
  document.getElementById('textInput').value = '';
}

function addEmoji(emoji) {
  addTextSticker({ text: emoji, color: STATE.textColor, fontSize: STATE.textSize, bold: STATE.textBold });
}

function addTextSticker({ text, color, fontSize, bold }) {
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  const font = `${bold ? 'bold ' : ''}${fontSize * 2}px 'Noto Sans KR', sans-serif`;
  ctx.font = font;
  const measured = ctx.measureText(text);
  const w = Math.ceil(measured.width) + fontSize;
  const h = fontSize * 3;
  canvas.width = w;
  canvas.height = h;
  ctx.font = font;
  ctx.fillStyle = color;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, w / 2, h / 2);
  const dataUrl = canvas.toDataURL('image/png');
  const id = STATE.nextId++;
  STATE.stickers.push({ id, dataUrl, x: 50, y: 50, ...DEFAULT_T, size: 30 });
  STATE.selectedId = id;
  renderAll();
}

function toggleBold() { STATE.textBold = !STATE.textBold; initTextPanel(); }

function getCanvasEl() {
  const isMobile = window.innerWidth < 768;
  return isMobile ? document.getElementById('canvasMobile') : document.getElementById('canvas');

function getBgStyle() {
  const bg = STATE.background;
  if (!bg) return { class: 'canvas checker', style: '' };

    if (bg.color === 'transparent') return { class: 'canvas', style: 'background: repeating-conic-gradient(#d0d0d0 0% 25%, #fff 0% 50%) 50% / 20px 20px;' };
    return { class: 'canvas', style: `background: ${bg.color};` };
  }
  return { class: 'canvas', style: '' };
}

function renderCanvas() {
  const el = getCanvasEl();

  }

  if (STATE.stickers.length === 0) {
    html += `<div class="empty-canvas"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polygon points="12,2 2,7 12,12 22,7"/><polyline points="2,17 12,22 22,17"/><polyline points="2,12 12,17 22,12"/></svg><p style="font-size:14px; font-weight:500;">스티커를 선택해주세요</p></div>`;
  }

  STATE.stickers.forEach((s, index) => {
    const isSelected = s.id === STATE.selectedId;
    const filter = `brightness(${s.brightness}%) contrast(${s.contrast}%) saturate(${s.saturate}%)`;
    const borderShadow = s.borderColor
      ? `filter: drop-shadow(0 0 ${s.borderWidth||3}px ${s.borderColor}) drop-shadow(0 0 ${s.borderWidth||3}px ${s.borderColor}) drop-shadow(0 0 ${s.borderWidth||3}px ${s.borderColor});`
      : '';
    html += `
      <div class="sticker ${isSelected?'selected':''}" data-id="${s.id}"
        style="left:${s.x}%; top:${s.y}%; width:${s.size}%; transform:translate(-50%,-50%) rotate(${s.rotation}deg) scaleX(${s.flipX?-1:1}) scaleY(${s.flipY?-1:1}); filter:${filter}; z-index:${isSelected?9999:100+index};"
        onmousedown="onStickerMouseDown(event, ${s.id})" ontouchstart="onStickerTouchStart(event, ${s.id})">
        <img src="${s.dataUrl}" style="${borderShadow}">
        ${isSelected ? `
          <button class="del-btn" onmousedown="event.stopPropagation(); deleteSticker(${s.id})">✕</button>
          <div class="resize-handle" onmousedown="event.stopPropagation(); onResizeStart(event, ${s.id})" ontouchstart="event.stopPropagation(); onResizeTouchStart(event, ${s.id})">
            <svg viewBox="0 0 8 8"><path d="M2 6L6 2M4 6L6 4M6 6" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg>
          </div>
        ` : ''}
      </div>
    `;
  });

  el.innerHTML = html;
}

// ════════════════════════════════════════════════
// DRAG & RESIZE
// ════════════════════════════════════════════════
let dragState = null;
let resizeState = null;

function onStickerMouseDown(e, id) {
  e.preventDefault();
  e.stopPropagation();
  if (e.ctrlKey || e.metaKey) { toggleMultiSelect(id); return; }
  const isMulti = STATE.multiSelectedIds.length >= 2 && STATE.multiSelectedIds.includes(id);
  if (!(isMulti)) selectSticker(id);
  const s = STATE.stickers.find(x => x.id === id);
  if (isMulti) {
    const orig = {};
    STATE.stickers.forEach(x => { if (STATE.multiSelectedIds.includes(x.id)) orig[x.id] = { x: x.x, y: x.y }; });
    dragState = { multi: true, startX: e.clientX, startY: e.clientY, orig };
  } else {
    dragState = { multi: false, id, startX: e.clientX, startY: e.clientY, origX: s.x, origY: s.y };
  }
  window.addEventListener('mousemove', onDragMove);
  window.addEventListener('mouseup', onDragEnd);
}

function onStickerTouchStart(e, id) {
  e.stopPropagation();
  const isMulti = STATE.multiSelectedIds.length >= 2 && STATE.multiSelectedIds.includes(id);
  if (!isMulti) selectSticker(id);
  const t = e.touches[0];
  const s = STATE.stickers.find(x => x.id === id);
  if (isMulti) {
    const orig = {};
    STATE.stickers.forEach(x => { if (STATE.multiSelectedIds.includes(x.id)) orig[x.id] = { x: x.x, y: x.y }; });
    dragState = { multi: true, startX: t.clientX, startY: t.clientY, orig };
  } else {
    dragState = { multi: false, id, startX: t.clientX, startY: t.clientY, origX: s.x, origY: s.y };
  }
  window.addEventListener('touchmove', onDragTouchMove, { passive: true });
  window.addEventListener('touchend', onDragEnd);
}

function onDragMove(e) {
  if (!dragState) return;
  const rect = getCanvasEl().getBoundingClientRect();
  const dx = (e.clientX - dragState.startX) / rect.width * 100;
  const dy = (e.clientY - dragState.startY) / rect.height * 100;
  if (dragState.multi) {
    STATE.stickers = STATE.stickers.map(s => {
      if (!dragState.orig[s.id]) return s;
      return { ...s, x: Math.max(0, Math.min(100, dragState.orig[s.id].x + dx)), y: Math.max(0, Math.min(100, dragState.orig[s.id].y + dy)) };
    });
  } else {
    STATE.stickers = STATE.stickers.map(s => s.id === dragState.id ? { ...s, x: Math.max(0, Math.min(100, dragState.origX + dx)), y: Math.max(0, Math.min(100, dragState.origY + dy)) } : s);
  }
  renderCanvas();
  renderUsedList();
}

function onDragTouchMove(e) {
  if (!dragState) return;
  const t = e.touches[0];
  const rect = getCanvasEl().getBoundingClientRect();
  const dx = (t.clientX - dragState.startX) / rect.width * 100;
  const dy = (t.clientY - dragState.startY) / rect.height * 100;
  if (dragState.multi) {
    STATE.stickers = STATE.stickers.map(s => {
      if (!dragState.orig[s.id]) return s;
      return { ...s, x: Math.max(0, Math.min(100, dragState.orig[s.id].x + dx)), y: Math.max(0, Math.min(100, dragState.orig[s.id].y + dy)) };
    });
  } else {
    STATE.stickers = STATE.stickers.map(s => s.id === dragState.id ? { ...s, x: Math.max(0, Math.min(100, dragState.origX + dx)), y: Math.max(0, Math.min(100, dragState.origY + dy)) } : s);
  }
  renderCanvas();
  renderUsedList();
}

function onDragEnd() {
  dragState = null;
  window.removeEventListener('mousemove', onDragMove);
  window.removeEventListener('mouseup', onDragEnd);
  window.removeEventListener('touchmove', onDragTouchMove);
  window.removeEventListener('touchend', onDragEnd);
}

function onResizeStart(e, id) {
  const s = STATE.stickers.find(x => x.id === id);
  resizeState = { id, startX: e.clientX, startY: e.clientY, origSize: s.size };
  window.addEventListener('mousemove', onResizeMove);
  window.addEventListener('mouseup', onResizeEnd);
}

function onResizeTouchStart(e, id) {
  const t = e.touches[0];
  const s = STATE.stickers.find(x => x.id === id);
  resizeState = { id, startX: t.clientX, startY: t.clientY, origSize: s.size };
  window.addEventListener('touchmove', onResizeTouchMove, { passive: true });
  window.addEventListener('touchend', onResizeEnd);
}

function onResizeMove(e) {
  if (!resizeState) return;
  const rect = getCanvasEl().getBoundingClientRect();
  const dx = (e.clientX - resizeState.startX) / rect.width * 100;
  const dy = (e.clientY - resizeState.startY) / rect.height * 100;
  const delta = Math.abs(dx) > Math.abs(dy) ? dx : dy;
  const newSize = Math.max(5, Math.min(100, resizeState.origSize + delta));
  updateSticker(resizeState.id, { size: newSize });
}

function onResizeTouchMove(e) {
  if (!resizeState) return;
  const t = e.touches[0];
  const rect = getCanvasEl().getBoundingClientRect();
  const dx = (t.clientX - resizeState.startX) / rect.width * 100;
  const dy = (t.clientY - resizeState.startY) / rect.height * 100;
  const delta = Math.abs(dx) > Math.abs(dy) ? dx : dy;
  const newSize = Math.max(5, Math.min(100, resizeState.origSize + delta));
  updateSticker(resizeState.id, { size: newSize });
}

function onResizeEnd() {
  resizeState = null;
  window.removeEventListener('mousemove', onResizeMove);
  window.removeEventListener('mouseup', onResizeEnd);
  window.removeEventListener('touchmove', onResizeTouchMove);
  window.removeEventListener('touchend', onResizeEnd);
}

        ${s.borderColor ? `<div class="slider-row"><label>두께</label><input type="range" min="1" max="8" step="1" value="${s.borderWidth||3}" onchange="updateSticker(${s.id},{borderWidth:+this.value})"><span class="val">${s.borderWidth||3}px</span></div>` : ''}

      <button class="btn btn-outline btn-sm" style="width:100%; margin-bottom:8px;" onclick="openEditModal(${s.id})">🧽 이미지 편집 (지우개/투명도)</button>
      <button class="btn btn-outline btn-sm" style="width:100%; margin-bottom:8px;" onclick="resetSticker(${s.id})">↺ 초기화</button>

  }

  html += `

    ${renderAlignToolbar()}
    <div class="sep"></div>
    <button class="btn btn-primary" style="width:100%;" onclick="downloadCanvas()">💾 다운로드</button>
  `;

  el.innerHTML = html;
}

// ════════════════════════════════════════════════
// ALIGN
// ════════════════════════════════════════════════
function alignStickers(type, options = {}) {
  const ids = allSelectedIds();
  if (ids.length < 2) return;
  const targets = STATE.stickers.filter(s => ids.includes(s.id));

  if (type === 'left') {
    const minX = Math.min(...targets.map(s => s.x));
    STATE.stickers = STATE.stickers.map(s => ids.includes(s.id) ? { ...s, x: minX } : s);
  } else if (type === 'right') {
    const maxX = Math.max(...targets.map(s => s.x));
    STATE.stickers = STATE.stickers.map(s => ids.includes(s.id) ? { ...s, x: maxX } : s);
  } else if (type === 'centerH') {
    const avgX = targets.reduce((sum, s) => sum + s.x, 0) / targets.length;
    STATE.stickers = STATE.stickers.map(s => ids.includes(s.id) ? { ...s, x: avgX } : s);
  } else if (type === 'top') {
    const minY = Math.min(...targets.map(s => s.y));
    STATE.stickers = STATE.stickers.map(s => ids.includes(s.id) ? { ...s, y: minY } : s);
  } else if (type === 'bottom') {
    const maxY = Math.max(...targets.map(s => s.y));
    STATE.stickers = STATE.stickers.map(s => ids.includes(s.id) ? { ...s, y: maxY } : s);
  } else if (type === 'centerV') {
    const avgY = targets.reduce((sum, s) => sum + s.y, 0) / targets.length;
    STATE.stickers = STATE.stickers.map(s => ids.includes(s.id) ? { ...s, y: avgY } : s);
  } else if (type === 'distributeH') {
    const sorted = [...targets].sort((a, b) => a.x - b.x);
    const minX = sorted[0].x, maxX = sorted[sorted.length - 1].x;
    const step = (maxX - minX) / (sorted.length - 1);
    const posMap = {};
    sorted.forEach((s, i) => posMap[s.id] = minX + step * i);
    STATE.stickers = STATE.stickers.map(s => ids.includes(s.id) ? { ...s, x: posMap[s.id] } : s);
  } else if (type === 'distributeV') {
    const sorted = [...targets].sort((a, b) => a.y - b.y);
    const minY = sorted[0].y, maxY = sorted[sorted.length - 1].y;
    const step = (maxY - minY) / (sorted.length - 1);
    const posMap = {};
    sorted.forEach((s, i) => posMap[s.id] = minY + step * i);
    STATE.stickers = STATE.stickers.map(s => ids.includes(s.id) ? { ...s, y: posMap[s.id] } : s);
  } else if (type === 'gridH') {
    const sorted = [...targets].sort((a, b) => a.y - b.y || a.x - b.x);
    const cols = options.cols || Math.ceil(Math.sqrt(sorted.length));
    const rows = Math.ceil(sorted.length / cols);
    const colW = 80 / cols, rowH = 80 / rows;
    const posMap = {};
    sorted.forEach((s, i) => { posMap[s.id] = { x: 10 + (i % cols) * colW, y: 10 + Math.floor(i / cols) * rowH }; });
    STATE.stickers = STATE.stickers.map(s => ids.includes(s.id) ? { ...s, ...posMap[s.id] } : s);
  } else if (type === 'gridV') {
    const sorted = [...targets].sort((a, b) => a.x - b.x || a.y - b.y);
    const rows = options.rows || Math.ceil(Math.sqrt(sorted.length));
    const cols = Math.ceil(sorted.length / rows);
    const colW = 80 / cols, rowH = 80 / rows;
    const posMap = {};
    sorted.forEach((s, i) => { posMap[s.id] = { x: 10 + Math.floor(i / rows) * colW, y: 10 + (i % rows) * rowH }; });
    STATE.stickers = STATE.stickers.map(s => ids.includes(s.id) ? { ...s, ...posMap[s.id] } : s);
  }
  renderAll();
}

// ════════════════════════════════════════════════
// BACKGROUND
// ════════════════════════════════════════════════
function setBackground(bg) {
  STATE.background = bg;
  if (bg?.type === 'image' && bg.width && bg.height) STATE.canvasRatio = bg.width / bg.height;
  renderAll();
}

function onBgUpload(e) {
  const file = e.target.files?.[0];
  if (!file) return;
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = () => setBackground({ type: 'image', url, width: img.naturalWidth, height: img.naturalHeight });
  img.src = url;
  e.target.value = '';
}

function clearBackground() {
  STATE.background = null;
  STATE.canvasRatio = 1;
  renderAll();
}

function resetSticker(id) {
  STATE.stickers = STATE.stickers.map(s => s.id === id ? { ...s, ...DEFAULT_T } : s);
  renderAll();
}

// ════════════════════════════════════════════════
// DOWNLOAD
// ════════════════════════════════════════════════
async function downloadCanvas() {
  const OUTPUT_SIZE = 1200;
  const canvasEl = document.createElement('canvas');
  canvasEl.width = OUTPUT_SIZE;
  canvasEl.height = Math.round(OUTPUT_SIZE / STATE.canvasRatio);
  const ctx = canvasEl.getContext('2d');

  if (!STATE.background || STATE.background.color === 'transparent') {
    ctx.clearRect(0, 0, canvasEl.width, canvasEl.height);
  } else if (STATE.background?.type === 'color') {
    ctx.fillStyle = STATE.background.color;
    ctx.fillRect(0, 0, canvasEl.width, canvasEl.height);
  } else if (STATE.background?.type === 'image' && STATE.background.url) {
    await new Promise(resolve => {
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = () => { ctx.drawImage(img, 0, 0, canvasEl.width, canvasEl.height); resolve(); };
      img.onerror = resolve;
      img.src = STATE.background.url;
    });
  }

  for (const s of STATE.stickers) {
    await new Promise(resolve => {
      const img = new Image();
      img.onload = () => {
        const stickerW = (s.size / 100) * canvasEl.width;
        const imgAspect = img.naturalWidth / img.naturalHeight;
        const stickerH = stickerW / imgAspect;
        const cx = (s.x / 100) * canvasEl.width;
        const cy = (s.y / 100) * canvasEl.height;

        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate((s.rotation * Math.PI) / 180);
        ctx.scale(s.flipX ? -1 : 1, s.flipY ? -1 : 1);
        ctx.filter = `brightness(${s.brightness}%) contrast(${s.contrast}%) saturate(${s.saturate}%)`;

        if (s.borderColor) {
          ctx.shadowColor = s.borderColor;
          ctx.shadowBlur = (s.borderWidth || 3) * 4;
        }

        ctx.drawImage(img, -stickerW / 2, -stickerH / 2, stickerW, stickerH);
        ctx.restore();
        resolve();
      };
      img.onerror = resolve;
      img.src = s.dataUrl;
    });
  }

  canvasEl.toBlob(blob => {
    if (!blob) return;
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'sticker_collage.png';
    a.click();
    URL.revokeObjectURL(url);
  }, 'image/png');
}

let editCanvasRef = null;

function openEditModal(stickerId) {
  const s = STATE.stickers.find(x => x.id === stickerId);
  if (!s) return;
  STATE.editStickerId = stickerId;
  STATE.editHistory = [];
  STATE.editEraserSize = 20;
  STATE.editOpacity = 100;
  STATE.editBaseData = null;

  const overlay = document.getElementById('editModal');
  overlay.style.display = 'flex';
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal">
      <div class="modal-header">

        <button onclick="closeEditModal()" style="font-size:18px; color:var(--muted);">✕</button>
      </div>
      <div class="modal-body">
        <div class="modal-canvas-area">
          <canvas id="editCanvas" style="image-rendering:pixelated;"></canvas>
        </div>
        <div class="modal-controls">
          <div>
            <div style="display:flex; justify-content:space-between; margin-bottom:6px;">
              <span class="section-label">🧽 지우개 크기</span>
              <span style="font-size:11px; color:var(--muted); font-family:monospace;" id="eraserVal">${STATE.editEraserSize}px</span>
            </div>
            <input type="range" min="5" max="80" step="1" value="${STATE.editEraserSize}" oninput="STATE.editEraserSize=+this.value; document.getElementById('eraserVal').textContent=this.value+'px'">
          </div>
          <div>
            <div style="display:flex; justify-content:space-between; margin-bottom:6px;">
              <span class="section-label">투명도</span>
              <span style="font-size:11px; color:var(--muted); font-family:monospace;" id="opacityVal">${STATE.editOpacity}%</span>
            </div>
            <input type="range" min="0" max="100" step="1" value="${STATE.editOpacity}" oninput="STATE.editOpacity=+this.value; document.getElementById('opacityVal').textContent=this.value+'%'; applyOpacity()">
          </div>
          <div style="margin-top:auto; display:flex; flex-direction:column; gap:8px;">
            <button class="btn btn-outline btn-sm" onclick="editUndo()">↺ 되돌리기</button>
            <button class="btn btn-primary btn-sm" onclick="saveEdit()">✓ 적용</button>
          </div>
        </div>
      </div>
    </div>
  `;

  makeDraggable(overlay.querySelector('.modal'), overlay.querySelector('.modal-header'));
  const canvas = document.getElementById('editCanvas');
  editCanvasRef = canvas;
  const ctx = canvas.getContext('2d');
  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.onload = () => {
    canvas.width = img.naturalWidth;
    canvas.height = img.naturalHeight;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(img, 0, 0);
    const snap = ctx.getImageData(0, 0, canvas.width, canvas.height);
    STATE.editBaseData = snap;
    STATE.editHistory = [snap];
  };
  img.src = s.dataUrl;

  canvas.onmousedown = editMouseDown;
  canvas.onmousemove = editMouseMove;
  canvas.onmouseup = editMouseUp;
  canvas.onmouseleave = editMouseUp;
  canvas.ontouchstart = e => { e.preventDefault(); editMouseDown(e); };
  canvas.ontouchmove = e => { e.preventDefault(); editMouseMove(e); };
  canvas.ontouchend = editMouseUp;
}

let editDrawing = false;

function editGetPos(e) {
  const canvas = editCanvasRef;
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  let cx, cy;
  if (e.touches) { cx = e.touches[0].clientX; cy = e.touches[0].clientY; }
  else { cx = e.clientX; cy = e.clientY; }
  return { x: (cx - rect.left) * scaleX, y: (cy - rect.top) * scaleY, scaleX, scaleY };
}

function editSaveSnapshot() {
  const ctx = editCanvasRef.getContext('2d');
  const snap = ctx.getImageData(0, 0, editCanvasRef.width, editCanvasRef.height);
  STATE.editHistory = [...STATE.editHistory.slice(-10), snap];
  STATE.editBaseData = snap;
}

function editErase(e) {
  const ctx = editCanvasRef.getContext('2d');
  const { x, y, scaleX } = editGetPos(e);
  ctx.save();
  ctx.globalCompositeOperation = 'destination-out';
  ctx.beginPath();
  ctx.arc(x, y, STATE.editEraserSize * scaleX, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function editMouseDown(e) {
  editDrawing = true;
  editSaveSnapshot();
  editErase(e);
}

function editMouseMove(e) {
  if (!editDrawing) return;
  editErase(e);
}

function editMouseUp() { editDrawing = false; }

function applyOpacity() {
  if (!editCanvasRef || STATE.editHistory.length === 0 || !STATE.editBaseData) return;
  const ctx = editCanvasRef.getContext('2d');
  const latest = STATE.editHistory[STATE.editHistory.length - 1];
  const base = STATE.editBaseData;
  const imgData = new ImageData(new Uint8ClampedArray(latest.data), latest.width, latest.height);
  for (let i = 3; i < imgData.data.length; i += 4) {
    const baseAlpha = base.data[i];
    const erasedAlpha = latest.data[i];
    imgData.data[i] = erasedAlpha === 0 ? 0 : Math.round(baseAlpha * (STATE.editOpacity / 100));
  }
  ctx.putImageData(imgData, 0, 0);
}

function editUndo() {
  if (STATE.editHistory.length < 2) return;
  const ctx = editCanvasRef.getContext('2d');
  const prev = STATE.editHistory[STATE.editHistory.length - 2];
  ctx.putImageData(prev, 0, 0);
  STATE.editHistory = STATE.editHistory.slice(0, -1);
}

function saveEdit() {
  const dataUrl = editCanvasRef.toDataURL('image/png');
  updateSticker(STATE.editStickerId, { dataUrl });
  closeEditModal();
}

function closeEditModal() {
  document.getElementById('editModal').style.display = 'none';
  document.getElementById('editModal').innerHTML = '';
  editCanvasRef = null;
}

// ════════════════════════════════════════════════
// ANIMATION FRAME CAPTURE (GIF / Lottie)
// 재생 중인 애니메이션을 실제로 보여주고, 사용자가 원하는 순간에 "이 상황으로 사용하기"를
// 누르면 그 순간의 화면을 캔버스로 캡처해서 정지 스티커로 추가한다.
// ════════════════════════════════════════════════
let animCaptureLottie = null;
function openAnimCaptureModal() {
  const sticker = STATE.choiceSticker;
  const type = STATE.choiceType;
  const overlay = document.getElementById('choicePopup');
  overlay.style.display = 'flex';
  overlay.className = 'popup-overlay';

  if (type === 'lottie') {
    overlay.innerHTML = `
      <div class="anim-capture-modal">
        <div class="anim-capture-header"><h2>원하는 순간을 캡처하세요</h2><button onclick="closeAnimCaptureModal()" style="font-size:18px;color:var(--muted);">✕</button></div>
        <div class="anim-capture-stage"><div id="lottieStage" style="width:280px;height:280px;"></div></div>
        <div class="anim-capture-controls">
          <div class="slider-row"><label>속도</label><input type="range" id="animSpeed" min="0.5" max="2" step="0.1" value="1" oninput="onAnimSpeedChange(this.value)"><span class="val" id="animSpeedVal">1.0x</span></div>
          <p style="font-size:12px; color:var(--muted); text-align:center;">애니메이션이 재생 중입니다. 원하는 순간에 아래 버튼을 누르세요.</p>
          <button class="btn btn-primary" style="width:100%;" onclick="captureLottieFrame()">📷 이 순간으로 사용하기</button>
        </div>
      </div>
    `;
    const lottieUrl = sticker.lottie_url ? proxyImg(sticker.lottie_url) : '';
    animCaptureLottie = lottie.loadAnimation({
      container: document.getElementById('lottieStage'),
      renderer: 'canvas',
      loop: true,
      autoplay: true,
      path: lottieUrl
    });
  } else {
    // GIF — 브라우저가 재생 중인 <img>를 그 순간 그대로 캔버스에 그릴 수 있어서, 재생 화면을
    // 그대로 보여주고 캡처 버튼을 누르는 순간의 프레임을 그대로 캡처한다.
    const fullUrl = STATE.choiceFullUrl || sticker.image_url_web || '';
    overlay.innerHTML = `
      <div class="anim-capture-modal">
        <div class="anim-capture-header"><h2>원하는 순간을 캡처하세요</h2><button onclick="closeAnimCaptureModal()" style="font-size:18px;color:var(--muted);">✕</button></div>
        <div class="anim-capture-stage"><img id="gifStage" src="${fullUrl}" crossorigin="anonymous"></div>
        <div class="anim-capture-controls">
          <p style="font-size:12px; color:var(--muted); text-align:center;">GIF가 재생 중입니다. 원하는 순간에 아래 버튼을 누르세요.</p>
          <button class="btn btn-primary" style="width:100%;" onclick="captureGifFrame()">📷 이 순간으로 사용하기</button>
        </div>
      </div>
    `;
  }
  makeDraggable(overlay.querySelector('.anim-capture-modal'), overlay.querySelector('.anim-capture-header'));
}

function onAnimSpeedChange(v) {
  document.getElementById('animSpeedVal').textContent = Number(v).toFixed(1) + 'x';
  if (animCaptureLottie) animCaptureLottie.setSpeed(Number(v));
}

function captureLottieFrame() {
  const stage = document.getElementById('lottieStage');
  const srcCanvas = stage && stage.querySelector('canvas');
  if (!srcCanvas) { closeAnimCaptureModal(); return; }
  const canvas = document.createElement('canvas');
  canvas.width = srcCanvas.width;
  canvas.height = srcCanvas.height;
  canvas.getContext('2d').drawImage(srcCanvas, 0, 0);
  addSticker(canvas.toDataURL('image/png'));
  closeAnimCaptureModal();
}

function captureGifFrame() {
  const img = document.getElementById('gifStage');
  if (!img) { closeAnimCaptureModal(); return; }
  const canvas = document.createElement('canvas');
  canvas.width = img.naturalWidth || img.width;
  canvas.height = img.naturalHeight || img.height;
  try {
    canvas.getContext('2d').drawImage(img, 0, 0);
    addSticker(canvas.toDataURL('image/png'));
  } catch (e) {
    // 캡처 실패 시(브라우저 제약) 정지 썸네일로 대체
    addStaticStickerFallback();
  }
  closeAnimCaptureModal();
}

function addStaticStickerFallback() {
  const sticker = STATE.choiceSticker;
  const imgUrl = sticker && (sticker.image_thumbnail_web || sticker.image_thumbnail || sticker.image_url_web) || '';
  if (imgUrl) addSticker(imgUrl);
}

function closeAnimCaptureModal() {
  if (animCaptureLottie) { animCaptureLottie.destroy(); animCaptureLottie = null; }
  document.getElementById('choicePopup').style.display = 'none';
  document.getElementById('choicePopup').innerHTML = '';
}

// 🖱️ 팝업/모달을 원하는 위치로 직접 드래그해서 옮길 수 있게 해주는 공용 유틸.
// handleEl(보통 제목 영역)을 눌러서 끌면 modalEl 전체가 그 위치로 따라간다.
function makeDraggable(modalEl, handleEl) {
  if (!modalEl || !handleEl) return;
  handleEl.style.cursor = 'move';
  let dragging = false, startX = 0, startY = 0, origX = 0, origY = 0;
  handleEl.onmousedown = e => {
    if (e.target.closest('button')) return; // 닫기 버튼 클릭은 드래그로 안 잡음
    dragging = true;
    const rect = modalEl.getBoundingClientRect();
    modalEl.style.position = 'fixed';
    modalEl.style.left = rect.left + 'px';
    modalEl.style.top = rect.top + 'px';
    modalEl.style.margin = '0';
    origX = rect.left; origY = rect.top;
    startX = e.clientX; startY = e.clientY;
    e.preventDefault();
  };
  window.addEventListener('mousemove', e => {
    if (!dragging) return;
    modalEl.style.left = (origX + e.clientX - startX) + 'px';
    modalEl.style.top = (origY + e.clientY - startY) + 'px';
  });
  window.addEventListener('mouseup', () => { dragging = false; });
}

// TABS

function switchTab(tab) {
  STATE.currentTab = tab;
  document.querySelectorAll('.panel-left .tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  ['sticker','image','text'].forEach(t => {
    document.getElementById('tab-' + t).style.display = t === tab ? 'block' : 'none';
  });
}

function switchMobileTab(tab) {
  STATE.mobileTab = tab;
  document.querySelectorAll('[data-mtab]').forEach(t => t.classList.toggle('active', t.dataset.mtab === tab));
  renderMobileTabContent();
}

function renderMobileTabContent() {
  const el = document.getElementById('mobileTabContent');
  const tab = STATE.mobileTab;
  if (tab === 'sticker') {
    el.innerHTML = '<div id="mobileStickerPanel"></div>';
    renderMobileStickerPanel();
  } else if (tab === 'image') {
    el.innerHTML = `
      <div style="padding:16px;">
        <button class="btn btn-accent" style="width:100%; margin-bottom:12px;" onclick="document.getElementById('mobileLocalInput').click()">📁 내 이미지 추가</button>
        <input type="file" id="mobileLocalInput" accept="image/*" multiple style="display:none" onchange="handleLocalUpload(event)">
      </div>
    `;
  } else if (tab === 'text') {
    el.innerHTML = `
      <div style="padding:16px;">
        <div style="margin-bottom:16px;">
          <div class="section-label">텍스트 입력</div>
          <div style="display:flex; gap:8px;">
            <input type="text" id="mobileTextInput" placeholder="글자를 입력하세요..." style="flex:1; padding:8px; border:1px solid var(--border); border-radius:8px; font-size:14px;" onkeydown="if(event.key==='Enter'){addTextFromInput('mobileTextInput')}">

          </div>
        </div>
        <div style="margin-bottom:16px;">
          <div class="section-label">글자 색상</div>
          <div class="color-swatches" id="mobileTextColors"></div>
        </div>
        <div style="margin-bottom:16px;">
          <div class="section-label">글자 크기</div>
          <div style="display:flex; gap:6px; flex-wrap:wrap;" id="mobileTextSizes"></div>
        </div>
        <div style="margin-bottom:16px;">
          <button class="btn ${STATE.textBold?'btn-primary':'btn-outline'} btn-sm" id="mobileBoldBtn" onclick="toggleBold(); renderMobileTabContent();" style="font-weight:bold;">굵게 B</button>
        </div>
        <div>
          <div class="section-label">이모지</div>
          <div style="display:grid; grid-template-columns:repeat(6,1fr); gap:4px;" id="mobileEmojiGrid"></div>
        </div>
      </div>
    `;
    document.getElementById('mobileTextColors').innerHTML = TEXT_COLORS.map(c =>
      `<div class="color-swatch ${STATE.textColor===c?'active':''}" style="background:${c}" onclick="STATE.textColor='${c}'; renderMobileTabContent();"></div>`
    ).join('') + `<input type="color" value="${STATE.textColor}" onchange="STATE.textColor=this.value; renderMobileTabContent();" style="width:28px;height:28px;border-radius:8px;cursor:pointer;border:1px solid var(--border);">`;
    document.getElementById('mobileTextSizes').innerHTML = TEXT_SIZES.map(s =>
      `<button class="btn ${STATE.textSize===s?'btn-primary':'btn-outline'} btn-sm" onclick="STATE.textSize=${s}; renderMobileTabContent();">${s}</button>`
    ).join('');
    document.getElementById('mobileEmojiGrid').innerHTML = EMOJIS.map(e =>
      `<button style="font-size:20px; padding:6px; border-radius:8px;" onmouseover="this.style.background='#f5f5fa'" onmouseout="this.style.background=''" onclick="addEmoji('${e}')">${e}</button>`
    ).join('');
  } else if (tab === 'edit') {
    el.innerHTML = '<div id="mobileEditPanel" style="padding:16px;"></div>';
    renderMobileEditPanel();

}

function addTextFromInput(inputId) {
  const input = document.getElementById(inputId);
  const text = input.value.trim();
  if (!text) return;
  addTextSticker({ text, color: STATE.textColor, fontSize: STATE.textSize, bold: STATE.textBold });
  input.value = '';
}

function renderMobileStickerPanel() {
  const container = document.getElementById('mobileStickerPanel');
  if (!container) return;
  if (STATE.categories.length === 0) {
    container.innerHTML = '<div style="padding:20px; text-align:center;"><div class="loading-spin" style="margin:0 auto;"></div></div>';
    return;
  }
  let html = `
    <div style="padding:8px 12px; border-bottom:1px solid var(--border);">
      <button class="btn btn-accent" style="width:100%;" onclick="document.getElementById('mStickerLocal').click()">📁 내 이미지 추가</button>
      <input type="file" id="mStickerLocal" accept="image/*" multiple style="display:none" onchange="handleLocalUpload(event)">
    </div>
  `;
  if (STATE.selectedCategory) {
    const cat = STATE.categories.find(c => c.id === STATE.selectedCategory);
    html += `
      <div style="display:flex; align-items:center; justify-content:space-between; padding:10px 12px; border-bottom:1px solid var(--border); gap:8px;">
        <button class="btn btn-outline btn-sm" onclick="STATE.selectedCategory=null; renderStickerPanel(); renderMobileStickerPanel();">← ${cat?.title||cat?.name}</button>
        <button class="btn btn-primary btn-sm" onclick="autoLayoutCategory()">자동 박제판</button>
      </div>
      <div class="pb-sticker-grid">
        ${cat?.stickers.map((s, i) => {
          const imgUrl = s.image_thumbnail_web || s.image_thumbnail || s.image_url_web || '';
          const isLottie = !!s.lottie_url;
          const isGif = (s.image_url_web || '').toLowerCase().includes('.gif');
          return `<div class="sticker-thumb" onclick="onStickerClick(${i})"><img src="${imgUrl}" loading="lazy">${isLottie?'<span class="badge anim">ANIM</span>':''}${isGif?'<span class="badge gif">GIF</span>':''}</div>`;
        }).join('') || ''}
      </div>
    `;
  } else {
    html += `
      <div style="padding:10px 12px; border-bottom:1px solid var(--border);"><span class="section-label">카테고리</span></div>
      ${STATE.categories.map(cat => `<button class="cat-item" onclick="STATE.selectedCategory=${cat.id}; renderStickerPanel(); renderMobileStickerPanel();"><span class="name">${cat.title||cat.name}</span><span class="count">${cat.stickers.length}개</span></button>`).join('')}
    `;
  }
  container.innerHTML = html;
}

function renderMobileEditPanel() {
  const el = document.getElementById('mobileEditPanel');
  if (!el) return;
  const s = STATE.stickers.find(x => x.id === STATE.selectedId);

  let html = `
    <div class="toolbar-section">
      <div class="section-label">배경</div>
      <div class="color-swatches" style="margin-bottom:8px;">
        ${['transparent','#ffffff','#000000','#f8f0ff','#fff0f6','#f0f4ff','#f0fff4','#fffbf0','#ffeaea'].map(c =>
          `<div class="color-swatch ${STATE.background?.type==='color'&&STATE.background?.color===c?'active':''}" style="background:${c==='transparent'?'repeating-conic-gradient(#ccc 0% 25%, #fff 0% 50%) 0 0 / 10px 10px':c}" onclick="setBackground({type:'color',color:'${c}'})"></div>`
        ).join('')}
      </div>
      <button class="btn btn-outline btn-sm" style="width:100%; margin-bottom:4px;" onclick="document.getElementById('mBgInput').click()">🖼️ 배경 이미지</button>
      <input type="file" id="mBgInput" accept="image/*" style="display:none" onchange="onBgUpload(event)">
      ${STATE.background ? '<button class="btn btn-outline btn-sm" style="width:100%;" onclick="clearBackground()">✕ 배경 제거</button>' : ''}
    </div>
    <div class="sep"></div>
  `;

  if (s) {
    html += `
      <div class="toolbar-section">
        <div class="section-label">변환</div>
        <div class="toolbar-row">
          <button class="btn ${s.flipX?'btn-primary':'btn-outline'} btn-icon" onclick="updateSticker(${s.id},{flipX:!${s.flipX}})">⇄</button>
          <button class="btn ${s.flipY?'btn-primary':'btn-outline'} btn-icon" onclick="updateSticker(${s.id},{flipY:!${s.flipY}})">⇅</button>
          <button class="btn btn-outline btn-icon" onclick="updateSticker(${s.id},{rotation:(${s.rotation}+90)%360})">⟳</button>
          <button class="btn btn-outline btn-icon" onclick="updateSticker(${s.id},{rotation:(${s.rotation}-90+360)%360})">⟲</button>
        </div>
      </div>
      <div class="toolbar-section">
        <div class="slider-row"><label>크기</label><input type="range" min="10" max="300" step="5" value="${s.size}" onchange="updateSticker(${s.id},{size:+this.value})"><span class="val">${s.size}%</span></div>
        <div class="slider-row"><label>회전</label><input type="range" min="0" max="360" step="1" value="${s.rotation}" onchange="updateSticker(${s.id},{rotation:+this.value})"><span class="val">${s.rotation}°</span></div>
        <div class="slider-row"><label>밝기</label><input type="range" min="0" max="200" step="5" value="${s.brightness}" onchange="updateSticker(${s.id},{brightness:+this.value})"><span class="val">${s.brightness}%</span></div>
        <div class="slider-row"><label>대비</label><input type="range" min="0" max="200" step="5" value="${s.contrast}" onchange="updateSticker(${s.id},{contrast:+this.value})"><span class="val">${s.contrast}%</span></div>
        <div class="slider-row"><label>채도</label><input type="range" min="0" max="200" step="5" value="${s.saturate}" onchange="updateSticker(${s.id},{saturate:+this.value})"><span class="val">${s.saturate}%</span></div>
      </div>
      <div class="toolbar-section">
        <div class="section-label">테두리</div>
        <div class="color-swatches" style="margin-bottom:8px;">
          ${[null,'#FF6B9D','#FF9671','#FFC75F','#F9F871','#845EC2','#00C9A7','#0081CF'].map(c =>
            `<div class="color-swatch ${s.borderColor===c?'active':''}" style="background:${c||'transparent'}; ${!c?'border:2px dashed #ddd;':''}" onclick="updateSticker(${s.id},{borderColor:${c?`'${c}'`:'null'}, borderWidth:${c?3:0}})"></div>`
          ).join('')}
        </div>
      </div>
      <div class="sep"></div>
      <button class="btn btn-outline btn-sm" style="width:100%; margin-bottom:8px;" onclick="openEditModal(${s.id})">🧽 이미지 편집</button>
      <button class="btn btn-outline btn-sm" style="width:100%; margin-bottom:8px;" onclick="resetSticker(${s.id})">↺ 초기화</button>
    `;
  }

  html += renderAlignToolbar() + `<div class="sep"></div><button class="btn btn-primary" style="width:100%;" onclick="downloadCanvas()">💾 다운로드</button>`;
  el.innerHTML = html;
}

// RENDER ALL
// ════════════════════════════════════════════════
function renderAll() {
  renderCanvas();
  renderUsedList();
  renderRightToolbar();
  const count = allSelectedIds().length;
  document.getElementById('statusInfo').textContent = count >= 2 ? `${count}개 선택됨` : (STATE.stickers.find(x=>x.id===STATE.selectedId) ? '스티커 선택됨' : '스티커를 클릭해 선택하세요');
  document.getElementById('selectAllBtn').style.display = STATE.stickers.length > 0 ? '' : 'none';
  document.getElementById('deleteAllBtn').style.display = STATE.stickers.length > 0 ? '' : 'none';
  if (STATE.mobileTab === 'edit') renderMobileEditPanel();
}

document.addEventListener('mousedown', e => {
  if (e.target.id === 'canvas' || e.target.id === 'canvasMobile') {
    if (e.target === e.currentTarget) {
      STATE.selectedId = null;
      STATE.multiSelectedIds = [];
      renderAll();
    }
  }
});

function init() {
  initTextPanel();
  renderAll();
  fetchStickers();
  renderMobileTabContent();
}

init();
