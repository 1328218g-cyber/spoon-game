<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0b1626">
<title>해적 러시안룰렛 | 에디봇</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  /* 🏴‍☠️ 밤바다 갑판 위 3D 술통 · 오른쪽(좁으면 아래)에 참가자와 채팅 */
  :root {
    --sea: #0b1626; --panel: #13202f; --line: #2a3c52; --ink: #f4ead7; --sub: #b4a68c;
    --gold: #ffc94a; --red: #e2483d; --chip: #0f1a28; --green: #46c46b;
    --disp: "Black Han Sans", "Noto Sans KR", sans-serif; --f: "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: radial-gradient(1200px 600px at 30% -10%, #1f3a58 0%, transparent 60%), var(--sea); color: var(--ink); font-family: var(--f);
    padding: 18px max(14px, env(safe-area-inset-right, 0px)) 22px max(14px, env(safe-area-inset-left, 0px)); min-height: 100vh; }
  .hidden { display: none !important; }
  .wrap { max-width: 1180px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 18px; align-items: start; }
  @media (max-width: 900px) { .wrap { grid-template-columns: 1fr; } }
  header { grid-column: 1 / -1; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { font-family: var(--disp); font-weight: 400; font-size: clamp(30px, 6vw, 54px); margin: 0; letter-spacing: 1px; line-height: 1; color: var(--gold); text-shadow: 0 3px 0 #7a3b12, 0 8px 22px rgba(0,0,0,.55); }
  h1 small { display: block; font-family: var(--f); font-size: 13px; color: var(--sub); letter-spacing: 0; text-shadow: none; margin-top: 8px; font-weight: 500; }
  .status { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 6px 12px; font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .chip b { color: var(--gold); }
  .chip.turnme { background: #3b2c08; border-color: var(--gold); animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 4px rgba(255,201,74,.25); } }

  .stage { position: relative; border-radius: 22px; border: 1px solid var(--line); overflow: hidden; aspect-ratio: 1 / .9; max-width: 100%; background: #0a1220; touch-action: none; cursor: grab; }
  .stage.drag { cursor: grabbing; }
  .stage canvas { display: block; width: 100%; height: 100%; }
  .hint { position: absolute; left: 14px; top: 12px; font-size: 12px; color: var(--sub); background: rgba(8,14,24,.6); padding: 4px 10px; border-radius: 12px; pointer-events: none; }
  .boom { position: absolute; left: 50%; top: 26%; transform: translate(-50%, -50%) scale(0); font-family: var(--disp); font-size: clamp(46px, 10vw, 96px); color: var(--gold); text-shadow: 0 5px 0 #9b2b16, 0 0 34px rgba(255,120,40,.75); pointer-events: none; white-space: nowrap; }
  .boom.on { animation: boom 1.5s ease-out forwards; }
  @keyframes boom { 0% { transform: translate(-50%, -50%) scale(0) rotate(-10deg); opacity: 0; } 22% { transform: translate(-50%, -50%) scale(1.3) rotate(4deg); opacity: 1; } 60% { opacity: 1; } 100% { transform: translate(-50%, -90%) scale(1); opacity: 0; } }
  .loser { position: absolute; left: 50%; bottom: 5%; transform: translateX(-50%); background: rgba(10,16,26,.9); border: 2px solid var(--red); border-radius: 16px; padding: 10px 18px; text-align: center; min-width: 60%; max-width: 92%; }
  .loser b { display: block; font-family: var(--disp); font-weight: 400; font-size: 26px; color: var(--red); }
  .loser span { font-size: 14px; }
  .flash { position: absolute; inset: 0; background: radial-gradient(circle at 50% 40%, rgba(255,220,140,.55), transparent 60%); opacity: 0; pointer-events: none; }
  .flash.on { animation: flash .6s ease-out; }
  @keyframes flash { 10% { opacity: 1; } }
  .lobbyMsg { position: absolute; left: 50%; bottom: 6%; transform: translateX(-50%); background: rgba(10,16,26,.85); border: 1px solid var(--line); border-radius: 14px; padding: 9px 16px; font-size: 14px; font-weight: 700; text-align: center; max-width: 92%; }
  .nogl { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 20px; color: var(--sub); }

  .side { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .card h2 { margin: 0; font-size: 15px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .card h2 small { font-weight: 500; color: var(--sub); font-size: 12px; }
  #chat { height: 300px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; padding-right: 4px; }
  .m { font-size: 13px; line-height: 1.45; padding: 6px 10px; border-radius: 10px; background: #1a2a3e; word-break: break-word; display: flex; gap: 7px; align-items: flex-start; }
  .m .av { width: 22px; height: 22px; border-radius: 50%; object-fit: cover; flex-shrink: 0; background: #0f1a28; }
  .m i { font-style: normal; color: var(--sub); font-weight: 700; margin-right: 6px; }
  .m.me { background: #1d3350; }
  .m.bot { background: #271f36; } .m.bot i { color: #c7b4ff; }
  .m.hit { background: #3a1716; border: 1px solid #7a2a24; } .m.hit i { color: #ff9b8f; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  input[type=text] { flex: 1; min-width: 0; background: var(--chip); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 10px 11px; font: inherit; font-size: 15px; }
  input.turnme { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(255,201,74,.25); }
  button { font: inherit; font-weight: 700; font-size: 14px; border: 0; border-radius: 10px; padding: 10px 14px; background: var(--gold); color: #2a1600; cursor: pointer; }
  button.ghost { background: var(--chip); color: var(--ink); border: 1px solid var(--line); }
  button:disabled { opacity: .5; cursor: default; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  label.ck { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--sub); }
  .players { display: flex; flex-direction: column; gap: 6px; }
  .pl { display: flex; align-items: center; gap: 8px; font-size: 13px; background: var(--chip); border: 1px solid var(--line); border-radius: 12px; padding: 7px 10px; }
  .pl.now { border-color: var(--gold); background: #2a2208; }
  .pl.lose { border-color: var(--red); background: #2a1210; }
  .pl .no { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 900; color: #10161f; flex-shrink: 0; }
  .pl .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 700; }
  .pl .hs { color: var(--sub); font-size: 12px; white-space: nowrap; }
  .empty { color: var(--sub); font-size: 13px; text-align: center; padding: 8px 0; }

  .auth { max-width: 460px; margin: 30px auto 0; text-align: center; }
  .authCode { font-family: var(--disp); font-size: 40px; letter-spacing: 8px; color: var(--gold); background: var(--chip); border-radius: 16px; padding: 14px; }
  .authCmd { font-size: 14px; color: var(--sub); }
  .authCmd code { background: var(--chip); color: var(--ink); padding: 3px 8px; border-radius: 8px; font-weight: 700; }
  .toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); background: #3a1716; border: 1px solid #7a2a24; color: #fff; padding: 10px 16px; border-radius: 18px; font-size: 13px; font-weight: 700; z-index: 60; max-width: calc(100% - 32px); text-align: center; }
  @media (prefers-reduced-motion: reduce) { .boom.on, .flash.on, .chip.turnme { animation-duration: .01s; } }
</style>
</head>
<body>

<div class="card auth hidden" id="loadingCard"><p class="empty">불러오는 중…</p></div>
<div class="card auth hidden" id="errorCard"><p class="empty" id="errorText" style="color:#ff9b8f"></p></div>
<div class="card auth hidden" id="authCard">
  <h1 style="font-size:34px">🏴‍☠️ 해적 러시안룰렛<small>들어가려면 본인 인증을 해주세요</small></h1>
  <p class="authCmd">방송 채팅에 아래 코드를 쳐주세요 (내정보 웹페이지·시청자 페이지에서 인증했으면 같은 기기에선 바로 들어가져요)</p>
  <div class="authCode" id="authCode">------</div>
  <div class="authCmd">채팅에 <code id="authCmdText">코드</code> 입력</div>
  <p class="authCmd" id="authTimer"></p>
  <button class="ghost" onclick="registerCode()">🔄 새 코드 받기</button>
</div>

<div class="wrap hidden" id="mainWrap">
  <header>
    <h1>🏴‍☠️ 해적 러시안룰렛<small>참가한 순서대로 내 차례에 술통을 돌려서 구멍을 눌러요 · 선장이 튀어나오면 당첨!</small></h1>
    <div class="status"><span class="chip">남은 구멍 <b id="left">-</b></span><span class="chip">참가 <b id="pcount">0</b>명</span><span class="chip" id="turn">대기 중</span></div>
  </header>

  <div class="stage" id="stage">
    <div class="hint">드래그해서 돌려보기 · 내 차례엔 찌를 구멍을 눌러요</div>
    <div class="flash" id="flash"></div>
    <div class="boom" id="boom">퉁!</div>
    <div class="loser hidden" id="loser"><b id="loserName"></b><span id="loserSub"></span></div>
    <div class="lobbyMsg hidden" id="lobbyMsg"></div>
  </div>

  <div class="side">
    <div class="card">
      <h2>🙋 참가자 <small id="meLine"></small></h2>
      <div class="players" id="players"></div>
      <div class="row">
        <button id="joinBtn" onclick="act('join')">🙋 참가</button>
        <button id="leaveBtn" class="ghost hidden" onclick="act('leave')">참가 취소</button>
        <button id="startBtn" class="hidden" onclick="act('start')">🏴‍☠️ 시작</button>
      </div>
      <label class="ck"><input type="checkbox" id="snd"> 효과음</label>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const PATH_PARTS = location.pathname.split('/').filter(Boolean); // ['pirate','djId']
const DJ_ID = decodeURIComponent(PATH_PARTS[1] || '');
const API = location.origin + '/pirate/' + encodeURIComponent(DJ_ID);
const LS_KEY = 'myinfo_webUserId_' + DJ_ID; // 내정보 웹페이지와 같은 인증
let webUserId = ''; try { webUserId = localStorage.getItem(LS_KEY) || ''; } catch (_) {}
let pollTimer = null, countdownTimer = null, codeExpiresAt = 0, stateTimer = null;

const $ = (id) => document.getElementById(id);
const show = (id) => $(id).classList.remove('hidden');
const hide = (id) => $(id).classList.add('hidden');
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function toast(msg) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }
const post = (p, body) => fetch(API + p, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ webUserId, ...(body || {}) }) }).then((r) => r.json());

/* 🔐 인증 — 내정보 웹페이지 register/me 그대로 */
function showError(msg) { hide('loadingCard'); hide('authCard'); hide('mainWrap'); $('errorText').textContent = msg; show('errorCard'); }
async function registerCode() {
  hide('authCard'); hide('mainWrap'); hide('errorCard'); show('loadingCard'); clearInterval(stateTimer);
  try {
    const d = await post('/register');
    hide('loadingCard');
    if (!d.success) return showError(d.error || '오류가 발생했어요');
    webUserId = d.webUserId; try { localStorage.setItem(LS_KEY, webUserId); } catch (_) {}
    codeExpiresAt = Date.now() + (d.expiresInSec || 600) * 1000;
    $('authCode').textContent = d.code; $('authCmdText').textContent = (d.cmd || '!내정보인증') + ' ' + d.code;
    show('authCard'); startCountdown(); startAuthPolling();
  } catch (e) { hide('loadingCard'); showError('연결에 실패했어요. 새로고침 해주세요.'); }
}
function startCountdown() {
  clearInterval(countdownTimer);
  countdownTimer = setInterval(() => {
    const remain = Math.max(0, Math.floor((codeExpiresAt - Date.now()) / 1000));
    $('authTimer').textContent = remain > 0 ? `코드 유효시간 ${String(Math.floor(remain / 60)).padStart(2, '0')}:${String(remain % 60).padStart(2, '0')}` : '코드가 만료됐어요. 새 코드를 받아주세요.';
    if (remain <= 0) clearInterval(countdownTimer);
  }, 1000);
}
function startAuthPolling() {
  clearInterval(pollTimer);
  pollTimer = setInterval(async () => {
    try { const d = await (await fetch(API + '/me?webUserId=' + encodeURIComponent(webUserId))).json(); if (d.success && d.linked) { clearInterval(pollTimer); clearInterval(countdownTimer); hide('authCard'); enter(); } } catch (e) {}
  }, 3000);
}

/* 🎮 게임 화면 */
let ST = null, seq = 0, entered = false;
async function enter() {
  show('loadingCard');
  const ok = await poll(true);
  hide('loadingCard');
  if (!ok) return;
  show('mainWrap'); entered = true; G.resize();
  clearInterval(stateTimer); stateTimer = setInterval(() => poll(false), 1000);
}
async function poll(first) {
  try {
    const d = await (await fetch(API + '/state?webUserId=' + encodeURIComponent(webUserId) + '&since=' + seq)).json();
    if (!d.success) { clearInterval(stateTimer); if (d.needAuth) { registerCode(); return false; } showError(d.error || '오류가 발생했어요'); return false; }
    if ((d.seq || 0) < seq) return true; // (늦게 온 예전 응답은 버려요)
    ST = d;
    (d.chat || []).forEach((m) => { if (m.seq > seq) { seq = m.seq; addMsg(m, first); } }); // (겹친 요청으로 같은 글이 두 번 붙지 않게)
    ST = d; render(first); return true;
  } catch (e) { if (first) showError('연결에 실패했어요. 새로고침 해주세요.'); return false; }
}
function addMsg(m, first) {
  const box = $('chat'); if (!box) return; // (채팅 칸은 뺐어요)
  const el = document.createElement('div');
  el.className = 'm ' + (m.cls || '') + (m.tag && ST && m.tag === ST.me ? ' me' : '');
  const av = m.cls === 'bot' || m.cls === 'hit' ? '' : (m.img ? `<img class="av" src="${esc(m.img)}" alt="" onerror="this.remove()">` : '');
  el.innerHTML = `${av}<div><i style="${m.color ? 'color:' + esc(m.color) : ''}">${esc(m.nick)}</i>${esc(m.text)}</div>`;
  const stick = box.scrollTop + box.clientHeight >= box.scrollHeight - 30;
  box.appendChild(el); while (box.children.length > 120) box.firstChild.remove();
  if (stick) box.scrollTop = box.scrollHeight;
}
function render(first) {
  const d = ST; const myTurn = d.phase === 'play' && d.turn === d.me; const tp = d.players.find((p) => p.tag === d.turn);
  const usedN = new Map(d.used.map((u) => [u.n, u]));
  $('left').textContent = d.phase === 'lobby' ? d.holes : d.holes - d.used.length;
  $('pcount').textContent = d.players.length;
  const tc = $('turn'); tc.classList.toggle('turnme', myTurn);
  tc.innerHTML = d.phase === 'lobby' ? '참가 모집 중' : d.phase === 'over' ? '판 끝' : myTurn ? `<b>내 차례!</b> ${d.turnLeft}초` : `${esc(tp ? tp.nick : '')} 차례 · ${d.turnLeft}초`;
  $('meLine').textContent = (d.nick || '') + '님' + (d.joined ? ' · 참가 중' : '');
  $('players').innerHTML = d.players.length ? d.players.map((p, i) => {
    const hs = d.used.filter((u) => u.nick === p.nick).map((u) => u.n + '번').join(' ');
    const cls = 'pl' + (d.phase === 'play' && p.tag === d.turn ? ' now' : '') + (d.loser && d.loser.tag === p.tag ? ' lose' : '');
    return `<div class="${cls}"><span class="no" style="background:${esc(p.color)}">${i + 1}</span><span class="nm">${esc(p.nick)}${p.tag === d.me ? ' (나)' : ''}</span><span class="hs">${d.loser && d.loser.tag === p.tag ? '💥 당첨' : d.phase === 'play' && p.tag === d.turn ? '🗡️ 차례' : esc(hs)}</span></div>`;
  }).join('') : '<div class="empty">아직 참가자가 없어요 · [참가] 를 눌러주세요</div>';
  $('joinBtn').classList.toggle('hidden', !((d.phase === 'lobby' && !d.joined) || d.phase === 'over'));
  $('joinBtn').textContent = d.phase === 'over' ? '🙋 다음 판 참가' : '🙋 참가';
  $('leaveBtn').classList.toggle('hidden', !(d.phase === 'lobby' && d.joined));
  $('startBtn').classList.toggle('hidden', !(d.phase === 'lobby' && d.joined));
  $('startBtn').disabled = d.players.length < 2;
  const lm = $('lobbyMsg');
  if (d.phase === 'lobby') { lm.textContent = d.players.length < 2 ? '⚓ 2명 이상 참가하면 시작할 수 있어요' : '🏴‍☠️ 참가한 사람 누구나 [시작] 을 누를 수 있어요'; show('lobbyMsg'); } else hide('lobbyMsg');
  G.sync(d, first, usedN);
}
async function act(a) {
  try { const d = await post('/' + a); if (!d.success) { if (d.needAuth) return registerCode(); toast('⚠️ ' + (d.error || '실패했어요')); } poll(false); } catch (e) { toast('⚠️ 연결에 실패했어요'); }
}
function pickHole(n) { if (!ST || ST.phase !== 'play' || ST.turn !== ST.me) return; post('/stab', { n }).then((d) => { if (d && !d.success && d.error) toast('⚠️ ' + d.error); poll(false); }).catch(() => {}); }

/* 🛢️ 3D 술통 (three.js) */
const G = (() => {
  const noop = { sync() {}, resize() {} };
  const stage = $('stage');
  if (!window.THREE) { stage.insertAdjacentHTML('beforeend', '<div class="nogl">3D 그림 도구를 못 불러왔어요. 새로고침해 주세요.</div>'); return noop; }
  const T = THREE;
  let renderer;
  try { renderer = new T.WebGLRenderer({ antialias: true }); } catch (e) { stage.insertAdjacentHTML('beforeend', '<div class="nogl">이 기기에서는 3D 화면을 그릴 수 없어요. (채팅으로는 그대로 할 수 있어요)</div>'); return noop; }
  renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = T.PCFSoftShadowMap;
  renderer.outputEncoding = T.sRGBEncoding; renderer.toneMapping = T.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.15;
  stage.prepend(renderer.domElement);
  const scene = new T.Scene(); scene.background = new T.Color('#0a1220'); scene.fog = new T.Fog('#0a1220', 9, 20);
  const camera = new T.PerspectiveCamera(36, 1, .1, 60); camera.position.set(0, 2.9, 9.4); camera.lookAt(0, 1.75, 0);
  scene.add(new T.HemisphereLight('#7fa6d8', '#2a1608', .55));
  const key = new T.DirectionalLight('#ffe2b0', 1.25); key.position.set(3.5, 6, 4); key.castShadow = true; key.shadow.mapSize.set(1024, 1024);
  Object.assign(key.shadow.camera, { left: -4, right: 4, top: 5, bottom: -2, near: 1, far: 20 }); scene.add(key);
  const lantern = new T.PointLight('#ff9a3c', 1.4, 9, 2); lantern.position.set(-2.6, 3.1, 1.6); scene.add(lantern);
  const lampMesh = new T.Mesh(new T.SphereGeometry(.13, 16, 12), new T.MeshBasicMaterial({ color: '#ffcc66' })); lampMesh.position.copy(lantern.position); scene.add(lampMesh);
  const rim = new T.DirectionalLight('#6fb3ff', .55); rim.position.set(-4, 3, -5); scene.add(rim);

  function woodTex(w, h, staves, base, dark) {
    const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d');
    const sw = w / staves;
    for (let i = 0; i < staves; i++) {
      const g = x.createLinearGradient(i * sw, 0, (i + 1) * sw, 0);
      const k = .85 + Math.random() * .25; const col = (a) => `rgb(${Math.round(base[0] * k * a)},${Math.round(base[1] * k * a)},${Math.round(base[2] * k * a)})`;
      g.addColorStop(0, col(.72)); g.addColorStop(.5, col(1)); g.addColorStop(1, col(.72)); x.fillStyle = g; x.fillRect(i * sw, 0, sw, h);
      x.strokeStyle = `rgba(${dark},.35)`; x.lineWidth = 1;
