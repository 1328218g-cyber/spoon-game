<svg viewBox="0 0 900 310" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, sans-serif">
  <rect x="0" y="0" width="900" height="310" rx="14" fill="#f4fafd"/>
  <!-- toolbar -->
  <g transform="translate(60,30)">
    <rect x="0" y="0" width="780" height="34" rx="10" fill="#ffffff" stroke="#d7ecf5" stroke-width="2"/>
    <circle cx="700" cy="17" r="12" fill="#eaf6fb" stroke="#fb923c" stroke-width="2.5"/>
    <!-- puzzle piece icon -->
    <g transform="translate(692,9)">
      <path d="M0 4 h6 a3 3 0 1 1 0 6 v4 h-6 v-4 a3 3 0 1 1 0-6 z" fill="#0ea5e9"/>
    </g>
    <text x="700" y="-8" text-anchor="middle" font-size="12" font-weight="700" fill="#fb923c">① 클릭</text>
  </g>
  <!-- popup -->
  <g transform="translate(560,74)">
    <rect x="0" y="0" width="260" height="190" rx="12" fill="#17181c" stroke="#0ea5e9" stroke-width="2.5"/>
    <text x="130" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">🔑 에디봇 세션 연결</text>
    <text x="20" y="56" font-size="11" fill="#ccc">봇 대시보드 아이디</text>
    <rect x="20" y="62" width="220" height="24" rx="6" fill="#23242b" stroke="#333" stroke-width="1"/>
    <text x="20" y="102" font-size="11" fill="#ccc">봇 대시보드 비밀번호</text>
    <rect x="20" y="108" width="220" height="24" rx="6" fill="#23242b" stroke="#333" stroke-width="1"/>
    <rect x="20" y="146" width="220" height="30" rx="8" fill="#0ea5e9"/>
    <text x="130" y="166" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">저장하고 지금 동기화</text>
  </g>
  <g stroke="#fb923c" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M745 66 C 720 90, 700 100, 690 110"/>
