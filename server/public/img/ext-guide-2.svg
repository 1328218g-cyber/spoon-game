<svg viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, sans-serif">
  <rect x="0" y="0" width="900" height="260" rx="14" fill="#f4fafd"/>
  <!-- browser window -->
  <g transform="translate(60,30)">
    <rect x="0" y="0" width="780" height="170" rx="12" fill="#ffffff" stroke="#d7ecf5" stroke-width="2"/>
    <!-- title bar -->
    <rect x="0" y="0" width="780" height="34" rx="12" fill="#eaf6fb"/>
    <circle cx="20" cy="17" r="6" fill="#fca5a5"/>
    <circle cx="40" cy="17" r="6" fill="#fde68a"/>
    <circle cx="60" cy="17" r="6" fill="#86efac"/>
    <!-- address bar -->
    <rect x="90" y="7" width="360" height="20" rx="10" fill="#fff" stroke="#d7ecf5" stroke-width="1.5"/>
    <text x="104" y="21" font-size="12" fill="#0ea5e9" font-family="Consolas,monospace">chrome://extensions</text>
    <!-- page content -->
    <text x="24" y="66" font-size="16" font-weight="700" fill="#0f2a3a">확장 프로그램</text>
    <!-- dev mode toggle, highlighted -->
    <g transform="translate(560,44)">
      <rect x="-140" y="-14" width="200" height="40" rx="10" fill="#fff7ed" stroke="#fb923c" stroke-width="2.5"/>
      <text x="-120" y="10" font-size="13" font-weight="700" fill="#0f2a3a">개발자 모드</text>
      <rect x="10" y="-8" width="36" height="18" rx="9" fill="#0ea5e9"/>
      <circle cx="37" cy="1" r="8" fill="#fff"/>
    </g>
    <!-- extension card placeholder -->
    <rect x="24" y="90" width="220" height="60" rx="10" fill="#eaf6fb" stroke="#d7ecf5" stroke-width="1.5"/>
    <rect x="36" y="102" width="80" height="10" rx="4" fill="#bfe3f0"/>
    <rect x="36" y="120" width="140" height="8" rx="4" fill="#d7ecf5"/>
  </g>
  <!-- pointer to toggle -->
  <g stroke="#fb923c" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M760 130 C 700 170, 660 120, 630 80" />
    <polyline points="646,72 630,80 636,98"/>
  </g>
  <text x="450" y="235" text-anchor="middle" font-size="16" font-weight="700" fill="#0f2a3a">② 주소창에 chrome://extensions 입력 → ③ 오른쪽 위 "개발자 모드" 켜기</text>
</svg>
